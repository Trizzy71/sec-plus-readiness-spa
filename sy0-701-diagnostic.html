{d:4,o:"4.2",t:"Asset tracking through changes",df:3,q:"An organization discovers 60 laptops in its EDR console that do not appear in its asset inventory. What is the MOST significant security consequence?",a:["Unknown assets get no baseline, no patch schedule, and no owner","The organization overpays for EDR licences","Asset depreciation is misreported in the ledger","Vulnerability scan runtimes increase noticeably"],c:0,e:"You cannot protect what you do not know you own. Untracked assets fall outside patching, configuration enforcement, classification, and offboarding, and they are frequently where a breach begins."},
{d:4,o:"4.3",t:"Threat intelligence sources",df:2,q:"An organization in the electricity sector wants sector-specific threat intelligence shared by peer organizations. Which source is designed for this?",a:["A sector information sharing and analysis center","A commercial dark web monitoring service","The vendor's own release notes","A public internet search engine"],c:0,e:"ISACs are sector-specific member organizations that share indicators and analysis among peers facing common adversaries. Proprietary feeds, OSINT, and dark web monitoring are complementary but not peer-based."},
{d:4,o:"4.3",t:"Responsible disclosure & bug bounty",df:2,q:"A researcher reports a flaw privately, waits for a fix, and receives a payment under a published program. Which two practices does this describe? (Select TWO.)",a:["Responsible disclosure","A bug bounty program","A penetration test under a statement of work","An internal system audit"],c:[0,1],m:true,e:"Responsible disclosure is the practice of reporting privately and allowing time to remediate. A bug bounty is the structured, incentivized program that formalizes it. Neither is a contracted penetration test."},
{d:4,o:"4.3",t:"Risk tolerance in remediation",df:3,q:"Two organizations receive the same vulnerability report. One patches within 24 hours; the other schedules the work for the next quarterly window. Which factor BEST explains the difference?",a:["Differing risk tolerance and organizational impact","One organization has a better vulnerability scanner","One organization uses CVSS and the other does not","The CVE was published on different dates for each"],c:0,e:"The same technical finding produces different responses because risk is contextual. Risk tolerance, exposure, data sensitivity, and regulatory pressure legitimately drive different remediation timelines."},
{d:4,o:"4.4",t:"Log aggregation and archiving",df:2,q:"Why is forwarding logs to a central platform in near real time considered a security control rather than an operational convenience?",a:["Evidence survives an attacker who clears the local logs","It reduces disk usage on the source host significantly","It allows the source host to run without a clock","It removes the need to protect the source host at all"],c:0,e:"Local logs are under the attacker's control once the host is compromised. Immediate forwarding puts a copy outside their reach, which is what makes reconstruction of the intrusion possible."},
{d:4,o:"4.4",t:"SNMP traps",df:2,q:"Which monitoring mechanism has a network device send an unsolicited notification to a management station when a defined condition occurs?",a:["An SNMP trap","A NetFlow export","A syslog poll request","A vulnerability scan"],c:0,e:"Traps are device-initiated and push-based, so they report events promptly without waiting for a poll. Note that SNMPv3 is required for authenticated, encrypted transport."},
{d:4,o:"4.4",t:"Monitoring infrastructure vs applications",df:3,q:"A payment application is up and responding to health checks, but customers cannot complete purchases because a downstream authorization service is silently failing. Which monitoring gap does this reveal?",a:["Infrastructure monitoring without application monitoring","Insufficient log retention on the web tier","Missing physical security monitoring coverage","An untuned intrusion detection signature"],c:0,e:"Systems, applications, and infrastructure are separate monitoring targets. A host that is up tells you nothing about whether the business transaction succeeds; synthetic transactions and application telemetry close that gap."},
{d:4,o:"4.5",t:"IDS signatures vs trends",df:3,q:"An IDS is configured to alert on statistical deviation from normal traffic volumes and protocol mixes rather than on known patterns. Which detection approach is this, and what is its main drawback?",a:["Trend or anomaly based; it finds novel attacks but needs a reliable baseline","Signature based detection; it cannot detect novel attacks","Heuristic detection; it requires no baseline period","Reputation based detection; it depends entirely on third-party feeds"],c:0,e:"Anomaly and trend detection catches what no signature covers, at the cost of tuning burden and sensitivity to a baseline captured during a period that must itself have been clean."},
{d:4,o:"4.5",t:"Web filter approaches",df:2,q:"A company must apply the same web filtering policy to laptops whether they are in the office or at home. Which approach fits BEST?",a:["An agent-based web filter installed on each endpoint","A centralized proxy appliance in the corporate data center","A firewall rule on the office perimeter","A DHCP option applied on the corporate LAN"],c:0,e:"Agent-based filtering enforces policy wherever the device is. A centralized on-premises proxy only applies when traffic reaches it, which means remote devices are unprotected unless traffic is backhauled."},
{d:4,o:"4.5",t:"File integrity monitoring",df:2,q:"Which control alerts when a system binary or configuration file is modified outside an approved change?",a:["File integrity monitoring","Data loss prevention","Network access control","User behavior analytics"],c:0,e:"FIM baselines cryptographic hashes of critical files and reports deviations. It is a core requirement in several compliance regimes and a reliable detector of persistence and tampering."},
{d:4,o:"4.6",t:"Federation",df:3,q:"Employees of an acquired subsidiary must access the parent company's applications using their existing subsidiary credentials, without accounts being created in the parent directory. Which approach is this?",a:["Federation, establishing a trust between the two identity providers","Provisioning duplicate accounts in the parent directory","Sharing a single service account between both organizations","Extending the parent's password policy to the subsidiary"],c:0,e:"Federation lets one organization accept authentication assertions issued by another's identity provider. Users keep one credential, and deprovisioning at the source removes access everywhere."},
{d:4,o:"4.6",t:"Attestation and access review",df:2,q:"Every quarter, managers are required to review and confirm the access rights held by each of their direct reports. Which IAM activity is this?",a:["Access attestation, or recertification","Identity proofing of the user","Account provisioning","Identity federation"],c:0,e:"Attestation catches privilege creep, where users accumulate rights across role changes and never lose the old ones. It is a recurring control, distinct from the one-time proofing done at account creation."},
{d:4,o:"4.6",t:"Time-of-day restrictions",df:2,q:"A manufacturing operator account should function only during that operator's shift. Which access control mechanism enforces this?",a:["Time-of-day restrictions, a form of rule-based access control","Mandatory access control using clearance labels","Discretionary access control set by the file owner","Identity proofing at each logon"],c:0,e:"Time-of-day restrictions are conditions evaluated by rule rather than by identity or role alone. They shrink the window in which stolen credentials are usable."},
{d:4,o:"4.6",t:"Passwordless and security keys",df:3,q:"An organization deploys FIDO2 hardware security keys and disables passwords for its administrators. Which threat is MOST directly eliminated?",a:["Credential phishing and credential replay","Insider misuse of legitimate access","Physical theft of the administrator's laptop","Denial of service against the identity provider"],c:0,e:"Phishing-resistant authenticators bind the assertion to the true origin, so a lookalike site cannot obtain anything reusable. They do not address an authorized insider, device theft, or availability."},
{d:4,o:"4.7",t:"Resource provisioning automation",df:2,q:"Which security benefit follows MOST directly from provisioning cloud resources exclusively through automated templates?",a:["Resources are built from a known-good configuration, so drift is reduced","Cloud costs are guaranteed to decrease each month","Vulnerability scanning becomes unnecessary afterwards","Identity and access management can be simplified to a single role"],c:0,e:"Automated provisioning enforces the standard configuration by construction. Manual console changes are where inconsistency and insecure defaults enter, which is why guard rails and drift detection accompany it."},
{d:4,o:"4.7",t:"Ticket creation and escalation",df:2,q:"An orchestration playbook automatically opens a ticket, assigns it to the on-call analyst, and escalates to a manager if unacknowledged after 15 minutes. Which automation use cases are these?",a:["Ticket creation and escalation","Guard rails and security groups","Continuous integration and testing","User and resource provisioning"],c:0,e:"Ticket creation and escalation are named automation use cases. They matter because they make response times measurable and remove the risk of an alert simply being missed."},
{d:4,o:"4.7",t:"Technical debt in automation",df:3,q:"A security team has 200 undocumented automation scripts written by staff who have since left. Which consideration does this represent, and what is the risk?",a:["Technical debt and supportability; nobody can safely modify the scripts","Workforce multiplier; the team is more efficient than its headcount suggests","Guard rails; the scripts prevent insecure configurations","Reaction time; the team responds faster to incidents"],c:0,e:"Automation carries maintenance cost. Undocumented, unowned scripts with production privileges are both an operational fragility and a security exposure, since nobody can review what they actually do."},
{d:4,o:"4.7",t:"Integrations and APIs",df:2,q:"What is the primary security consideration when connecting a SOAR platform to endpoint, identity, and cloud systems through their APIs?",a:["Integration credentials hold broad privilege and must be scoped and rotated","API integrations remove the need for logging on the connected systems","APIs cannot be used by attackers because they require a token","Integrations eliminate the need for network segmentation"],c:0,e:"The orchestrator becomes one of the most privileged identities in the estate. Scope each integration to the minimum actions needed, store credentials in a vault, rotate them, and monitor their use closely."},
{d:4,o:"4.8",t:"Eradication vs recovery",df:3,q:"After isolating affected hosts, the team removes the attacker's persistence mechanisms and closes the exploited vulnerability, then restores services and monitors closely. Which two phases are these, in order?",a:["Eradication, then recovery","Containment, then eradication","Recovery, then lessons learned","Analysis, then containment"],c:0,e:"Eradication removes the adversary and the root cause. Recovery returns systems to production with heightened monitoring to confirm the environment is genuinely clean. Restoring before eradicating simply reinfects."},
{d:4,o:"4.8",t:"Root cause analysis",df:2,q:"During lessons learned, the team determines that the intrusion succeeded because a decommissioning process left an unmanaged server on the network. Which activity produced this finding?",a:["Root cause analysis","Threat hunting","E-discovery","Chain of custody documentation"],c:0,e:"Root cause analysis asks why the incident was possible, not merely how it unfolded. The answer is usually a process or control gap, and fixing it prevents recurrence rather than repeating the cleanup."},
{d:4,o:"4.8",t:"Legal hold",df:3,q:"Counsel notifies IT that litigation is anticipated involving a specific business unit. What must happen to that unit's data?",a:["A legal hold is issued, suspending routine deletion of relevant data","The data is immediately encrypted and archived offline","The data is deleted according to the standard retention schedule","The data is transferred to the opposing party"],c:0,e:"A legal hold overrides normal retention and deletion. Continuing to delete after a hold is issued constitutes spoliation and carries serious legal consequences independent of the underlying case."},
{d:4,o:"4.8",t:"Tabletop vs simulation",df:2,q:"Which incident response test involves participants discussing their roles and decisions around a table, with no systems touched?",a:["A tabletop exercise","A simulation","A failover test","A parallel processing test"],c:0,e:"A tabletop validates the plan, roles, and decision-making cheaply and safely. A simulation acts the scenario out with real tooling, and a failover test actually moves production."},
{d:4,o:"4.9",t:"Firewall log interpretation",df:3,q:"A firewall log line shows a repeated ACCEPT for an internal host to an external IP on TCP/443 every 60 seconds, with a small and nearly identical byte count each time. What does this pattern suggest?",a:["Command-and-control beaconing on a fixed interval","Normal software update checking, which is always benign","A denial of service attack against the internal host","A misconfigured NTP client on the host"],c:0,e:"Regular intervals with low, consistent volume are the signature of automated check-in traffic. Legitimate update checks can look similar, which is why the destination reputation and process attribution on the host settle it."},
{d:4,o:"4.9",t:"OS security log events",df:3,q:"An investigator must determine which account was used for an interactive logon to a Windows server and whether it succeeded. Which log and event should be examined?",a:["The Security event log, for logon success and failure events","The Application event log, for service startup entries","The firewall log, for permitted sessions","The DNS server log, for resolution requests"],c:0,e:"Authentication outcomes are recorded in the OS security log, including account name, logon type, and source. Firewall logs show connectivity, not which identity was used."},
{d:4,o:"4.9",t:"Endpoint logs",df:2,q:"Which data source shows the full process ancestry of a suspicious executable, including the parent process that launched it?",a:["Endpoint detection and response telemetry","NetFlow records","The perimeter firewall log","The DHCP lease table"],c:0,e:"Process lineage is host-level data that only an endpoint agent records. It is central to distinguishing a user-launched program from one spawned by an exploited service or a malicious document."},
{d:4,o:"4.9",t:"Automated reports and dashboards",df:2,q:"What is the primary limitation of relying on dashboards and automated reports during an investigation?",a:["Aggregated, pre-filtered views may omit the raw evidence","They cannot be scheduled to run automatically overnight","They are only available to executives and auditors","They cannot display data from more than one source"],c:0,e:"Aggregation is what makes dashboards readable and also what hides detail. They are excellent for spotting that something is wrong and insufficient for proving exactly what happened; investigators go back to raw logs and captures."},
{d:4,o:"4.9",t:"Correlating across sources",df:3,q:"An analyst has a suspicious external IP address and must determine which internal user was responsible. Which sequence of sources is MOST effective?",a:["NetFlow for the IP and time, DHCP to map it to a host, then OS logs for the user","OS security logs first, then the vulnerability scan report, then the asset inventory","Packet capture only, since it contains everything needed","The SIEM dashboard alone, since it aggregates all sources"],c:0,e:"Investigation moves from network to host to identity. The critical and often-missed link is DHCP or DNS, because an internal IP address alone does not identify a machine over time in a dynamic environment."},
/* ==== ADDITIONS: Domain 5 ==== */
{d:5,o:"5.1",t:"Guidelines vs policy",df:2,q:"A document recommends, but does not require, that teams enable multifactor authentication on personal developer accounts. What is this document?",a:["A guideline","A policy","A standard","A procedure"],c:0,e:"Guidelines are advisory and allow discretion. If compliance is mandatory the document is a policy or standard, and the difference in enforceability matters when an auditor asks why a control was not applied."},
{d:5,o:"5.1",t:"External governance considerations",df:3,q:"A company operating in the EU, the US, and Singapore must reconcile conflicting breach notification deadlines. Which governance consideration is this?",a:["External requirements arising from regulation across multiple jurisdictions","Internal governance structure, resolved by forming a committee","A vendor monitoring issue, resolved through a questionnaire","A change management issue, resolved through the CAB"],c:0,e:"External considerations are the regulatory, legal, industry, and geographic requirements the organization does not control. Multinational operations usually resolve conflicts by designing to the strictest applicable requirement."},
{d:5,o:"5.1",t:"Monitoring and revision of governance",df:2,q:"Why must policies carry a defined review cycle and owner?",a:["Threats, technology, and regulation change around a static policy","Auditors require policies to be rewritten annually regardless of content","Review cycles are needed to calculate the security budget","Policies expire automatically after 12 months by law"],c:0,e:"Governance is a loop, not a one-time act. Monitoring and revision keep policy aligned with the environment, and a named owner is what makes the review actually happen."},
{d:5,o:"5.2",t:"Qualitative vs quantitative analysis",df:3,q:"A risk is rated High likelihood and Moderate impact on a five-by-five matrix because reliable loss data does not exist. Which analysis method is this, and what is its main limitation?",a:["Qualitative analysis; subjective ratings are not directly comparable","Quantitative analysis; it requires an accurate asset valuation","Qualitative analysis; it always overstates risk","Quantitative analysis; it cannot express likelihood"],c:0,e:"Qualitative analysis is fast and works without loss data, but its outputs are relative rather than monetary, so they cannot be set directly against a control budget. Quantitative analysis produces SLE, ARO, and ALE for exactly that comparison."},
{d:5,o:"5.2",t:"Residual and inherent risk",df:3,q:"A risk assessed at high severity before controls is rated moderate after controls are applied. What are these two measures called?",a:["Inherent risk before controls, residual risk after controls","Residual risk before controls, inherent risk after controls","Risk appetite before controls, risk tolerance after controls","Exposure factor before controls, annualized loss after controls"],c:0,e:"Inherent risk is the raw exposure with no controls; residual risk is what remains after treatment and is the figure the risk owner formally accepts. Any residual risk above the threshold requires further treatment or a documented exception."},
{d:5,o:"5.2",t:"Risk reporting",df:2,q:"Which characteristic makes risk reporting to the board effective?",a:["It expresses risk in business terms with trend and treatment status","It lists every open vulnerability by CVE identifier","It presents raw SIEM alert counts for the period","It focuses on the technical detail of each control"],c:0,e:"Boards make funding and acceptance decisions, so reporting must connect risk to business consequence and show whether exposure is improving. Technical inventories belong in operational reporting."},
{d:5,o:"5.3",t:"Supply chain analysis",df:3,q:"Before contracting a software vendor, a company examines who supplies that vendor's components and where they are manufactured. Which vendor assessment activity is this?",a:["Supply chain analysis, covering the vendor's own suppliers","A right-to-audit exercise against the direct vendor","Vendor monitoring after the contract is awarded","A rules of engagement negotiation with the vendor"],c:0,e:"Fourth-party risk is real: your vendor's suppliers can compromise you. Supply chain analysis maps that chain so a dependency on an unacceptable source is found before the contract is signed."},
{d:5,o:"5.3",t:"Independent assessments",df:2,q:"A vendor offers three artifacts. Which provides the STRONGEST assurance of its control environment?",a:["An independent third-party audit report, such as a SOC 2 Type II","A completed self-assessment questionnaire","A summary of the vendor's internal audit findings","A statement on the vendor's website describing its security program"],c:0,e:"Independence and a period of operation are what make a report credible. A Type II covers effectiveness over time, whereas a Type I covers design at a single point, and a self-assessment carries an inherent conflict of interest."},
{d:5,o:"5.3",t:"NDA scope",df:2,q:"Which agreement is signed before a vendor is shown the organization's architecture diagrams during a procurement evaluation?",a:["A non-disclosure agreement","A service level agreement","A statement of work","A business partners agreement"],c:0,e:"An NDA governs the confidentiality of information exchanged and is normally the first document signed, often before commercial terms are discussed at all."},
{d:5,o:"5.4",t:"Automation in compliance monitoring",df:2,q:"What is the primary benefit of automating compliance monitoring rather than performing periodic manual checks?",a:["Continuous evidence of control operation between audits","It removes the need for an external audit entirely","It transfers compliance accountability to the tooling vendor","It eliminates the need for policy documentation"],c:0,e:"Manual checks produce point-in-time snapshots and long blind intervals. Automation produces continuous evidence, which both shortens the time to detect a control failure and reduces audit effort."},
{d:5,o:"5.4",t:"Data inventory and retention",df:3,q:"Which capability is the prerequisite for honoring a data subject access or erasure request within a regulatory deadline?",a:["A data inventory recording what is held, where, and for how long","A data loss prevention policy on outbound email","An incident response playbook for privacy breaches","A signed processor agreement with each vendor"],c:0,e:"You cannot produce or delete what you cannot locate. The data inventory, with retention schedules, is what makes subject rights operationally achievable rather than theoretical."},
{d:5,o:"5.4",t:"Controller obligations on breach",df:3,q:"A processor suffers a breach affecting personal data it handles for a controller. Who is responsible for notifying the supervisory authority and the affected individuals?",a:["The controller, though the processor must notify it promptly","The processor, since the breach occurred in its environment","Neither party, if the processor restores the data quickly","The individuals' internet service provider"],c:0,e:"Accountability to the regulator and to data subjects sits with the controller, because the controller determined the purpose and means. The processor's contractual duty is prompt notification and cooperation."},
{d:5,o:"5.5",t:"Physical penetration testing",df:2,q:"A tester attempts to enter a facility by tailgating an employee and by presenting a fabricated contractor badge. Which type of assessment is this?",a:["A physical penetration test","An offensive network penetration test","A defensive tabletop exercise","An internal compliance audit"],c:0,e:"Physical penetration testing evaluates barriers, badge processes, reception procedures, and staff behavior. It is scoped by the rules of engagement and requires written authorization the tester carries at all times."},
{d:5,o:"5.5",t:"Audit committee role",df:3,q:"What is the purpose of an audit committee within a governance structure?",a:["Independent oversight of internal audit and control effectiveness","It performs the technical vulnerability scanning","It approves individual firewall change requests","It negotiates vendor contracts on behalf of procurement"],c:0,e:"The audit committee exists to preserve independence: internal audit reports to it rather than to the executives whose controls it examines, which is what stops findings from being suppressed."},
{d:5,o:"5.5",t:"Examinations vs assessments",df:3,q:"How does a regulatory examination differ from a security assessment engaged by the organization itself?",a:["An examination is conducted by an authority that can compel access","An examination is always narrower in scope than an assessment","An assessment carries legal penalties and an examination does not","They differ only in the job title of the person performing them"],c:0,e:"The distinction is authority and consequence. A regulator can compel cooperation and impose fines, sanctions, or licence conditions; a voluntary assessment produces recommendations the organization may accept or decline."},
{d:5,o:"5.6",t:"Responding to reported messages",df:2,q:"An employee forwards a suspicious email to the security team. What should the program guarantee happens next?",a:["Timely analysis and feedback to the reporter","Automatic deletion of the message without review","Disciplinary review of the employee who received it","Immediate blocking of the sender's entire domain"],c:0,e:"Reporting behavior is fragile: if reports vanish without acknowledgment, the reporting rate falls and the organization loses its earliest warning signal. Closing the loop is part of the control."},
{d:5,o:"5.6",t:"Removable media and cables",df:2,q:"Why does awareness training specifically cover cables as well as USB drives?",a:["A cable can hide electronics that inject keystrokes or steal data","Cables degrade over time and cause data corruption","Cables are the most common cause of electrical fire in offices","Cables must be inventoried for accounting purposes"],c:0,e:"Weaponized charging and data cables are commercially available and visually indistinguishable from legitimate ones. The guidance is the same as for found USB drives: never connect hardware of unknown provenance."},
{d:5,o:"5.6",t:"Hybrid and remote work practices",df:2,q:"Which guidance is MOST specific to hybrid and remote work in an awareness program?",a:["Home network security and shoulder-surfing risk in public spaces","Choosing a strong password for the corporate directory","Recognizing phishing emails sent to a personal address","Reporting anomalous colleague behavior to a manager"],c:0,e:"The other topics apply everywhere. Remote-specific guidance addresses the controls the office used to provide implicitly: a managed network, physical screen privacy, and secure disposal of paper."},
/* ==== ROUND 3 ADDITIONS: Domains 1-2 ==== */
{d:1,o:"1.1",t:"Corrective vs compensating",df:3,q:"A vulnerability scanner flags a missing patch. The team cannot patch until the vendor certifies the fix, so they add a WAF rule blocking the exploit path, and three weeks later they apply the patch and remove the rule. Which control types were used, in order?",a:["Compensating, then corrective","Corrective, then compensating","Preventive, then detective","Detective, then directive"],c:0,e:"The WAF rule substituted for the control that could not be applied, which makes it compensating. Applying the patch repaired the underlying flaw, which is corrective. Compensating controls are by design temporary and should retire when the primary control becomes possible."},
{d:1,o:"1.2",t:"Physical sensor types",df:3,q:"A secure storage room needs a sensor that detects body heat from an intruder without being triggered by moving air or vibration. Which sensor type fits?",a:["Infrared","Ultrasonic","Pressure","Microwave"],c:0,e:"Infrared sensors detect heat signatures, so they respond to a human body rather than to motion in general. Microwave and ultrasonic sensors detect movement by reflected waves and are more prone to triggering on air movement; pressure sensors detect weight on a surface."},
{d:1,o:"1.2",t:"Authorization models",df:2,q:"After a user is successfully authenticated, which process determines the specific resources and operations that user may access?",a:["Authorization","Authentication","Accounting","Identification"],c:0,e:"Identification claims an identity, authentication proves it, authorization decides what the proven identity may do, and accounting records what it did. Questions that describe a successful login followed by a permissions decision are always testing authorization."},
{d:1,o:"1.3",t:"Allow list updates after change",df:3,q:"A change moves an application to a new set of outbound IP addresses. The deployment succeeds but users immediately report failures reaching a partner API. Which technical implication was most likely missed?",a:["The partner's allow list still has the old addresses","The maintenance window was scheduled too early","The backout plan was never approved","Version control was not applied to the diagrams"],c:0,e:"Allow and deny lists are a named technical implication of change management, and they frequently live outside your own environment. Any change to addresses, certificates, or hostnames needs the downstream allow lists identified during impact analysis."},
{d:1,o:"1.4",t:"Perfect forward secrecy",df:3,q:"A TLS configuration is changed so that compromising the server's long-term private key cannot decrypt previously captured sessions. Which mechanism provides this?",a:["Ephemeral Diffie-Hellman key exchange","A longer RSA key for the server certificate","Certificate pinning in the client application","Enabling OCSP stapling on the server"],c:0,e:"Ephemeral key exchange (DHE or ECDHE) generates a fresh session key per connection and discards it, so past traffic stays protected even if the long-term key leaks later. Key length, pinning, and revocation checking all address different problems."},
{d:1,o:"1.4",t:"Secure enclave",df:2,q:"A smartphone stores its fingerprint template in a dedicated coprocessor that the main OS cannot read, even when the OS is compromised. What is this component called?",a:["A secure enclave","A hardware security module","A certificate authority","A key escrow agent"],c:0,e:"A secure enclave is an isolated processor region that holds biometric templates and keys outside the reach of the main operating system. An HSM serves the same protective purpose at enterprise scale for key operations rather than on-device biometrics."},
{d:1,o:"1.4",t:"Steganography",df:2,q:"An insider exfiltrates a client list by embedding it inside the pixel data of holiday photographs posted to a public image site. Which technique is this?",a:["Steganography","Tokenization","Data masking","Key stretching"],c:0,e:"Steganography hides the existence of the message by concealing it inside an ordinary-looking carrier file. It defeats controls that look for recognizable sensitive content, because the carrier appears to be a normal image."},
{d:1,o:"1.4",t:"Self-signed vs third-party certificates",df:3,q:"An internal monitoring dashboard is reachable only from the management VLAN and is used by six administrators. Which certificate choice is MOST appropriate, and why?",a:["A certificate from the internal CA, whose trust chain is already distributed","A third-party public CA certificate, because self-signed certificates are never acceptable","A self-signed certificate manually trusted on each host, because it is free","A wildcard certificate from a public CA, to cover future internal hosts"],c:0,e:"Public CA certificates exist to establish trust with parties you have no prior relationship with. For internal-only services on managed endpoints, an internal CA provides full chain validation and revocation without paying for public trust that nobody needs."},
{d:2,o:"2.1",t:"Resources and funding attribute",df:2,q:"Why does the resources and funding attribute matter when profiling a threat actor?",a:["It predicts custom tooling, zero-day purchases, and a sustained campaign","It determines whether the actor is internal or external","It indicates the actor's geographic location","It establishes whether the attack was intentional"],c:0,e:"Funding determines capability and persistence. A well-funded actor can buy exploits, maintain infrastructure, and wait months; a poorly funded one must use what is freely available and move quickly."},
{d:2,o:"2.1",t:"Ethical motivation",df:2,q:"A researcher scans a company's public infrastructure without permission, finds an exposed database, and emails the security team with the details rather than selling or publishing them. Which motivation BEST describes this?",a:["Ethical, though the scanning is still a legal risk","Financial gain, because a bounty may be paid","Revenge against the organization itself","Espionage on behalf of a competitor firm"],c:0,e:"Ethical motivation covers actors who seek to improve security rather than profit or harm. Note the distinction the exam draws: intent being ethical does not make unauthorized testing lawful, which is why bug bounty programs exist to grant permission in advance."},
{d:2,o:"2.2",t:"Unsupported systems and applications",df:3,q:"A manufacturing company runs a line-of-business application that requires an operating system version the vendor stopped supporting two years ago. Which statement BEST describes the resulting exposure?",a:["New vulnerabilities in that OS will never be patched, so risk grows continuously","The risk is unchanged, because the system worked correctly before support ended","The application vendor assumes liability for any breach","Antivirus software fully compensates for the missing patches"],c:0,e:"Unsupported systems are a named threat vector precisely because exposure is cumulative. Every CVE published after end of support is permanent. The accepted responses are replacement, isolation with compensating controls, and a documented exception."},
{d:2,o:"2.2",t:"Brand impersonation vs typosquatting",df:3,q:"Attackers register a correctly spelled but unrelated domain, then build a pixel-perfect copy of a bank's login page complete with its logo and colors. Which technique is PRIMARILY in use?",a:["Brand impersonation","Typosquatting","Watering hole","Pretexting"],c:0,e:"Brand impersonation copies the look and identity of a trusted organization. Typosquatting specifically exploits misspelled or mistyped domain names; here the domain is spelled correctly, so the deception rests on the visual copy rather than the URL."},
{d:2,o:"2.2",t:"Instant messaging vector",df:2,q:"An employee receives a message through the company's collaboration platform, apparently from a colleague, containing a link to a credential harvesting page. Which threat vector category does this fall under?",a:["Message-based, covering email and SMS","File-based, because a link was included","Removable device media","Supply chain compromise"],c:0,e:"The message-based vector covers email, SMS, and instant messaging alike. Internal collaboration platforms are increasingly targeted because users extend them more trust than they extend to email."},
{d:2,o:"2.3",t:"Memory injection",df:3,q:"Malware writes its payload into the address space of a running, legitimate signed process and executes it from there, leaving no new file on disk. Which vulnerability or technique class is this?",a:["Memory injection, a fileless technique","Buffer overflow of the target process input","Directory traversal in the process working directory","Resource reuse between processes"],c:0,e:"Memory injection places code into another process's memory so the malicious activity appears to come from a trusted binary. Because nothing is written to disk, detection depends on behavioral monitoring and endpoint telemetry rather than file scanning."},
{d:2,o:"2.3",t:"Firmware vulnerability",df:3,q:"A vulnerability in a server's baseboard management controller firmware allows an attacker with network access to the management interface to bypass the operating system entirely. Which category is this, and why is it severe?",a:["A firmware vulnerability; it sits below the OS, so reinstalling does not remove it","A misconfiguration; reapplying the baseline removes it","An application vulnerability; patching the application removes it","A cryptographic vulnerability; rotating certificates removes it"],c:0,e:"Firmware sits beneath the operating system, so a compromise survives reimaging and is invisible to host agents. Mitigation is strict isolation of management interfaces plus vendor firmware updates."},
{d:2,o:"2.3",t:"Hardware supply chain",df:2,q:"A batch of network switches arrives with firmware that differs from the vendor's published hash. Which vulnerability category does this represent?",a:["A supply chain vulnerability from the hardware provider","Zero-day in the switch operating system","Misconfiguration during initial deployment","Resource reuse between cloud tenants"],c:0,e:"The supply chain category separates service providers, hardware providers, and software providers. Verifying firmware hashes against vendor-published values on receipt is the control that catches hardware-provider tampering."},
{d:2,o:"2.4",t:"Evil twin and deauthentication",df:3,q:"Users in a lobby are repeatedly disconnected from the corporate wireless network and then reconnect to an access point with the same SSID that presents a captive portal asking for domain credentials. Which two things are happening? (Select TWO.)",a:["A deauthentication attack forcing clients off the legitimate access point","An evil twin access point impersonating the corporate SSID","A DNS amplification attack against the wireless controller","An RFID cloning attack against building badges"],c:[0,1],m:true,e:"Deauthentication frames push clients off the real AP, and the evil twin with a matching SSID collects the reconnection. WPA3 with protected management frames defeats the deauth half; 802.1X with certificate validation defeats the credential capture."},
{d:2,o:"2.4",t:"Request forgery",df:3,q:"A logged-in user visits a malicious page that silently submits a funds transfer request to their bank, which the bank processes because the session cookie is sent automatically. Which attack is this, and which control stops it?",a:["Cross-site request forgery; anti-CSRF tokens","Cross-site scripting; output encoding of user input","SQL injection; use parameterized queries","Directory traversal; path canonicalization"],c:0,e:"CSRF abuses the browser's automatic inclusion of credentials for a site the user is already authenticated to. The fix is a per-request unguessable token the attacker's page cannot read, plus SameSite restrictions on the cookie."},
{d:2,o:"2.4",t:"Bloatware vs spyware",df:2,q:"A newly purchased laptop ships with a dozen preinstalled trial applications that consume resources and expand the attack surface, but do not covertly collect user data. What is this software called, and what is the response?",a:["Bloatware; remove unnecessary software as part of the secure baseline","Spyware; run a full antivirus scan and quarantine","A rootkit; reimage the device from known-good media","A logic bomb; audit for scheduled tasks"],c:0,e:"Bloatware is unwanted preinstalled software. It is a hardening problem rather than an infection: each extra package is unpatched code on the host. Spyware differs in that it covertly collects and exfiltrates information."},
{d:2,o:"2.5",t:"ACLs vs permissions",df:3,q:"Which statement correctly distinguishes a network access control list from file system permissions?",a:["An ACL filters traffic at a network device; permissions govern access to a file object","Both operate at the file system level, differing only in syntax","A network ACL controls user rights on a share; file permissions filter packets","Network ACLs apply only to wireless networks and guest VLANs"],c:0,e:"Both are access control, but at different layers. An ACL on a router or firewall decides whether packets pass. File permissions decide what an authenticated identity may do with an object once it has reached the system."},
{d:2,o:"2.5",t:"Patch management cadence",df:3,q:"A patch management policy specifies 15 days for critical vulnerabilities and 30 days for high. A critical patch for an internet-facing system is released. Which factor would MOST justify deviating from the 15-day window and acting sooner?",a:["Confirmed active exploitation of the vulnerability in the wild","The patch being larger than previous updates","The system being scheduled for replacement next year","The vendor releasing the patch on a weekend"],c:0,e:"Known exploitation changes the likelihood term in the risk calculation immediately, which is why emergency change procedures exist. Patch windows are defaults for the normal case, not limits on how fast you may respond."},
/* ==== ROUND 3 ADDITIONS: Domains 3-5 ==== */
{d:3,o:"3.1",t:"Hybrid cloud considerations",df:3,q:"A company keeps its regulated customer database on-premises while running its public web tier in a cloud provider, connected by a dedicated link. Which security consideration is MOST specific to this hybrid arrangement?",a:["Policy and identity must be enforced across two different control sets","Hybrid architectures remove the need for a responsibility matrix","On-premises systems no longer require patching","Encryption in transit becomes unnecessary over a dedicated link"],c:0,e:"Hybrid introduces a seam. Identity, logging, segmentation, and policy work differently in each environment, and gaps appear at the join. A dedicated circuit is still a network and still needs encryption."},
{d:3,o:"3.1",t:"Embedded systems and RTOS",df:3,q:"Which characteristic of a real-time operating system most constrains how it can be secured?",a:["Hard timing guarantees make added latency unacceptable","It has unlimited compute available for encryption","It is always air-gapped by design","It automatically receives vendor patches"],c:0,e:"RTOS devices trade flexibility for deterministic timing. Agents, scanning, and unscheduled reboots can break the real-time guarantee the device exists to provide, which is why the answers are isolation and surface reduction."},
{d:3,o:"3.1",t:"Power and compute considerations",df:2,q:"A proposal would add full-disk encryption and continuous endpoint telemetry to a fleet of battery-powered field sensors. Which architectural consideration most likely blocks it?",a:["Power and compute limits on the devices","Risk transference to the sensor vendor","Ease of recovery after a failure","Data sovereignty of the collected readings"],c:0,e:"Power and compute are listed architectural considerations for a reason: constrained devices often cannot run the controls that work on a workstation. The usual answer is to protect them at the network layer instead."},
{d:3,o:"3.2",t:"UTM vs NGFW",df:3,q:"Which statement BEST distinguishes a unified threat management appliance from a next-generation firewall?",a:["UTM bundles many functions in one box; NGFW centers on deep application awareness","NGFW bundles many functions; UTM performs only packet filtering","UTM operates at layer 7 while NGFW is limited to layer 4 filtering","They are identical and the terms are interchangeable"],c:0,e:"UTM is a consolidation story aimed at smaller environments: firewall, IPS, antivirus, web filtering and more in a single device. NGFW is a capability story: application identification, user identity, and TLS inspection integrated into firewall policy."},
{d:3,o:"3.2",t:"SD-WAN",df:2,q:"A retailer with 300 branches wants to replace expensive private circuits with broadband while centrally controlling routing and encrypting all site-to-site traffic. Which technology fits?",a:["SD-WAN","A screened subnet at each branch","802.1X port authentication","A reverse proxy at headquarters"],c:0,e:"SD-WAN abstracts the transport so branches can use any available connection while policy and encryption are managed centrally. It is frequently the networking half of a SASE deployment."},
{d:3,o:"3.2",t:"Sensor and collector placement",df:3,q:"A security team wants visibility into traffic between two internal subnets without introducing any risk of interrupting that traffic. What should they deploy, and where?",a:["A passive sensor on a tap or SPAN port at the boundary","An inline IPS at the internet edge","A host-based firewall on each endpoint","A jump server on the management VLAN"],c:0,e:"The requirement explicitly rules out interrupting traffic, which rules out anything inline. A passive sensor sees a copy and cannot drop packets or fail the path, and it must sit where the east-west traffic actually passes."},
{d:3,o:"3.3",t:"Restricted vs confidential",df:3,q:"An organization uses the classifications public, private, confidential, and restricted. Which statement about the top tier is correct?",a:["Restricted is the most tightly controlled tier, needing per-person authorization","Restricted and public carry equivalent handling requirements","Confidential always outranks restricted in every scheme","Classification tiers are defined identically across all organizations"],c:0,e:"Exact tier names and their order vary by organization, which the exam acknowledges. What is consistent is that the highest tier narrows access to named individuals with a demonstrated need, and that classification drives handling, storage, and disposal rules."},
{d:3,o:"3.3",t:"Data segmentation",df:2,q:"A SaaS provider stores every customer's records in one database but enforces separation so no tenant can query another's rows. Which data protection method is this?",a:["Segmentation","Tokenization","Steganography","Geographic restriction"],c:0,e:"Segmentation separates data so a compromise or error in one partition does not expose another. In multi-tenant systems this is the control that keeps customers isolated, and failures of it are a recognized cloud-specific vulnerability."},
{d:3,o:"3.3",t:"Legal and financial information",df:2,q:"Correspondence between a company and its outside counsel about pending litigation requires special handling. Which data type is this, and what makes it distinct?",a:["Legal information, which may carry privilege that disclosure destroys","Financial information, which is governed by accounting standards","Public data, since court filings become public","Trade secret, which is protected by patent registration"],c:0,e:"Legal information is a named data type. Attorney-client privilege can be waived by careless disclosure, so handling rules are stricter than general confidentiality, and legal hold obligations frequently attach to it."},
{d:3,o:"3.4",t:"Journaling and replication",df:3,q:"A database must be recoverable to any point in time within the last 24 hours, not merely to the last snapshot. Which capability provides this?",a:["Transaction journaling, replayed to a chosen moment","Daily full backups retained for twenty-four hours","Synchronous replication to a second data center","A storage snapshot taken every twelve hours"],c:0,e:"Journaling or transaction logging records the sequence of changes, enabling point-in-time recovery between backups. Replication protects against site loss but faithfully copies corruption and deletions, so it is not a substitute."},
{d:3,o:"3.4",t:"Multi-cloud resilience",df:3,q:"An organization distributes its workload across two different cloud providers. Which risk does this MOST directly address, and what does it cost?",a:["It removes dependence on a single provider's outage or compromise","It eliminates the shared responsibility model","It guarantees lower spend than a single provider","It removes the need for backups and snapshots"],c:0,e:"Multi-cloud is platform diversity applied at the provider level, protecting against provider-wide failure and vendor lock-in. The cost is real: two control planes, two IAM models, and two sets of expertise to maintain."},
{d:4,o:"4.1",t:"Static code analysis",df:2,q:"A build pipeline scans source code for unsafe functions and hardcoded secrets before compilation. Which practice is this, and what is its characteristic weakness?",a:["Static code analysis; many findings are unreachable at runtime","Dynamic analysis; it requires the application to be running","Sandboxing; it requires a virtual environment","Code signing; it requires a trusted certificate"],c:0,e:"SAST reads code at rest, so it finds flaws early and cheaply but cannot tell whether a given path is ever reached in practice. Pairing it with DAST covers the runtime and configuration issues it cannot see."},
{d:4,o:"4.1",t:"Bluetooth connection risks",df:3,q:"Which pair of controls MOST reduces Bluetooth risk on a managed mobile fleet?",a:["Disabling Bluetooth when not needed and blocking discoverable mode","Shortening the screen lock timeout and requiring a longer PIN","Enabling full-disk encryption and secure boot","Installing a host-based firewall and an antivirus agent"],c:0,e:"Bluetooth is a named connection method and its risks come from pairing and discoverability. Attacks in this family rely on the device being visible and accepting pairing, so MDM policy controlling both is the direct mitigation."},
{d:4,o:"4.1",t:"RADIUS in wireless",df:3,q:"In an enterprise wireless deployment using WPA3-Enterprise, what role does the RADIUS server play?",a:["It authenticates each user individually and can return a VLAN assignment","It encrypts the wireless frames between client and access point","It replaces the need for a wireless controller","It distributes the shared passphrase to clients"],c:0,e:"Enterprise wireless replaces a shared passphrase with 802.1X plus RADIUS, giving per-user authentication, individual revocation, and attribute-based VLAN assignment. Frame encryption is handled by the WPA3 cipher suite, not by RADIUS."},
{d:4,o:"4.2",t:"Retention vs legal hold conflict",df:3,q:"A retention schedule requires deleting a mailbox after 90 days, but the account belongs to an employee named in active litigation. What takes precedence?",a:["The legal hold, which suspends the retention schedule until counsel releases it","The retention schedule, because it is the documented policy","Whichever the mail administrator decides is more practical","Neither; the data should be archived and then deleted on schedule"],c:0,e:"A legal hold overrides routine deletion. Deleting data under hold is spoliation, carrying sanctions independent of the case's merits. The hold stays until counsel formally releases it."},
{d:4,o:"4.2",t:"Cloud asset enumeration",df:3,q:"A quarterly review finds 40 cloud instances with no owner tag, several running services not in the approved catalog. Which asset management failure does this represent, and what is the fix?",a:["Inadequate enumeration; enforce tagging at provisioning through policy","Inadequate sanitization; wipe the instances before reuse","Inadequate procurement; renegotiate the cloud contract","Inadequate classification; encrypt all instance storage"],c:0,e:"Cloud resources are created faster than manual inventories can track, so enumeration must be automated and enforced at creation. Tag policies are a guard rail that makes an untracked asset impossible rather than merely discouraged."},
{d:4,o:"4.3",t:"Dark web monitoring",df:2,q:"A service alerts an organization that employee credentials matching its domain are being offered for sale on a criminal forum. Which identification method produced this, and what is the immediate response?",a:["Dark web monitoring; force a password reset on the affected accounts","A vulnerability scan; patch the affected systems","A penetration test; review the engagement report","A system audit; update the risk register afterwards"],c:0,e:"Dark web monitoring is a named threat intelligence source. Credentials for sale imply a prior compromise somewhere, so the response is both forward-looking (reset, enforce MFA) and backward-looking (hunt for use of those credentials)."},
{d:4,o:"4.3",t:"System and process audit",df:3,q:"An assessor reviews whether the documented patch management procedure is actually being followed, sampling 30 systems and comparing them to the stated 15-day window. Which identification method is this?",a:["A system or process audit","A dynamic application security test","Package monitoring","A responsible disclosure program"],c:0,e:"Audits test whether a control operates as documented, which finds a different class of problem from scanning. A scanner shows missing patches; an audit shows that the process meant to prevent them is not working."},
{d:4,o:"4.4",t:"Benchmarks",df:2,q:"A team configures servers according to a published, consensus-developed hardening standard and uses a tool to measure compliance against it automatically. Which resource are they using?",a:["A CIS Benchmark, evaluated with SCAP content","A CVE record published in the NVD","An entry in the corporate risk register","A third-party penetration test report"],c:0,e:"Benchmarks are prescriptive configuration standards. Expressed as SCAP content, they let different tools evaluate a system against identical criteria, which is what makes compliance measurable rather than opinion."},
{d:4,o:"4.4",t:"Log archiving",df:3,q:"Why do organizations archive logs beyond their active SIEM retention window?",a:["Breaches are often found months after the intrusion began","Archived logs are faster to query than live logs","Archiving removes the need to protect log integrity","Regulations require that all logs be deleted after archiving"],c:0,e:"Dwell time regularly exceeds active retention, so the evidence an investigation needs predates the alert. Archiving keeps that history affordably, and legal or regulatory retention periods frequently set the minimum."},
{d:4,o:"4.5",t:"Screened subnet design",df:3,q:"Which firewall rule set correctly implements a screened subnet containing a web server that must query an internal database?",a:["Internet to web on 443 allowed; web to database allowed; internet to database denied","Internet to web server and internet to database both permitted on all ports","Web server to internal network permitted on any port; internet to web server denied","All traffic permitted within the screened subnet and denied everywhere else"],c:0,e:"The screened subnet exists so a web compromise does not become internal access. Inbound traffic reaches only the published service port, the path inward is restricted to the single required port, and the database is never directly reachable from or able to reach the internet."},
{d:4,o:"4.5",t:"Email gateway controls",df:3,q:"Beyond SPF, DKIM, and DMARC, which secure email gateway capability MOST directly addresses a malicious link that is benign at delivery and weaponized an hour later?",a:["Time-of-click URL rewriting and reputation checking","Attachment sandboxing at delivery time","Stricter SPF alignment on inbound mail","Longer mailbox retention for auditing"],c:0,e:"Delayed weaponization defeats delivery-time inspection by design. Rewriting links so the gateway evaluates the destination when the user actually clicks closes that window; sandboxing at delivery does not."},
{d:4,o:"4.5",t:"Group policy enforcement",df:2,q:"An administrator needs to guarantee that a security setting cannot be changed by a local administrator on domain-joined workstations. Which mechanism provides this?",a:["Group Policy, reapplied on a refresh interval","A one-time configuration script run at imaging","A documented standard in the policy handbook","A quarterly vulnerability scan of the fleet"],c:0,e:"Group Policy is configuration enforcement: it reapplies settings on a schedule, so local changes are reverted. A one-time script is configuration that drifts, and documentation and scanning identify drift without correcting it."},
{d:4,o:"4.6",t:"Biometric error rates",df:3,q:"A fingerprint reader is tuned so that the false acceptance rate and false rejection rate are equal. What is this point called, and what does raising sensitivity do?",a:["The crossover error rate; sensitivity trades FAR against FRR","The false acceptance rate; raising sensitivity lowers both error types","The false rejection rate; raising sensitivity has no effect on errors","The enrollment rate; raising sensitivity speeds enrollment"],c:0,e:"CER is the standard figure for comparing biometric systems, and lower is better. The two error types trade off against each other: tightening the match threshold rejects more legitimate users while admitting fewer impostors."},
{d:4,o:"4.6",t:"Hard vs soft tokens",df:2,q:"Which statement correctly contrasts a hardware authentication token with a software token?",a:["A hardware token is a separate device, so a compromised phone does not yield it","A software token is a separate physical device issued by the organization","Hardware tokens are easier to deploy at scale and cost less","Software tokens cannot generate time-based codes"],c:0,e:"Both are something you have. The hardware token's advantage is isolation: its secret lives in dedicated hardware rather than on a general-purpose device that malware may already own. Its disadvantages are cost, logistics, and replacement when lost."},
{d:4,o:"4.6",t:"Permission assignment implications",df:3,q:"An organization assigns permissions to individual user accounts rather than to groups. Which consequence is MOST significant?",a:["Permissions become inconsistent and nearly impossible to review","Authentication becomes slower for every user","Multifactor authentication can no longer be enforced","Passwords must be rotated more frequently"],c:0,e:"Per-user assignment does not scale: nobody can answer who has access to what, and access reviews become guesswork. Group or role based assignment makes entitlements reviewable, which is the prerequisite for attestation."},
{d:4,o:"4.7",t:"Security group automation",df:2,q:"A workflow automatically adds a new hire to the correct security groups based on their role in the HR system, and removes them on termination. Which benefit does this MOST directly deliver?",a:["Consistent baseline access without manual error","Reduced cost of the HR system licence overall","Elimination of the need for access reviews","Faster network throughput for new hire devices"],c:0,e:"Automated group membership enforces the standard for every joiner, mover, and leaver identically. It reduces, but does not remove, the need for periodic attestation, since the mapping rules themselves can be wrong."},
{d:4,o:"4.8",t:"Preparation phase",df:3,q:"Which activities belong to the preparation phase of incident response?",a:["Building the plan, training responders, and deploying detection tooling","Determining the scope and root cause of an active intrusion","Removing attacker persistence from compromised hosts","Restoring systems and validating that they are clean"],c:0,e:"Preparation is everything done before an incident: plans, playbooks, training, tooling, contacts, and retainers. It is the phase that determines how well every later phase goes, and lessons learned feeds directly back into it."},
{d:4,o:"4.9",t:"IDS logs vs network logs",df:3,q:"An analyst needs to know which specific signature fired and what the detection engine classified the traffic as. Which log source provides this?",a:["IPS or IDS logs","Generic network flow logs","DHCP server logs","Application error logs"],c:0,e:"IDS and IPS logs carry the detection verdict: the signature identifier, classification, severity, and action taken. Flow logs record that a conversation happened but contain no detection logic or verdict."},
{d:5,o:"5.1",t:"BCP vs DRP policy",df:3,q:"Which statement correctly distinguishes the business continuity policy from the disaster recovery policy?",a:["Continuity keeps business functions running; recovery restores IT systems","Disaster recovery governs business functions; business continuity governs IT restoration","They are the same document under two different names","Business continuity applies only to natural disasters"],c:0,e:"Continuity is business-facing and broader, covering people, processes, facilities, and workarounds. Disaster recovery is the technology subset. Both are named policies and the exam expects you to separate them."},
{d:5,o:"5.1",t:"Boards vs committees",df:2,q:"Which governance body typically holds ultimate accountability for an organization's risk posture, delegating detailed oversight to specialized subgroups?",a:["The board of directors, delegating to committees such as audit or risk","The change advisory board, delegating to system owners","The incident response team, delegating to the SOC","The procurement department, delegating to vendors"],c:0,e:"Boards carry ultimate accountability and set risk appetite; committees do the detailed work and report upward. The CAB is an operational body for changes, not a governance structure for risk."},
{d:5,o:"5.2",t:"Control cost versus ALE",df:3,q:"A risk has an ALE of 18,000 dollars per year. A proposed control costs 25,000 dollars per year and would reduce the ALE to 4,000 dollars. What does the analysis indicate?",a:["The control costs more than the loss it prevents","The control is justified because it reduces the ALE substantially","The control is justified because any reduction in ALE is worthwhile","The ALE must be recalculated because controls never reduce ALE"],c:0,e:"The control saves 14,000 dollars of expected loss per year but costs 25,000, so it is a net loss of 11,000. Note the qualifier: non-financial factors such as regulatory mandate, safety, or reputation can still justify a control that fails the arithmetic."},
{d:5,o:"5.2",t:"Key risk indicators",df:2,q:"What distinguishes a key risk indicator from a key performance indicator?",a:["A KRI signals rising exposure; a KPI measures performance","A KRI measures past performance; a KPI predicts future risk","They are the same metric reported to different audiences","A KRI applies only to financial risk"],c:0,e:"KRIs exist to give early warning, which is why each has a defined threshold that triggers escalation to the risk owner. Percentage of endpoints beyond the patch window is a KRI; mean time to patch is closer to a KPI."},
{d:5,o:"5.3",t:"Vendor questionnaires",df:2,q:"What is the primary limitation of relying on a completed vendor security questionnaire?",a:["It is self-reported and unverified","It cannot be completed electronically","It is only valid for cloud vendors","It legally transfers liability to the vendor"],c:0,e:"Questionnaires scale and are cheap, which is why they are used, but they carry the weakest assurance of any vendor artifact. Pair them with independent assessments or a right-to-audit clause where the risk justifies it."},
{d:5,o:"5.3",t:"Vendor penetration testing rights",df:3,q:"A customer wants to run its own penetration test against a SaaS provider's platform. What must happen first?",a:["Written authorization and agreed rules of engagement from the provider","Nothing, because the customer's data is on the platform","Only internal approval from the customer's own security team","The customer must first complete a vendor questionnaire"],c:0,e:"Testing shared infrastructure without permission affects other tenants and is generally prohibited by the agreement. Many providers forbid customer testing outright and instead supply their own third-party test attestations."},
{d:5,o:"5.4",t:"Contractual impacts",df:3,q:"A company fails to maintain a certification its largest customer requires in their contract. Which consequence of non-compliance is this?",a:["A contractual impact, which may trigger penalties or termination","A regulatory fine imposed by a government body","Loss of the licence to operate in the sector","A criminal sanction against the officers"],c:0,e:"Contractual impacts come from counterparties, not regulators. They are frequently the fastest and most expensive consequence for organizations that are not themselves directly regulated."},
{d:5,o:"5.5",t:"Self-assessment",df:2,q:"A department completes a standardized control checklist about its own practices and submits it to the security team. Which assessment type is this, and what is its main weakness?",a:["A self-assessment; it is unverified and prone to optimism","An independent third-party audit; it is expensive","A regulatory examination; it carries legal consequences","A penetration test; it requires rules of engagement"],c:0,e:"Self-assessments are cheap and scale well, making them useful for broad coverage and for preparing for a real audit. They carry the least assurance because the assessor and the assessed are the same party."},
{d:5,o:"5.5",t:"Attestation",df:3,q:"After completing an audit, an independent firm issues a formal signed statement about whether the organization's controls met the stated criteria. What is this statement called?",a:["An attestation","A risk register entry","A statement of work","A memorandum of understanding"],c:0,e:"Attestation is the formal assertion about the examined subject matter, and it is what customers and regulators actually rely on. In IAM the same word describes a periodic confirmation that access remains appropriate, so read the context."},
{d:5,o:"5.6",t:"Situational awareness",df:2,q:"Which awareness training outcome is MOST directly described as situational awareness?",a:["Recognizing that a request or circumstance is abnormal and verifying it","Memorizing the organization's password complexity requirements","Knowing where the incident response plan is stored","Completing annual training within the required window"],c:0,e:"Situational awareness is the habit of noticing when something does not fit and pausing to verify. It is what defeats urgency-based social engineering, which depends on the target acting before thinking."},
];
const NOTES = {
/* --- Domain 1 --- */
"Control categories & types":"Build a 4x6 grid. Categories (WHO/WHAT implements): Technical, Managerial, Operational, Physical. Types (WHAT IT DOES): Preventive, Deterrent, Detective, Corrective, Compensating, Directive. Every control question is asking you to name one of each. Bollard = Physical + Preventive.",
"Deterrent controls":"Deterrent DISCOURAGES a human who could still act (warning banner, visible camera, guard dog sign). Preventive REMOVES the option (lock, firewall rule, bollard). If the attacker can still choose to proceed, it is deterrent.",
"Compensating controls":"Compensating = the primary control is impossible, so an alternative meets the same intent. Trigger words: cannot patch, cannot replace, vendor will not support, voids certification. Always pairs with a documented exception.",
"Detective controls":"Detective finds it AFTER it happened (log review, IDS, audit, camera footage reviewed later). Note the tense: preventive = before, detective = during/after, corrective = fixing the aftermath.",
"Directive controls":"Directive TELLS people what to do with no enforcement (policy, AUP, signage, procedure). The moment technology enforces it, reclassify as technical + preventive. Same rule, different control.",
"Corrective controls":"Corrective restores after an event: restore from backup, rebuild, patch the exploited flaw, failover. The backup ITSELF is preventive infrastructure; the act of restoring is corrective.",
"Non-repudiation":"Non-repudiation = the signer cannot deny it. Mechanism is ALWAYS a digital signature (hash the message, encrypt the hash with the sender's PRIVATE key). Hash alone = integrity only. Encryption alone = confidentiality only.",
"Zero Trust control plane":"Memorize the three-part flow: Policy Engine DECIDES -> Policy Administrator COMMUNICATES the decision and creates/tears down the session -> Policy Enforcement Point ALLOWS OR BLOCKS the traffic. PE decides, PEP enforces.",
"Control vs data plane":"Two lists, memorize verbatim. CONTROL plane: adaptive identity, threat scope reduction, policy-driven access control, policy administrator, policy engine. DATA plane: subject/system, policy enforcement point, implicit trust zones.",
"AAA":"Authentication = who are you. Authorization = what may you do. Accounting = a record of what you actually did. Audit questions asking 'which commands and when' are always Accounting.",
"Deception technology":"Four terms, increasing scope: Honeytoken (fake DATA/credential), Honeyfile (fake FILE), Honeypot (fake SYSTEM), Honeynet (fake NETWORK). Any legitimate use is zero, so any use at all is an alert.",
"Gap analysis":"Gap analysis = current state vs desired/target state, output is a list of deficiencies. Do not confuse with BIA (which processes are critical, RTO/RPO) or risk assessment (likelihood x impact).",
"Backout plan":"Mandatory change-request elements: approval, ownership, stakeholders, impact analysis, test results, BACKOUT PLAN, maintenance window, SOP. If a question says a change was rejected, look for the missing one from this list.",
"Dependencies & downtime":"Technical implications of change: allow/deny lists, restricted activities, downtime, service/application restart, LEGACY APPLICATIONS, DEPENDENCIES. Credential rotation questions are almost always about hardcoded credentials in downstream dependencies.",
"Ownership & approval":"Change roles: OWNER sponsors and accepts the risk. CAB reviews and approves. CUSTODIAN implements. STAKEHOLDERS are consulted and notified. Accountability sits with the owner, never the implementer.",
"Change documentation":"After every change, update diagrams and rule documentation under VERSION CONTROL. The exam's point: undocumented changes break the next incident response, because responders work from a false baseline.",
"TPM":"TPM = a chip ON THE MOTHERBOARD, one per machine, seals keys to the boot state. That binding is why a stolen drive will not decrypt in another chassis. Default answer for laptop full-disk encryption.",
"HSM":"HSM = dedicated tamper-resistant appliance for high-volume key operations; the private key is generated inside and NEVER exported. Default answer for CA root keys and enterprise key generation. TPM = one host, HSM = the enterprise.",
"Key escrow":"Key escrow = a trusted third party holds a copy of the key so data is recoverable after key loss, employee departure, or lawful access. Always note the trade-off: the escrow becomes a single high-value target.",
"Certificate revocation":"CRL = a full list the client downloads; grows large, gets stale. OCSP = ask about ONE certificate in real time. OCSP STAPLING = the SERVER attaches its own recent signed status to the handshake, so the client makes no extra request. Any 'client latency / large list' scenario is stapling.",
"CSR contents":"CSR carries the PUBLIC key + distinguished name, self-signed to prove key possession. The private key NEVER leaves the requester. If an answer says the private key is sent anywhere, it is wrong.",
"Salting & key stretching":"SALT = unique random value per password, defeats precomputed RAINBOW TABLES. KEY STRETCHING (bcrypt, scrypt, PBKDF2, Argon2) = deliberately slow, raises the cost of EACH guess. You need both; they solve different halves of offline cracking.",
"Wildcard certificates":"Wildcard *.example.com covers ONE level of subdomain only (app.example.com yes, a.b.example.com no). Trade-off to write down: one stolen private key compromises every host using it.",
"Tokenization vs masking":"TOKENIZATION = surrogate value with NO mathematical relationship to the original, reversible only through the token vault; preserves the ability to match records. MASKING = permanently obscures characters for display (**** 4127). ENCRYPTION = reversible with a key. Pick by whether you must still correlate.",
/* --- Domain 2 --- */
"Threat actor attributes":"Score every actor on three attributes: internal/external, resources/funding, sophistication. Nation-state = highest of all three + patience + zero-days. Unskilled = lowest sophistication, uses others' tools.",
"Motivation mapping":"Motivations list: data exfiltration, espionage, service disruption, blackmail, financial gain, philosophical/political, ethical, revenge, disruption/chaos, war. Public messaging about a cause = hacktivist/philosophical. Ransom demand = blackmail. Quiet long-term collection = espionage.",
"Shadow IT":"Shadow IT = unsanctioned tech adopted by employees to get work done. Intent is productivity, NOT harm. That intent is the only thing separating it from a malicious insider on the exam.",
"Insider threat":"The insider's defining attribute is LEGITIMATE ACCESS plus knowing where the valuable data is. That is why perimeter controls miss them and why UBA, least privilege, and separation of duties are the standard answers.",
"Unskilled attacker":"Unskilled attacker (script kiddie) = uses prebuilt tools, cannot develop, motivated by disruption/chaos or reputation. If the scenario mentions a downloaded stresser or an off-the-shelf kit, this is your actor.",
"Organized crime":"Organized crime = a business. High funding, professional tooling, affiliate models, motivated by financial gain and blackmail. Ransomware-as-a-service is the archetype.",
"Business email compromise":"BEC = mail from a REAL or convincingly spoofed executive mailbox, real business context, urgent payment change. Note why filters miss it: SPF/DKIM/DMARC all PASS because the account is genuine. Control is out-of-band verification of payment changes.",
"Watering hole":"Watering hole = compromise a THIRD-PARTY SITE the targets are known to visit, then wait. Distinguish from supply chain (a vendor that supplies you) and phishing (attacker reaches out to you).",
"Typosquatting":"Typosquatting = a lookalike domain (micros0ft, arnazon, rnicrosoft). Related: brand impersonation (copying the look), and pretexting (inventing a scenario). Defense: DNS filtering plus registering your own common misspellings.",
"Supply chain vector":"Supply chain = MSP, vendor, or supplier compromise that INHERITS the trust and privilege you already granted them. One upstream breach scales to every downstream customer. Sub-vectors: MSPs, software updates, hardware.",
"Vishing vs smishing":"Phishing = email. Vishing = VOICE call. Smishing = SMS/text. Whaling = phishing aimed at a senior executive. Memorize by the delivery channel, not the content.",
"Removable device vector":"USB drop attacks combine TWO vectors: the removable device AND the human (curiosity/legitimacy). Modern payloads register as a KEYBOARD (HID) to inject keystrokes. Controls: disable unused USB ports, device control policy, configuration enforcement.",
"Open service ports":"Know these by number on sight: 3389 RDP, 5432 PostgreSQL, 1433 MSSQL, 3306 MySQL, 22 SSH, 445 SMB, 23 Telnet. Any of them reachable from the internet is an open-service-port finding and a top ransomware entry point.",
"Client-based vs agentless":"AGENT = installed software, continuous, works OFF-network, but adds maintenance and attack surface. AGENTLESS = no install, needs credentials and network reachability at scan time. Roaming laptops = agents.",
"Race condition / TOCTOU":"TOCTOU = time-of-check to time-of-use. The flaw is the WINDOW between validating a resource and using it. Fix: check and use the SAME handle/object, do not re-resolve the path.",
"VM escape":"VM escape = guest code reaching the HYPERVISOR or another guest. Worst case in virtualization because it breaks the isolation boundary every other VM depends on.",
"Resource reuse":"Resource reuse = memory or storage reallocated WITHOUT sanitization, leaking residual data to the next tenant or process. Cloud and multi-tenant specific. Do not confuse with VM escape.",
"SQL injection":"Root-cause fix for injection is ALWAYS parameterized queries / prepared statements with bound variables, plus server-side input validation. A WAF is a COMPENSATING control, never the root-cause answer.",
"Cross-site scripting":"XSS types: stored (persisted, hits every viewer), reflected (in the request), DOM-based. Fixes: contextual OUTPUT ENCODING, Content-Security-Policy, and HttpOnly on session cookies so script cannot read them.",
"End-of-life hardware":"EOL/legacy = no more vendor patches, so risk only grows. Correct answer order: replace it; if you cannot, isolate/segment with compensating controls and file a documented, time-bound exception.",
"Mobile: side loading & jailbreak":"Side loading = installing apps OUTSIDE the official store. Jailbreaking/rooting = removing OS integrity and sandbox protections. MDM should detect and block both; they are the two mobile answers to 'unvetted code'.",
"Zero-day":"Zero-day = NO PATCH AVAILABLE at time of exploitation. It is about patch availability, not severity or CVSS score. Justifies detective and compensating controls in an otherwise well-patched estate.",
"Malicious update":"Malicious update = the DELIVERY channel is subverted, often with a valid vendor signature, which is exactly why it evades defenses. It is simultaneously a supply chain vulnerability. SolarWinds is the reference case.",
"Ransomware indicators":"Ransomware signature pattern: mass file extension/rename changes, VOLUME SHADOW COPY DELETION, spike in write I/O, ransom note file. Shadow copy deletion is the giveaway. First action = isolate the host.",
"Logic bomb":"Logic bomb = dormant code triggered by a CONDITION (a date, or an account disappearing from the directory). Strongly associated with malicious insiders and terminated administrators.",
"Rootkit":"Rootkit = subverts the OS/kernel so host tools LIE to you. Indicator: network telemetry shows beaconing but the host shows nothing. Detection requires off-host evidence (NetFlow, SIEM) or offline/boot-time imaging.",
"Worm vs virus":"WORM = self-propagates across networks, no user action, no host file. VIRUS = needs a host file and usually user execution. TROJAN = disguised as something legitimate. That is the whole distinction.",
"Impossible travel":"Impossible travel = two successful authentications from locations no physical travel could cover. Cause is stolen credentials or a replayed session token. Sits in the indicator list with: account lockout, concurrent session usage, blocked content, resource consumption, resource inaccessibility, out-of-cycle logging, missing logs.",
"Password spraying":"SPRAYING = ONE password against MANY accounts, deliberately under the lockout threshold. BRUTE FORCE = many passwords against ONE account. Spraying is only visible if you correlate failures ACROSS accounts.",
"DNS amplification":"REFLECTION = spoof the victim's source IP so responses go to them. AMPLIFICATION = pick a query whose response is far larger than the request. Common in DNS and NTP. Mitigations: upstream scrubbing, BCP 38 source filtering, close open resolvers.",
"On-path attack":"On-path (formerly MITM) = attacker relays and can modify traffic. Key indicator: CERTIFICATE WARNINGS, because the attacker cannot present a trusted cert for the real site. Related: ARP poisoning, rogue AP, evil twin.",
"Downgrade attack":"Downgrade = force negotiation to weaker crypto the attacker can break. Fix is always to REMOVE the weak option from the server so there is nothing to negotiate down to. Group with the crypto attacks: collision, birthday, downgrade.",
"Privilege escalation":"VERTICAL escalation = gain HIGHER rights (user to admin/SYSTEM). HORIZONTAL = gain ANOTHER user's equivalent access. Usual vehicle is an unpatched service running with high privilege.",
