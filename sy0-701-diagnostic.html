/* ---------------------------------------------------------------- exam */
function startMode(mode, arg){
  let spec, label, minutes;
  if(mode === "full"){ spec={kind:"weighted",count:90}; label="Full diagnostic"; minutes=90; }
  else if(mode === "triage"){ spec={kind:"weighted",count:40}; label="Rapid triage"; minutes=40; }
  else if(mode === "drill"){ spec={kind:"domain",domain:arg}; label="Domain drill "+DOT+" "+DOMAINS[arg].n; minutes=0; }
  else if(mode === "obj"){ spec={kind:"obj",obj:arg}; label="Objective drill "+DOT+" "+arg+" "+OBJ[arg]; minutes=0; }
  else if(mode === "missed"){ spec={kind:"ids",ids:retrievalQueue(60)}; label="Retrieval queue"; minutes=0; }
  else if(mode === "weak"){
    const ids = weakInterleave(30);
    if(!ids.length) return;
    spec={kind:"ids",ids:ids}; label="Interleaved weak-spot drill"; minutes=ids.length;
  }
  else if(mode === "sim"){ startSim(); return; }
  else return;
  const items = buildExam(spec);
  if(!items.length) return;
  S.session = items; S.spec = {mode:mode, label:label, arg:arg||null, minutes:minutes};
  S.i = 0; S.showNav = false; S.paused = false; S.phase = "mc"; S.sim = null;
  S.started = Date.now();
  S.deadline = (S.opts.timed && minutes) ? Date.now() + minutes*60000 : 0;
  beginTicking();
}
function resumeSession(p){
  if(!p) return;
  S.spec = p.spec; S.opts = p.opts || S.opts;
  S.session = p.ids.map(function(id,i){
    const it = newItem(byId[id]);
    it.order = p.orders[i] || it.order;
    it.picked = p.picked[i] || [];
    it.ms = (p.ms && p.ms[i]) || 0;
    it.conf = (p.conf[i] === undefined) ? null : p.conf[i];
    it.flag = !!p.flag[i];
    return it;
  });
  S.i = Math.min(p.i || 0, S.session.length-1);
  S.showNav = false; S.phase = "mc"; S.sim = null;
  S.paused = !!p.paused;
  const elapsed = (typeof p.elapsedMs === "number") ? p.elapsedMs : (p.started ? Date.now()-p.started : 0);
  S.started = Date.now() - elapsed;
  const remain = (typeof p.remainingMs === "number") ? p.remainingMs
               : (p.deadline ? Math.max(0, p.deadline - Date.now()) : 0);
  S.deadline = remain > 0 ? Date.now() + remain : 0;
  beginTicking();
}
function beginTicking(){
  show(VE);
  if(S.tick) clearInterval(S.tick);
  S.tick = setInterval(tickClock, 1000);
  S.tLast = Date.now();
  tickClock(); renderQ(); saveProgress();
}
function answeredCount(){ return S.session.filter(function(x){ return x.picked.length; }).length; }
function tickClock(){
  if(!S.session) return;
  const done = answeredCount();
  let out = '<span class="mono">'+done+'/'+S.session.length+' answered</span>';
  if(S.deadline){
    const left = (S.deadline - Date.now())/1000;
    out += '<span class="mono timer '+(left<300?"crit":(left<900?"warn":""))+'">'+DOT+' '+fmtClock(left)+' left</span>';
    if(left <= 0){ finish(true); return; }
  } else {
    out += '<span class="mono">'+DOT+' '+fmtClock((Date.now()-S.started)/1000)+'</span>';
  }
  $("#railStat").innerHTML = out;
  $("#progFill").style.width = (done/S.session.length*100)+"%";
}

  if($("#prevBtn")) $("#prevBtn").onclick = goPrev;
  if($("#nextBtn")) $("#nextBtn").onclick = goNext;
  if($("#gateBtn")) $("#gateBtn").onclick = renderGate;
  if($("#gateBtn2")) $("#gateBtn2").onclick = renderGate;

function pick(v){
  const it = S.session[S.i], max = it.q.m ? 2 : 1, k = it.picked.indexOf(v);
  if(k > -1) it.picked.splice(k,1);
  else { it.picked.push(v); if(it.picked.length > max) it.picked.shift(); }
  renderQ(); tickClock(); saveProgress();
}
function setConf(v){
  const it = S.session[S.i];
  it.conf = (it.conf === v) ? null : v;
  renderQ(); saveProgress();
}
/* Charge elapsed wall time to the item that was on screen. Lets the report
   separate "right" from "right, but took two minutes", which is the item that
   fails under exam pressure. */
function touchTime(){
  if(!S.session || !S.tLast) return;
  const it = S.session[S.i];
  if(it) it.ms = (it.ms||0) + (Date.now() - S.tLast);
  S.tLast = Date.now();
}
function goNext(){ if(S.i < S.session.length-1){ touchTime(); S.i++; renderQ(); window.scrollTo(0,0); saveProgress(); } }
function goPrev(){ if(S.i > 0){ touchTime(); S.i--; renderQ(); window.scrollTo(0,0); saveProgress(); } }

document.addEventListener("keydown", function(e){
  if(VE.hidden || !S.session || S.phase === "pbq") return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const it = S.session[S.i], key = e.key.toLowerCase();
  if(key >= "1" && key <= "5"){
    const pos = +key - 1;
    if(pos < it.order.length){ e.preventDefault(); pick(it.order[pos]); }
    return;
  }
  if(S.opts.conf && (key === "k" || key === "s" || key === "g")){
    e.preventDefault(); setConf(key === "k" ? 2 : (key === "s" ? 1 : 0)); return;
  }
  if(key === "f"){ e.preventDefault(); it.flag = !it.flag; renderQ(); saveProgress(); return; }
  if(key === "n" || e.key === "ArrowRight"){
    e.preventDefault();
    if(S.i === S.session.length-1) renderGate(); else goNext();
    return;
  }
  if(key === "p" || e.key === "ArrowLeft"){ e.preventDefault(); goPrev(); return; }
  if(key === "m"){ e.preventDefault(); S.showNav = !S.showNav; renderQ(); return; }
});

      ? 'Your '+S.sim.list.length+' performance-based tasks are scored with these items. A simulation is a single sitting and cannot be parked.'

/* Mixes your weakest objectives together instead of drilling one at a time.
   Blocked practice feels more effective and transfers worse. */
function weakInterleave(n){
  const LIFE = lifetime();
  let codes = Object.keys(OBJ).filter(function(o){
    const v = LIFE.objs[o];
    return v && v.n >= 3 && (v.c/v.n) < 0.85;
  }).sort(function(a,b){
    return (LIFE.objs[a].c/LIFE.objs[a].n) - (LIFE.objs[b].c/LIFE.objs[b].n);
  });
  if(!codes.length){
    /* nothing measured yet: fall back to whatever is due or unseen */
    return retrievalQueue(n);
  }
  codes = codes.slice(0, 6);
  const pools = {};
  codes.forEach(function(c){
    pools[c] = shuffle((byObj[c]||[]).slice()).sort(function(a,b){
      const ra = {weak:0, learning:1, "new":2, firm:3, retired:4};
      return ra[itemState(a.id)] - ra[itemState(b.id)];
    });
  });
  const out = [];
  let pass = 0;
  while(out.length < n && pass < 40){
    for(let i=0;i<codes.length && out.length<n;i++){
      const p = pools[codes[i]];
      if(p && p.length) out.push(p.shift().id);
    }
    pass++;
  }
  return shuffle(out);
}

/* ---------------------------------------------------------------- simulation */
function startSim(){
  const picks = [];
  ["firewall","log","zone"].forEach(function(t){
    const pool = shuffle(PBQ.filter(function(p){ return p.type === t; }));
    if(pool.length) picks.push(pool[0]);
  });
  const rest = shuffle(PBQ.filter(function(p){ return picks.indexOf(p) === -1; }));
  while(picks.length < SIMSPEC.pbq && rest.length) picks.push(rest.shift());
  const items = buildExam({kind:"weighted", count:SIMSPEC.mc});
  if(!items.length || !picks.length) return;
  S.session = items;
  S.spec = {mode:"sim", label:"Exam-day simulation", arg:null, minutes:SIMSPEC.minutes};
  S.i = 0; S.showNav = false; S.paused = false;
  S.sim = {list:picks.map(function(p){ return p.id; }), pi:0, sel:{}};
  S.phase = "pbq";
  S.started = Date.now();

  show(VE);
  if(S.tick) clearInterval(S.tick);

  S.tLast = Date.now();

}
function renderSimPbq(){

  });
  if($("#smPrev")) $("#smPrev").onclick = function(){ S.sim.pi--; renderSimPbq(); window.scrollTo(0,0); };
  $("#smNext").onclick = function(){

      S.phase = "mc"; S.tLast = Date.now();
      renderQ(); window.scrollTo(0,0);

function gradeSim(R){
  if(!(S.spec && S.spec.mode === "sim" && S.sim)) return;
  R.sim = {items:[], cells:0, right:0};
  S.sim.list.forEach(function(id){
    const p = PBQBY[id], sel = S.sim.sel[id] || {}, g = gradePbq(p, sel);
    R.sim.items.push({p:p, sel:sel, n:g.n, c:g.c, frac:g.frac});
    R.sim.cells += g.n; R.sim.right += g.c;
    const st = PRACT.pbq[id] || {best:0, n:0};
    st.last = g.frac; st.best = Math.max(st.best||0, g.frac); st.n = (st.n||0)+1; st.ts = Date.now();
    PRACT.pbq[id] = st;
  });
  savePractice();
  const eq = SIMSPEC.equiv, pq = R.sim.items.length;
  const pbqEquiv = R.sim.items.reduce(function(a,x){ return a + x.frac*eq; }, 0);
  R.blendTotal = R.total + eq*pq;
  R.blend = R.blendTotal ? (R.correct + pbqEquiv)/R.blendTotal : 0;
  R.pbqAvg = pq ? R.sim.items.reduce(function(a,x){ return a + x.frac; },0)/pq : null;
}

/* ---------------------------------------------------------------- scoring */
function score(){
  const R = { total:S.session.length, correct:0, answered:0, unanswered:0,
    domains:{}, objs:{}, diff:{1:{n:0,c:0},2:{n:0,c:0},3:{n:0,c:0}},
    cal:{mastered:0, held:0, lucky:0, blind:0, gap:0, untaught:0, untagged:0},
    missed:[], items:[] };
  Object.keys(DOMAINS).forEach(function(d){ R.domains[d]={n:0,c:0}; });
  S.session.forEach(function(it){
    const q = it.q, pick = it.picked.slice().sort();
    const ok = pick.length === q.C.length && pick.every(function(v,i){ return v === q.C[i]; });
    if(it.picked.length) R.answered++; else R.unanswered++;
    if(ok) R.correct++; else R.missed.push(q.id);
    R.domains[q.d].n++; if(ok) R.domains[q.d].c++;
    R.diff[q.df].n++; if(ok) R.diff[q.df].c++;
    const o = R.objs[q.o] = R.objs[q.o] || {n:0,c:0,blind:0,untaught:0,lucky:0,topics:[],cards:[],d:q.d};
    o.n++; if(ok) o.c++;
    let state = "untagged";
    if(it.conf === 2 && ok) state = "mastered";
    else if(it.conf === 2 && !ok) state = "blind";
    else if(it.conf === 1 && ok) state = "held";
    else if(it.conf === 1 && !ok) state = "gap";
    else if(it.conf === 0 && ok) state = "lucky";
    else if(it.conf === 0 && !ok) state = "untaught";
    R.cal[state]++;
    if(state === "blind") o.blind++;
    if(state === "untaught") o.untaught++;
    if(state === "lucky") o.lucky++;
    if(!ok || state === "lucky"){ o.topics.push(q.t); o.cards.push({q:q, state:state, ok:ok}); }
    it.secs = Math.round((it.ms||0)/1000);
    R.items.push({it:it, ok:ok, state:state});
    recordItem(q.id, ok, it.conf, it.ms);
  });
  savePractice();
  /* right, but slow: correct answers that ate well over the 60s/item budget */
  R.slow = R.items.filter(function(x){ return x.ok && x.it.secs >= 100; })
                  .sort(function(a,b){ return b.it.secs - a.it.secs; });
  R.raw = R.total ? R.correct/R.total : 0;
  R.scaled = scaled(R.raw);
  R.queue = Object.keys(R.objs).map(function(code){
    const o = R.objs[code], dn = R.domains[o.d].n || 1;
    const wt = DOMAINS[o.d].w * (o.n/dn), wrong = o.n - o.c;
    const effMiss = Math.min(1, (wrong + 0.75*o.lucky) / o.n);
    const mult = 1 + 0.5*(wrong ? o.blind/wrong : 0) + 0.25*(wrong ? o.untaught/wrong : 0);
    return {code:code, o:o, weight:wt, risk:wt*effMiss*mult, acc:o.c/o.n};
  }).filter(function(x){ return x.risk > 0.01; }).sort(function(a,b){ return b.risk - a.risk; });
  return R;
}
function verdict(R){
  const blended = (typeof R.blend === "number");
  const s = blended ? scaled(R.blend) : R.scaled;
  const raw = blended ? R.blend : R.raw;
  if(raw >= GOAL.raw) return ["At the readiness target","This run met the "+pct(GOAL.raw)+"% target. Check the gate on the console: consistency across two full runs, no weak domain, and clean pacing are what confirm it."];
  if(s >= PASS) return ["Above the cut, below the target","You would likely pass today, but without margin for a bad question set. The focus queue is where the remaining points are."];
  if(s >= 650) return ["Close, but short of the cut","The gap is concentrated, not general. Working the top three objectives is worth more than another full-length attempt right now."];
  if(s >= 500) return ["Meaningful gaps across the blueprint","More than one domain is dragging. Work the queue top-down in drills before taking another full diagnostic."];
  return ["Foundations first","Content gaps are broad enough that timed practice will not help yet. Use objective drills with the notes, starting at the top of the queue."];
}
function finish(auto){
  touchTime();
  if(S.tick){ clearInterval(S.tick); S.tick = null; }
  clearProgress();
  const R = score();
  R.elapsed = (Date.now() - S.started)/1000;
  R.autoSubmitted = !!auto;
  gradeSim(R);
  let domMin = 1;
  Object.keys(R.domains).forEach(function(d){ const v=R.domains[d]; if(v.n) domMin = Math.min(domMin, v.c/v.n); });
  const isSim = S.spec.mode === "sim";
  const rec = { ts:Date.now(), label:S.spec.label, mode:S.spec.mode, total:R.total, correct:R.correct,
    scaled: isSim ? scaled(R.blend) : R.scaled, elapsed:Math.round(R.elapsed), missed:R.missed, domains:R.domains,
    cal:R.cal, timed:!!S.deadline, paused:!!S.paused, domMin:domMin, topRisk:R.queue.length?+R.queue[0].risk.toFixed(2):0,
    slow: R.slow ? R.slow.length : 0,
    objs:Object.keys(R.objs).reduce(function(a,k){ a[k]={n:R.objs[k].n,c:R.objs[k].c}; return a; },{}) };
  if(isSim){ rec.blend = +R.blend.toFixed(4); rec.pbqAvg = R.pbqAvg === null ? null : +R.pbqAvg.toFixed(4); rec.pbqN = R.sim.items.length; }
  $("#progFill").style.width = "100%";
  $("#railStat").innerHTML = '<span class="mono">'+R.correct+'/'+R.total+' '+DOT+' scaled '+rec.scaled+'</span>';
  renderReport(R); show(VR);
  persist(rec).then(function(where){
    const f = $("#syncNote");
    if(f) f.textContent = where === "synced" ? "Saved to your account." : "Saved in this browser.";
  });
}

/* ---------------------------------------------------------------- report */
function dial(sc){
  const f = Math.max(0, Math.min(1, (sc-100)/800));
  const b = band(sc >= PASS ? 0.9 : (sc >= 650 ? 0.72 : (sc >= 500 ? 0.6 : 0.3)));
  const rad = (150 + 240*((PASS-100)/800))*Math.PI/180, cx=95, cy=100;
  const gRad = (150 + 240*((scaled(GOAL.raw)-100)/800))*Math.PI/180;
  const arc = "M32.7,136 A72,72 0 1 1 157.3,136";
  return '<svg class="dial" viewBox="0 0 190 172" role="img" aria-label="Estimated scaled score '+sc+' out of 900. Pass mark 750, readiness target '+scaled(GOAL.raw)+'.">'+
    '<path d="'+arc+'" fill="none" stroke="var(--surface-3)" stroke-width="14"/>'+
    '<path d="'+arc+'" fill="none" stroke="var(--'+b.k+')" stroke-width="14" pathLength="100" stroke-dasharray="'+(f*100).toFixed(2)+' 100"/>'+
    '<line x1="'+(cx+Math.cos(rad)*61).toFixed(1)+'" y1="'+(cy+Math.sin(rad)*61).toFixed(1)+'" x2="'+(cx+Math.cos(rad)*83).toFixed(1)+'" y2="'+(cy+Math.sin(rad)*83).toFixed(1)+'" stroke="var(--ink)" stroke-width="2"/>'+
    '<line x1="'+(cx+Math.cos(gRad)*63).toFixed(1)+'" y1="'+(cy+Math.sin(gRad)*63).toFixed(1)+'" x2="'+(cx+Math.cos(gRad)*81).toFixed(1)+'" y2="'+(cy+Math.sin(gRad)*81).toFixed(1)+'" stroke="var(--ok)" stroke-width="2" stroke-dasharray="2 2"/>'+
    '<text x="95" y="101" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="39" font-weight="600" fill="var(--ink)">'+sc+'</text>'+
    '<text x="95" y="119" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9.5" fill="var(--ink-3)" letter-spacing="1.4">SCALED / 900</text>'+
    '<text x="95" y="152" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" fill="var(--ink-3)" letter-spacing="1.1">CUT 750  '+DOT+'  TARGET '+scaled(GOAL.raw)+'</text></svg>';
}
function kpi(v,l){ return '<span class="kpi"><b>'+v+'</b><span>'+l+'</span></span>'; }
function stRow(cls,n,name,sub){
  return '<div class="st '+cls+'"><b>'+n+'</b><span class="tx"><span class="n">'+name+'</span><span class="s">'+sub+'</span></span></div>';
}

/* Everything the user personally still gets wrong, on one page, for the last
   few days before the exam. Built from the ledger, not from a single run. */
function cramMarkdown(){
  const LIFE = lifetime(), EX = exposure(), L = [];
  L.push("# SY0-701 cram sheet " + DASH + " " + new Date().toLocaleDateString());
  L.push("");
  L.push(EX.seen + " of " + EX.total + " bank items attempted " + DOT + " " + EX.weak +
    " weak " + DOT + " " + EX.learning + " learning " + DOT + " " + EX.retired + " retired");
  L.push("");

  const weakObjs = Object.keys(OBJ).filter(function(o){
    const v = LIFE.objs[o]; return v && v.n >= 3 && (v.c/v.n) < 0.85;
  }).sort(function(a,b){ return (LIFE.objs[a].c/LIFE.objs[a].n) - (LIFE.objs[b].c/LIFE.objs[b].n); });
  L.push("## 1. Objectives still under 85%");
  L.push("");
  if(!weakObjs.length){ L.push("Nothing below 85% on your lifetime record."); L.push(""); }
  if(weakObjs.length > 8){
    L.push("Showing the weakest 8 of " + weakObjs.length + ". The rest are in the objective library.");
    L.push("");
  }
  weakObjs.slice(0,8).forEach(function(o){
    const v = LIFE.objs[o], b = STUDY[o];
    L.push("### " + o + " " + OBJ[o] + " " + DASH + " " + pct(v.c/v.n) + "% (" + v.c + "/" + v.n + ")");
    L.push("");
    if(b){
      L.push("- **Start here:** " + b.start);
      b.traps.forEach(function(t){ L.push("- **Trap:** " + t); });
      L.push("- **Search:** " + b.terms.map(function(t){ return "`"+t+"`"; }).join(", "));
    }
    L.push("");
  });

  L.push("## 2. Questions you are still getting wrong");
  L.push("");
  const byO = {};
  BANK.forEach(function(q){
    const st = itemState(q.id);
    if(st !== "weak" && st !== "learning") return;
    (byO[q.o] = byO[q.o] || []).push({q:q, st:st});
  });
  /* Weakest objectives first, and capped: a sheet you cannot read in one
     sitting is not a cram sheet. */
  const keys = Object.keys(byO).sort(function(a,b){
    const va = LIFE.objs[a], vb = LIFE.objs[b];
    const ra = (va && va.n) ? va.c/va.n : 0, rb = (vb && vb.n) ? vb.c/vb.n : 0;
    if(ra !== rb) return ra - rb;
    return a < b ? -1 : 1;
  });
  const outstanding = keys.reduce(function(a,o){ return a + byO[o].length; }, 0);
  if(!keys.length){ L.push("Nothing in the weak or learning state."); L.push(""); }
  let budget = 60;
  if(outstanding > budget){
    L.push("Showing " + budget + " of " + outstanding + " outstanding items, weakest objectives first.");
    L.push("");
  }
  keys.forEach(function(o){
    if(budget <= 0) return;
    const sorted = byO[o].slice().sort(function(a,b){
      return (a.st === "weak" ? 0 : 1) - (b.st === "weak" ? 0 : 1);
    });
    const take = sorted.slice(0, Math.min(budget, 8));
    if(!take.length) return;
    budget -= take.length;
    L.push("### " + o + " " + OBJ[o] + (sorted.length > take.length ? " (" + take.length + " of " + sorted.length + ")" : ""));
    L.push("");
    take.forEach(function(x){
      L.push("- **" + x.q.t + "**" + (x.st === "weak" ? " (missed most recently)" : "") + " " + DASH + " " + x.q.note);
    });
    L.push("");
  });

  const pend = CARDS.filter(function(c){ const st = PRACT.cards[c.id]; return !st || (st.box||0) < 3; });
  L.push("## 3. Ports and acronyms not yet mastered (" + pend.length + ")");
  L.push("");
  ["p","a"].forEach(function(d){
    const sub = pend.filter(function(c){ return c.d === d; });
    if(!sub.length) return;
    L.push("**" + (d === "p" ? "Ports" : "Acronyms") + "**");
    L.push("");
    sub.forEach(function(c){ L.push("- `" + c.f + "` " + DASH + " " + c.b); });
    L.push("");
  });

  const smiss = SCEN.filter(function(sc){ const st = PRACT.scen[sc.id]; return st && st.m; });
  L.push("## 4. Best / First items you have missed (" + smiss.length + ")");
  L.push("");
  if(!smiss.length){ L.push("None missed yet."); L.push(""); }
  smiss.forEach(function(sc){
    L.push("- **" + sc.k + " " + DASH + " " + sc.q + "**");
    L.push("  - Answer: " + sc.a[sc.c]);
    L.push("  - Trap: " + sc.trap);
  });
  L.push("");

  const pw = PBQ.filter(function(p){ const st = PRACT.pbq[p.id]; return !st || st.best < 0.8; });
  L.push("## 5. PBQ tasks still below the 80% standard (" + pw.length + ")");
  L.push("");
  if(!pw.length) L.push("Every attempted task is at or above 80%.");
  pw.forEach(function(p){
    const st = PRACT.pbq[p.id];
    L.push("- " + PBQTYPE[p.type] + " " + DOT + " " + p.title + " " + DASH + " " +
      (st ? pct(st.best) + "% best" : "not attempted"));
  });
  L.push("");

  const sbo = scenByObj();
  const sweak = Object.keys(sbo).filter(function(o){ return sbo[o].m > 0; })
    .sort(function(a,b){ return (sbo[a].n-sbo[a].m)/sbo[a].n - (sbo[b].n-sbo[b].m)/sbo[b].n; });
  if(sweak.length){
    L.push("## 6. Judgement accuracy by objective");
    L.push("");
    sweak.forEach(function(o){
      const v = sbo[o];
      L.push("- " + o + " " + OBJ[o] + " " + DASH + " " + pct((v.n-v.m)/v.n) + "% of " + v.n + " scenario" + (v.n === 1 ? "" : "s"));
    });
  }
  return L.join("\n");
}

function renderReview(R, filter){
  const list = R.items.filter(function(x){
    if(filter === "missed") return !x.ok;
    if(filter === "shaky") return !x.ok || x.state === "lucky";
    if(filter === "flagged") return x.it.flag;
    return true;
  });
  const box = $("#revList");
  if(!list.length){ box.innerHTML = '<div class="empty">Nothing here.</div>'; return; }
  box.innerHTML = list.map(function(x){
    const q = x.it.q, picked = x.it.picked;
    const cls = x.ok ? (x.state==="lucky" ? "luck" : "right") : "wrong";
    const mk = x.ok ? (x.state==="lucky" ? "?" : "&#10003;") : "&#10007;";
    const answers = q.a.map(function(txt,i){
      const isC = q.C.indexOf(i) > -1, isP = picked.indexOf(i) > -1;
      const k = isC ? "correct" : (isP ? "chosen" : "plain");

    }).join("");
    const none = picked.length ? "" : '<div class="mono" style="font-size:.74rem;color:var(--ink-3)">Left unanswered.</div>';
    return '<details class="rq '+cls+'"'+(x.ok?"":" open")+'><summary><span class="mk">'+mk+'</span>'+
      '<span class="sq">'+esc(q.q)+'</span><span class="ocode">'+q.o+'</span></summary>'+
      '<div class="rq-body"><p class="full">'+esc(q.q)+(q.m?' <span class="mono" style="font-size:.72rem;color:var(--high)">(SELECT TWO)</span>':'')+'</p>'+
      none+'<div class="ans">'+answers+'</div>'+
      '<div class="expl"><b>Why:</b> '+esc(q.e)+'</div>'+
      '<div class="notebox"><span class="lbl">Write this down '+DASH+' '+q.o+' '+esc(OBJ[q.o])+'</span>'+esc(q.note)+'</div>'+
      '<div class="mono" style="font-size:.7rem;color:var(--ink-3)">'+q.o+' '+DOT+' '+DIFF[q.df]+' '+DOT+' '+esc(q.t)+
      (x.it.secs ? ' '+DOT+' '+x.it.secs+'s on task' : '')+'</div></div></details>';

/* ------------------------------------------------------------ item ledger */
/* Per-question retrieval record. Box advances only on a correct answer the
   user did not guess, so a lucky guess never retires an item.
   n seen, c correct, k current streak, b box, f last confidence, d due, ms last seconds */
const QBOXDAYS = [0,1,3,7,16];
function ledger(id){ return PRACT.items[id] || null; }
/* State tracks the streak, not the box: the box only schedules the next sight
   of an item, while the streak is what says whether you actually know it. */
function itemState(id){
  const st = PRACT.items[id];
  if(!st || !st.n) return "new";
  const k = st.k || 0;
  if(k === 0) return "weak";
  if(k === 1) return "learning";
  if(k >= 3) return "retired";
  return "firm";
}
function itemDue(id){
  const st = PRACT.items[id];
  if(!st || !st.n) return true;
  return (st.d || 0) <= Date.now();
}
function recordItem(id, ok, conf, ms){
  const st = PRACT.items[id] || {n:0,c:0,k:0,b:0,f:null,d:0,ms:0};
  st.n++; if(ok) st.c++;
  const credited = ok && conf !== 0;           /* a guessed-right answer earns no box */
  /* The box can never run ahead of the streak, so an item you have just
     relearned comes back soon even if it once held a long interval. */
  if(credited){ st.k = (st.k||0)+1; st.b = Math.min(4, (st.b||0)+1, st.k+1); }
  else if(ok){ st.k = 0; st.b = Math.max(0, (st.b||0)-1); }   /* right, but guessed */
  else { st.k = 0; st.b = 0; }
  st.f = (conf === null || conf === undefined) ? null : conf;
  st.d = Date.now() + QBOXDAYS[st.b]*86400000;
  st.ms = ms ? Math.round(ms/1000) : (st.ms||0);
  st.t = Date.now();
  PRACT.items[id] = st;
}
/* one-time backfill: older attempts only recorded what was missed */
function seedLedger(){
  if(Object.keys(PRACT.items).length) return;
  const m = missCounts(), seeded = {};
  Object.keys(m).forEach(function(id){
    if(!byId[id]) return;
    seeded[id] = {n:m[id], c:0, k:0, b:0, f:null, d:0, ms:0, t:0};
  });
  if(Object.keys(seeded).length){ PRACT.items = seeded; savePractice(); }
}
function exposure(){
  let seen=0, weak=0, learning=0, firm=0, retired=0;
  BANK.forEach(function(q){
    const stt = itemState(q.id);
    if(stt === "new") return;
    seen++;
    if(stt === "weak") weak++;
    else if(stt === "learning") learning++;
    else if(stt === "firm") firm++;
    else retired++;
  });
  return {total:BANK.length, seen:seen, fresh:BANK.length-seen,
          weak:weak, learning:learning, firm:firm, retired:retired,
          pct: BANK.length ? seen/BANK.length : 0};
}
/* Items to retest, hardest and most overdue first. Falls back to unseen items
   when nothing is due, so the queue is never empty. */
function retrievalQueue(limit){
  const rank = {weak:0, learning:1, firm:2, retired:3, "new":4};
  const due = BANK.filter(function(q){ return itemState(q.id) !== "new" && itemDue(q.id); });
  due.sort(function(a,b){
    const ra = rank[itemState(a.id)], rb = rank[itemState(b.id)];
    if(ra !== rb) return ra - rb;
    return (ledger(a.id).d||0) - (ledger(b.id).d||0);
  });
  let out = due.map(function(q){ return q.id; });
  if(out.length < (limit||60)){
    const fresh = shuffle(BANK.filter(function(q){ return itemState(q.id) === "new"; }));
    out = out.concat(fresh.map(function(q){ return q.id; }));
  }
  return out.slice(0, limit||60);
}
function dueCount(){
  let n = 0;
  BANK.forEach(function(q){ if(itemState(q.id) !== "new" && itemDue(q.id)) n++; });
  return n;
}
function scenByObj(){
  const out = {};
  SCEN.forEach(function(sc){
    const st = PRACT.scen[sc.id];
    if(!st || !st.s) return;
    if(!out[sc.o]) out[sc.o] = {n:0, m:0};
    out[sc.o].n += st.s; out[sc.o].m += st.m||0;
  });
  return out;
}

/* ---------------------------------------------------------- flashcards */
const FC = {queue:[], i:0, flipped:0, deck:"p", rev:false, right:0, wrong:0, done:false};
function startCards(deck, dueOnly){
  FC.deck = deck; FC.rev = false; FC.i = 0; FC.flipped = 0; FC.right = 0; FC.wrong = 0; FC.done = false;
  let pool = CARDS.filter(function(c){ return deck === "b" ? true : c.d === deck; });
  if(dueOnly) pool = pool.filter(cardDue);
  FC.dueOnly = !!dueOnly;
  FC.queue = shuffle(pool);
  show(VF); renderCard();
}
function gradeCard(good){
  const c = FC.queue[FC.i];
  const st = PRACT.cards[c.id] || {box:0, due:0, s:0, m:0};
  st.s = (st.s||0) + 1;
  if(good){ st.box = Math.min(4, (st.box||0) + 1); }
  else { st.box = 0; st.m = (st.m||0) + 1; FC.queue.push(c); }
  st.due = Date.now() + BOXDAYS[st.box]*86400000;
  PRACT.cards[c.id] = st;
  if(good) FC.right++; else FC.wrong++;
  savePractice();
  FC.i++; FC.flipped = 0;
  if(FC.i >= FC.queue.length) FC.done = true;
  renderCard();
}
function renderCard(){
  const h = [];
  if(FC.done){
    const total = FC.right + FC.wrong;
    h.push('<div class="fc-wrap"><span class="eyebrow">Session complete</span>'+
      '<h1>'+FC.right+' of '+total+' first-pass correct</h1>'+
      '<p class="hint">Missed cards were pushed back into this session and reset to box 1, so they will come round again sooner. Mastered means a card has survived three correct passes.</p>'+
      '<div class="navrow"><button class="btn" id="fcAgain">Run again</button>'+
      '<button class="btn sec" id="fcHome">Back to console</button></div></div>');
    VF.innerHTML = h.join("");
    $("#fcAgain").onclick = function(){ startCards(FC.deck, FC.dueOnly); };
    $("#fcHome").onclick = goConsole;
    return;
  }
  const c = FC.queue[FC.i];
  const st = PRACT.cards[c.id] || {box:0};
  const canRev = FC.deck === "p";
  const prompt = (canRev && FC.rev) ? c.b : c.f;
  const answer = (canRev && FC.rev) ? c.f : c.b;
  const sideLabel = c.d === "p" ? ((canRev && FC.rev) ? "Protocol" : "Port") : "Acronym";
  h.push('<div class="fc-wrap">');
  h.push('<div class="fc-top"><span class="eyebrow">'+(c.d==="p"?"Ports":"Acronyms")+'</span>'+
    (canRev ? '<button class="dk" id="fcRev" aria-pressed="'+FC.rev+'">Reverse</button>' : '')+
    '<span class="frac">'+(FC.i+1)+' / '+FC.queue.length+' '+DOT+' box '+((st.box||0)+1)+' of 5</span></div>');
  h.push('<div class="boxbar">'+[0,1,2,3,4].map(function(b){
    return '<i class="'+((st.box||0) >= b ? "on"+(st.box||0) : "")+'"></i>'; }).join("")+'</div>');
  if(!FC.flipped){
    h.push('<div class="card" id="fcCard"><span class="side">'+sideLabel+'</span>'+
      '<span class="front">'+esc(prompt)+'</span>'+
      '<span class="tapme">click, or press space, to reveal</span></div>');
  } else {
    h.push('<div class="card" id="fcCard"><span class="side">'+esc(prompt)+'</span>'+
      '<span class="back">'+esc(answer)+'</span><span class="x">'+esc(c.x)+'</span></div>');
    h.push('<div class="fc-grade"><button class="btn miss" id="fcBad">Missed it</button>'+
      '<button class="btn ok" id="fcGood">Got it</button></div>');
  }
  h.push('<p class="hint"><b>Space</b> reveals, then <b>1</b> missed / <b>2</b> got it. Missed cards reset to box 1 and reappear this session.</p>');
  h.push('<div class="navrow"><button class="btn sec" id="fcHome">End session</button></div></div>');
  VF.innerHTML = h.join("");
  $("#fcCard").onclick = function(){ if(!FC.flipped){ FC.flipped = 1; renderCard(); } };
  if($("#fcRev")) $("#fcRev").onclick = function(){ FC.rev = !FC.rev; renderCard(); };
  if($("#fcGood")) $("#fcGood").onclick = function(){ gradeCard(true); };
  if($("#fcBad")) $("#fcBad").onclick = function(){ gradeCard(false); };
  $("#fcHome").onclick = goConsole;
}

/* ---------------------------------------------------------------- PBQ */
const PB = {cur:null, sel:[], graded:false};
function renderPbqList(){
  const h = [];
  h.push('<div class="hero" style="padding-bottom:18px"><span class="eyebrow">Performance-based questions</span>'+
    '<h1>Build it, read it, place it</h1>'+
    '<p>The live exam opens with three to five of these. They are worth more than a multiple-choice item and they are where most of the clock goes. These are written in the three formats CompTIA actually uses.</p></div>');
  ["firewall","log","zone"].forEach(function(t){
    h.push('<div class="libhead"><h2>'+PBQTYPE[t]+'</h2><span class="wt">'+PBQ.filter(function(p){return p.type===t;}).length+' tasks</span></div><div class="pbq-list">');
    PBQ.filter(function(p){ return p.type === t; }).forEach(function(p){
      const st = PRACT.pbq[p.id];
      const b = st ? band(st.best) : null;
      h.push('<button class="pbq-card '+(st?"done":"")+'" data-pbq="'+p.id+'">'+
        '<span class="ty">'+p.o+'</span><span class="tt">'+esc(p.title)+'</span>'+
        (st ? '<span class="pill '+b.k+'">best '+pct(st.best)+'%</span>' : '<span class="oct">not attempted</span>')+
        '<span class="studybtn">'+(st?"Retry":"Start")+'</span></button>');
    });
    h.push('</div>');
  });
  h.push('<p class="note">Scores here feed the PBQ readiness row on your console gate: six or more attempted with an average best score of 80% or better.</p>');
  VP.innerHTML = h.join("");
  VP.querySelectorAll("[data-pbq]").forEach(function(b){ b.onclick = function(){ openPbq(b.dataset.pbq); }; });
  show(VP);
}
function pbqInputs(p, sel, graded){
  const h = [];
  if(p.rows){
    h.push('<div class="ptable"><table><thead><tr>'+p.cols.map(function(c){ return '<th>'+esc(c)+'</th>'; }).join("")+'</tr></thead><tbody>');
    p.rows.forEach(function(r,ri){
      h.push('<tr><td class="rn">'+esc(r.label)+'</td>');
      r.cells.forEach(function(c,ci){
        const key = ri+"_"+ci, cur = sel[key];
        const cls = graded ? (cur === c.c ? "right" : "wrong") : "";
        h.push('<td><select class="psel '+cls+'" data-k="'+key+'"'+(graded?" disabled":"")+'>'+
          '<option value="">-- select --</option>'+
          PSET[c.o].map(function(o,i){ return '<option value="'+i+'"'+(cur===i?" selected":"")+'>'+esc(o)+'</option>'; }).join("")+
          '</select></td>');
      });
      h.push('</tr>');
    });
    h.push('</tbody></table></div>');
  }
  if(p.fields){
    h.push('<div class="pfields">');
    p.fields.forEach(function(f,fi){
      const key = "f_"+fi, cur = sel[key];
      const cls = graded ? (cur === f.c ? "right" : "wrong") : "";
      h.push('<div class="pfield"><span class="pl">'+esc(f.label)+'</span>'+
        '<select class="psel '+cls+'" data-k="'+key+'"'+(graded?" disabled":"")+'>'+
        '<option value="">-- select --</option>'+
        PSET[f.o].map(function(o,i){ return '<option value="'+i+'"'+(cur===i?" selected":"")+'>'+esc(o)+'</option>'; }).join("")+
        '</select>');
      if(graded) h.push('<span class="pwhy'+(cur===f.c?"":" bad")+'">'+(cur===f.c?"":"Correct: <b>"+esc(PSET[f.o][f.c])+"</b>. ")+esc(f.why)+'</span>');
      h.push('</div>');
    });
    h.push('</div>');
  }
  return h.join("");
}
function gradePbq(p, sel){
  const cs = pbqCells(p);
  let ok = 0;
  cs.forEach(function(x){ if(sel[x.key] === x.cell.c) ok++; });
  return {n:cs.length, c:ok, frac: cs.length ? ok/cs.length : 0};
}
function pbqBlanks(p, sel){
  const cs = pbqCells(p);
  let b = 0;
  cs.forEach(function(x){ if(sel[x.key] === undefined) b++; });
  return b;
}
function pbqCells(p){
  const out = [];
  if(p.rows) p.rows.forEach(function(r,ri){ r.cells.forEach(function(c,ci){ out.push({cell:c, key:ri+"_"+ci}); }); });
  if(p.fields) p.fields.forEach(function(f,fi){ out.push({cell:f, key:"f_"+fi}); });
  return out;
}
function openPbq(id){
  PB.cur = PBQBY[id]; PB.sel = {}; PB.graded = false;
  renderPbq();
}
/* Replay a task with answers already given, used to review simulation tasks. */
function openPbqWith(id, sel, graded){
  PB.cur = PBQBY[id]; PB.sel = {};
  if(sel) Object.keys(sel).forEach(function(k){ if(sel[k] !== undefined) PB.sel[k] = sel[k]; });
  PB.graded = !!graded;
  renderPbq();
}
function renderPbq(){
  const p = PB.cur, h = [];
  const cells = pbqCells(p);
  let correct = 0;
  if(PB.graded) cells.forEach(function(x){ if(PB.sel[x.key] === x.cell.c) correct++; });
  h.push('<div class="pbq-run">');
  h.push('<div><span class="eyebrow">'+PBQTYPE[p.type]+' '+DOT+' objective '+p.o+'</span>'+
    '<h1 style="margin-top:10px">'+esc(p.title)+'</h1></div>');
  if(PB.graded){
    const sc = cells.length ? correct/cells.length : 0, b = band(sc);
    h.push('<div class="pscore"><span><b style="color:var(--'+b.k+')">'+pct(sc)+'%</b><br><span class="lb">'+correct+' of '+cells.length+' correct</span></span>'+
      '<span class="spacer"></span><span class="pill '+b.k+'">'+(sc>=0.8?"Pass standard":"Below 80% target")+'</span></div>');
  }
  h.push('<p class="pbq-brief">'+esc(p.brief)+'</p>');
  if(p.reqs) h.push('<div class="reqs"><span class="rl">Requirements</span><ul>'+p.reqs.map(function(r){ return '<li>'+esc(r)+'</li>'; }).join("")+'</ul></div>');
  if(p.evidence) h.push('<div class="evid"><pre>'+esc(p.evidence)+'</pre></div>');

  h.push(pbqInputs(p, PB.sel, PB.graded));
  if(p.rows){
    if(PB.graded){
      h.push('<div class="pfields">');
      p.rows.forEach(function(r,ri){
        r.cells.forEach(function(c,ci){
          const key = ri+"_"+ci;
          if(PB.sel[key] !== c.c) h.push('<div class="pfield"><span class="pl">Row '+esc(r.label)+', '+esc(p.cols[ci+1])+'</span>'+
            '<span class="pwhy bad">Correct answer: <b>'+esc(PSET[c.o][c.c])+'</b></span></div>');
        });
      });
      h.push('</div>');
    }
  }
  if(PB.graded){
    h.push('<div class="expl"><b>Debrief:</b> '+esc(p.debrief)+'</div>');
    h.push('<div class="navrow"><button class="btn" id="pbRetry">Try again</button>'+
      '<button class="btn sec" id="pbList">All PBQs</button>'+
      '<button class="btn sec" id="pbHome">Console</button></div>');
  } else {
    h.push('<div class="navrow"><button class="btn" id="pbGrade">Submit</button>'+
      '<button class="btn sec" id="pbList">Back without submitting</button></div>');
  }
  h.push('</div>');
  VP.innerHTML = h.join("");
  VP.querySelectorAll("[data-k]").forEach(function(s){
    s.onchange = function(){ PB.sel[s.dataset.k] = s.value === "" ? undefined : +s.value; };
  });
  if($("#pbGrade")) $("#pbGrade").onclick = function(){
    const blanks = pbqBlanks(p, PB.sel);
    if(blanks && !confirm(blanks+" field(s) are still blank and will be scored as wrong. Submit anyway?")) return;
    PB.graded = true;
    const cs = pbqCells(p);
    let ok = 0; cs.forEach(function(x){ if(PB.sel[x.key] === x.cell.c) ok++; });
    const sc = cs.length ? ok/cs.length : 0;
    const st = PRACT.pbq[p.id] || {best:0, n:0};
    st.last = sc; st.best = Math.max(st.best||0, sc); st.n = (st.n||0)+1; st.ts = Date.now();
    PRACT.pbq[p.id] = st; savePractice();
    renderPbq(); window.scrollTo(0,0);
  };
  if($("#pbRetry")) $("#pbRetry").onclick = function(){ openPbq(p.id); window.scrollTo(0,0); };
  if($("#pbList")) $("#pbList").onclick = renderPbqList;
  if($("#pbHome")) $("#pbHome").onclick = goConsole;
  show(VP); window.scrollTo(0,0);
}

/* ---------------------------------------------------------- scenarios */
const SC = {queue:[], i:0, picked:null, right:0, missed:[], done:false};
function startScen(n){
  let pool = shuffle(SCEN);
  if(n) pool = pool.slice(0, n);
  SC.queue = pool; SC.i = 0; SC.picked = null; SC.right = 0; SC.missed = []; SC.done = false;
  show(VQ); renderScen();
}
function renderScen(){
  const h = [];
  if(SC.done){
    const t = SC.queue.length, acc = t ? SC.right/t : 0, b = band(acc);
    h.push('<div class="sc-wrap"><span class="eyebrow">Session complete</span>'+
      '<h1>'+SC.right+' of '+t+' correct</h1>'+
      '<div class="pscore"><span><b style="color:var(--'+b.k+')">'+pct(acc)+'%</b><br><span class="lb">this session</span></span></div>');
    if(SC.missed.length){
      h.push('<div style="display:grid;gap:8px"><span class="eyebrow">Review these</span>');
      SC.missed.forEach(function(s){
        h.push('<div class="sumrow"><span class="sc-tag">'+s.k+'</span><span>'+esc(s.q)+'</span>'+
          '<span class="ocode">'+s.o+'</span></div>');
      });
      h.push('</div>');
    }
    h.push('<div class="navrow"><button class="btn" id="scAgain">Another set</button>'+
      '<button class="btn sec" id="scHome">Back to console</button></div></div>');
    VQ.innerHTML = h.join("");
    $("#scAgain").onclick = function(){ startScen(SC.queue.length); };
    $("#scHome").onclick = goConsole;
    return;
  }
  const s = SC.queue[SC.i];
  h.push('<div class="sc-wrap">');
  h.push('<div class="qmeta"><span class="sc-tag">'+s.k+'</span><span class="ocode">'+s.o+'</span>'+
    '<span class="otitle">'+esc(OBJ[s.o])+'</span>'+
    '<span class="dtag">'+(SC.i+1)+' / '+SC.queue.length+'</span></div>');
  h.push('<p class="sc-stem">'+esc(s.q)+'</p>');
  h.push('<div class="sc-opts">');
  s.a.forEach(function(txt,i){
    let cls = "";
    if(SC.picked !== null){
      if(i === s.c) cls = "correct";
      else if(i === SC.picked) cls = "chosen";
    }
    h.push('<button class="sc-opt '+cls+'" data-pick="'+i+'"'+(SC.picked!==null?" disabled":"")+'>'+
      '<span class="ltr">'+LTR[i]+'</span><span>'+esc(txt)+'</span></button>');
  });
  h.push('</div>');
  if(SC.picked !== null){
    h.push('<div class="expl"><b>Why:</b> '+esc(s.e)+'</div>');
    h.push('<div class="trapbox"><span class="lbl">The trap</span>'+esc(s.trap)+'</div>');
    h.push('<div class="navrow"><button class="btn" id="scNext">'+(SC.i===SC.queue.length-1?"Finish":"Next")+'</button></div>');
  } else {
    h.push('<p class="hint">Commit to an answer before the explanation appears. Keys <b>1</b>&ndash;<b>4</b> work too.</p>');
  }
  h.push('<div class="navrow" style="margin-top:8px"><button class="btn sec" id="scHome">End session</button></div></div>');
  VQ.innerHTML = h.join("");
  VQ.querySelectorAll("[data-pick]").forEach(function(b){ b.onclick = function(){ pickScen(+b.dataset.pick); }; });
  if($("#scNext")) $("#scNext").onclick = nextScen;
  $("#scHome").onclick = goConsole;
}
function pickScen(i){
  if(SC.picked !== null) return;
  const s = SC.queue[SC.i];
  SC.picked = i;
  const ok = i === s.c;
  if(ok) SC.right++; else SC.missed.push(s);
  const st = PRACT.scen[s.id] || {s:0, m:0};
  st.s++; if(!ok) st.m++;
  PRACT.scen[s.id] = st; savePractice();
  renderScen();
}
function nextScen(){
  if(SC.i >= SC.queue.length-1){
    SC.done = true;
    PRACT.scenLog.push({ts:Date.now(), n:SC.queue.length, c:SC.right});
    PRACT.scenLog = PRACT.scenLog.slice(-40);
    savePractice();
  } else { SC.i++; SC.picked = null; }
  renderScen(); window.scrollTo(0,0);
}

/* keyboard for practice modes */
document.addEventListener("keydown", function(e){
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const t = e.target;
  if(t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.tagName === "SELECT" || t.isContentEditable)) return;
  const k = e.key.toLowerCase();
  if(!VF.hidden && !FC.done){
    if(e.key === " "){ e.preventDefault(); if(!FC.flipped){ FC.flipped = 1; renderCard(); } return; }
    if(FC.flipped && (k === "1" || k === "2")){ e.preventDefault(); gradeCard(k === "2"); return; }
  }
  if(!VQ.hidden && !SC.done){
    if(SC.picked === null && k >= "1" && k <= "4"){
      const i = +k - 1;
      if(i < SC.queue[SC.i].a.length){ e.preventDefault(); pickScen(i); }
      return;
    }
    if(SC.picked !== null && (k === "n" || e.key === "Enter" || e.key === " ")){ e.preventDefault(); nextScen(); return; }
  }
});
function goConsole(){ renderConsole(); show(VC); idleRail(); }

/* ---------------------------------------------------------------- boot */
idleRail();
renderConsole();
show(VC);
initStore();
})();
</script>
