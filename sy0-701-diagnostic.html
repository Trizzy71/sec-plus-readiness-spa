traps:["Data in use needs a TEE or secure enclave; TLS does nothing for it","Sovereignty is where data is STORED; geographic restriction is where users connect FROM","Hashing is one-way; tokenization is reversible only through the vault","Encryption does not restrict an authenticated user who already holds Modify"]},

"3.4":{start:"RTO and RPO drive everything else in this objective. Anchor on those two definitions, then map each backup method and site type back to them.",
covers:["High availability: load balancing vs clustering","Site considerations: hot, warm, cold, geographic dispersion","Platform diversity; multi-cloud","Continuity of operations","Capacity planning: people, technology, infrastructure","Testing: tabletop exercises, failover, simulation, parallel processing","Backups: onsite and offsite, frequency, encryption, snapshots, recovery, replication, journaling","Power: generators, uninterruptible power supplies"],
terms:["hot warm cold site comparison RTO cost","RTO vs RPO vs MTTR vs MTBF","3-2-1 backup rule immutable backup ransomware","disaster recovery test types tabletop simulation parallel failover","load balancing vs clustering high availability","continuity of operations plan COOP vs disaster recovery"],
traps:["RTO is downtime tolerance; RPO is data-loss tolerance and sets backup frequency","Snapshots share fate with production and are not ransomware protection","MTTR and MTBF are reliability measures, not recovery objectives","A UPS covers seconds to minutes; a generator covers hours. Long outages need both"]},

"4.1":{start:"Wireless security settings and the mobile deployment models are the highest-yield parts. Start with WPA3 and the BYOD/COPE/CYOD distinctions.",
covers:["Secure baselines: establish, deploy, maintain","Hardening targets: mobile devices, workstations, switches, routers, cloud infrastructure, servers, ICS/SCADA, embedded systems, RTOS, IoT devices","Wireless devices: installation considerations, site surveys, heat maps","Mobile solutions: mobile device management, deployment models (BYOD, COPE, CYOD), connection methods (cellular, wifi, Bluetooth)","Wireless security settings: WPA3, RADIUS, cryptographic protocols, authentication protocols","Application security: input validation, secure cookies, static code analysis, code signing","Sandboxing and monitoring"],
terms:["WPA3 SAE dragonfly handshake vs WPA2 PSK","CIS benchmark DISA STIG hardening guides","BYOD vs COPE vs CYOD comparison","wireless site survey heat map security","secure cookie flags HttpOnly Secure SameSite","code signing vs static analysis vs sandboxing"],
traps:["SAE prevents offline cracking of a captured handshake; that is WPA3's core improvement","Control level tracks ownership: COPE gives full control, BYOD only containerized management","Client-side validation is always bypassable; validation must be server-side","RTOS and ICS cannot run agents, so hardening means reachability and surface reduction"]},

"4.2":{start:"NIST SP 800-88 clear, purge and destroy covers the entire disposal half of this objective. Read that first, then the lifecycle stages.",
covers:["Acquisition and procurement process","Assignment and accounting: ownership, classification","Monitoring and asset tracking: inventory, enumeration","Disposal and decommissioning: sanitization, destruction, certification, data retention"],
terms:["NIST SP 800-88 media sanitization clear purge destroy","SSD sanitization crypto erase vs degaussing","certificate of destruction requirements","asset lifecycle management security","data retention policy legal requirements"],
traps:["SSDs cannot be degaussed and overwriting is unreliable because of wear levelling","Sanitize when the media will be reused; destroy when it will not","The owner is accountable; the custodian handles it day to day","Assets in your EDR console but not your inventory get no baseline, no patching and no offboarding"]},

"4.3":{start:"Learn the CVSS metric groups and what each contributes. That one topic covers most of the analysis half of this objective.",
covers:["Identification: vulnerability scan, application security (static, dynamic, package monitoring), threat feeds (OSINT, proprietary, information-sharing organizations, dark web), penetration testing, responsible disclosure and bug bounty, system and process audit","Analysis: confirmation (false positive, false negative), prioritize, CVSS, CVE, vulnerability classification, exposure factor, environmental variables, industry and organizational impact, risk tolerance","Response and remediation: patching, insurance, segmentation, compensating controls, exceptions and exemptions","Validation of remediation: rescanning, audit, verification","Reporting"],
terms:["CVSS v3.1 base temporal environmental metric groups","CVE vs CWE vs CVSS difference","SAST vs DAST vs IAST vs SCA","false positive vs false negative vulnerability scanning","vulnerability exception risk acceptance process","ISAC information sharing and analysis center"],
traps:["CVE is the identifier, CVSS is the score, CWE is the weakness class","Base score describes the flaw; environmental variables decide your priority","A patch is not remediated until a rescan confirms it","Suppressing a finding is not the same as filing an exception"]},

"4.4":{start:"Build a tool-to-job table: for each investigative question, which tool answers it. This objective is mostly about picking the right instrument.",
covers:["Monitoring computing resources: systems, applications, infrastructure","Activities: log aggregation, alerting, scanning, reporting, archiving, alert response and remediation, validation, quarantine, alert tuning","Tools: SCAP, benchmarks, agents and agentless, SIEM, antivirus, DLP, SNMP traps, NetFlow, vulnerability scanners"],
terms:["SIEM log correlation use cases","NetFlow vs full packet capture retention","SCAP security content automation protocol","alert tuning false positive reduction SOC","SNMPv3 vs SNMPv2c security","agent based vs agentless monitoring"],
traps:["Aggregation is the input; correlation is the value","NetFlow is metadata, packet capture is content","Tuning preserves the detection; disabling the rule creates a blind spot","A host being up says nothing about whether the transaction succeeds"]},

"4.5":{start:"The email trio (SPF, DKIM, DMARC) and the secure-protocol port swaps are near-guaranteed points. Learn those two before anything else in this objective.",
covers:["Firewall: rules, access lists, ports and protocols, screened subnets","IDS and IPS: trends, signatures","Web filter: agent-based, centralized proxy, URL scanning, content categorization, block rules, reputation","Operating system security: group policy, SELinux","Implementation of secure protocols: protocol selection, port selection, transport method","DNS filtering","Email security: DMARC, DKIM, SPF, gateway","File integrity monitoring; DLP; network access control; EDR and XDR; user behavior analytics"],
terms:["SPF DKIM DMARC explained alignment","DMARC policy none quarantine reject reporting","EDR vs XDR vs SIEM difference","SELinux enforcing permissive targeted policy","secure protocol port numbers cheat sheet","NAC posture assessment remediation VLAN","user behavior analytics UEBA baseline"],
traps:["SPF says who may send, DKIM signs the message, DMARC ties them to the visible From and sets policy","Only one SPF record per domain is valid","XDR differs from EDR by telemetry breadth, not by needing an agent","Agent-based web filtering follows the device; a central proxy does not"]},

"4.6":{start:"Two clusters generate most questions here: the five access control models, and SAML vs OAuth vs OIDC. Learn both as tables before touching anything else.",
covers:["Provisioning and deprovisioning user accounts; permission assignments and implications","Identity proofing; federation; single sign-on (LDAP, OAuth, SAML); interoperability; attestation","Access controls: mandatory, discretionary, role-based, rule-based, attribute-based, time-of-day restrictions, least privilege","Multifactor authentication implementations: biometrics, hard and soft tokens, security keys","Factors: something you know, have, are, and somewhere you are","Password concepts: length, complexity, reuse, expiration, age, password managers, passwordless","Privileged access management: just-in-time permissions, password vaulting, ephemeral credentials"],
terms:["SAML vs OAuth 2.0 vs OpenID Connect","MAC DAC RBAC ABAC rule-based comparison","NIST SP 800-63B password guidelines length","FIDO2 WebAuthn phishing resistant authentication","just in time privileged access management PAM","identity proofing vs access attestation","federation identity provider service provider trust"],
traps:["SAML is authentication, OAuth is authorization, OIDC is authentication built on OAuth","Multifactor means different CATEGORIES, not different devices","Proofing happens once before the account exists; attestation is the recurring review","Just-in-time removes standing privilege; vaulting does not"]},

"4.7":{start:"This objective is mostly recall. Memorize the three lists (use cases, benefits, other considerations) and you have covered nearly all of it.",
covers:["Use cases: user provisioning, resource provisioning, guard rails, security groups, ticket creation, escalation, enabling and disabling services and access, continuous integration and testing, integrations and APIs","Benefits: efficiency and time saving, enforcing baselines, standard infrastructure configurations, scaling securely, employee retention, reaction time, workforce multiplier","Other considerations: complexity, cost, single point of failure, technical debt, ongoing supportability"],
terms:["SOAR security orchestration automation and response","policy as code guard rails cloud","CI/CD pipeline security controls","SOAR playbook examples incident response","infrastructure as code drift detection"],
traps:["Both the benefits list and the considerations list are enumerated and both get tested","Guard rails prevent the insecure configuration; they do not detect it afterwards","Reaction time is the benefit that shortens detection to containment","The orchestrator holds aggregated privilege and is a single point of failure"]},

"4.8":{start:"NIST SP 800-61 for the phases and RFC 3227 for order of volatility cover most of this objective. Read both directly; they are short.",
covers:["Process: preparation, detection, analysis, containment, eradication, recovery, lessons learned","Training; testing: tabletop exercise, simulation","Root cause analysis; threat hunting","Digital forensics: legal hold, chain of custody, acquisition, reporting, preservation, e-discovery"],
terms:["NIST SP 800-61 incident response lifecycle phases","RFC 3227 order of volatility forensics","chain of custody vs legal hold vs e-discovery","threat hunting hypothesis driven methodology","root cause analysis five whys security incident"],
traps:["Containment stops spread, eradication removes the attacker and cause, recovery restores and validates","Restoring before eradicating simply reinfects","Legal hold is the instruction to preserve; chain of custody is the handling record","Isolating a host can destroy volatile evidence, so acquire memory first where feasible"]},

"4.9":{start:"This is the smallest objective. Learn the log-to-question mapping and the handful of Windows event IDs, and you have essentially finished it.",
covers:["Log data: firewall logs, application logs, endpoint logs, OS-specific security logs, IPS/IDS logs, network logs, metadata","Data sources: vulnerability scans, automated reports, dashboards, packet captures"],
terms:["Windows security event ID 4624 4625 4720 4672","syslog severity levels and facilities","C2 beaconing detection network logs interval","DHCP logs IP address to hostname investigation","packet capture vs flow data investigation"],
traps:["Firewall logs show connectivity, never which identity was used","Metadata answers who, when and with what without reading content","Dashboards aggregate and therefore hide the detail an investigation needs","In a dynamic environment an internal IP means nothing without DHCP or DNS logs to resolve it"]},

"5.1":{start:"Two small tables answer most questions here: the four-level document hierarchy, and the data roles. Write both out before studying anything else.",
covers:["Guidelines","Policies: acceptable use, information security, business continuity, disaster recovery, incident response, software development lifecycle, change management","Standards: password, access control, physical security, encryption","Procedures: change management, onboarding and offboarding, playbooks","External considerations: regulatory, legal, industry, local, regional, national and global","Monitoring and revision","Governance structures: boards, committees, government entities, centralized and decentralized","Roles: owners, controllers, processors, custodians and stewards"],
terms:["policy vs standard vs procedure vs guideline","data owner vs custodian vs steward vs controller vs processor","GDPR controller and processor responsibilities","security governance framework structure","centralized vs decentralized governance"],
traps:["Policy states intent, standard states the mandatory measurable detail, procedure is the steps, guideline is optional","The controller decides purpose and means; the processor acts on instructions","In scenarios the DBA or sysadmin is the custodian, never the owner"]},

"5.2":{start:"Drill the SLE, ARO and ALE arithmetic until it is automatic. It is the most reliably calculable question type on the whole exam, and free points if you practise it.",
covers:["Risk identification","Risk assessment types: ad hoc, recurring, one-time, continuous","Risk analysis: qualitative, quantitative, single loss expectancy, annualized loss expectancy, annualized rate of occurrence, probability, likelihood, exposure factor, impact","Risk register: key risk indicators, risk owners, risk threshold","Risk tolerance; risk appetite (expansionary, conservative, neutral)","Risk management strategies: transfer, accept (exemption and exception), avoid, mitigate","Risk reporting","Business impact analysis: recovery time objective, recovery point objective, mean time to repair, mean time between failures"],
terms:["SLE ARO ALE calculation practice problems","risk appetite vs risk tolerance vs risk threshold","inherent risk vs residual risk","business impact analysis RTO RPO MTTR MTBF","qualitative vs quantitative risk analysis","risk register key risk indicators"],
traps:["SLE = asset value x exposure factor; ALE = SLE x ARO. Once in 20 years is an ARO of 0.05","Exposure factor is a percentage, never a count or a dollar figure","Avoid means stop the activity; mitigate means reduce it","Residual risk is what the owner formally accepts"]},

"5.3":{start:"The agreement acronyms are pure memorization and appear reliably. Make a flashcard set for them first; it is the cheapest win in this domain.",
covers:["Vendor assessment: penetration testing, right-to-audit clause, evidence of internal audits, independent assessments, supply chain analysis","Vendor selection: due diligence, conflict of interest","Agreement types: SLA, MOA, MOU, MSA, work order and statement of work, NDA, BPA","Vendor monitoring; questionnaires; rules of engagement"],
terms:["SLA vs MOU vs MOA vs MSA vs SOW vs BPA","SOC 2 Type I vs Type II difference","right to audit clause vendor contract","fourth party risk supply chain analysis","vendor due diligence checklist security"],
traps:["MSA sets the framework once; the SOW or work order scopes each engagement","Right to audit must be negotiated before signing or you have no basis to ask","Due diligence is pre-contract; vendor monitoring is post-award","Type II covers effectiveness over a period; Type I is design at a point in time"]},

"5.4":{start:"Due care versus due diligence, and the controller versus processor split, cover most of this objective. Nail those two distinctions first.",
covers:["Compliance reporting: internal and external","Consequences of non-compliance: fines, sanctions, reputational damage, loss of licence, contractual impacts","Compliance monitoring: due diligence and due care, attestation and acknowledgement, internal and external, automation","Privacy: legal implications across jurisdictions, data subject, controller vs processor, ownership, data inventory and retention, right to be forgotten"],
terms:["due care vs due diligence definition","GDPR right to erasure exceptions retention","data controller vs processor breach notification duty","compliance attestation and acknowledgement","data inventory data mapping privacy"],
traps:["Due diligence is the research; due care is acting reasonably on it","Loss of licence to operate is something only a regulator can impose","On a processor breach the controller notifies the authority and the data subjects","The right to erasure yields to overriding legal retention duties"]},

"5.5":{start:"The three environment-knowledge terms and the team colours are quick wins. Then make sure passive versus active reconnaissance is airtight.",
covers:["Attestation","Internal: compliance, audit committee, self-assessments","External: regulatory, examinations, assessment, independent third-party audit","Penetration testing: physical, offensive, defensive, integrated","Environment knowledge: known, partially known, unknown","Reconnaissance: passive and active"],
terms:["black box white box gray box penetration testing","red team blue team purple team white team roles","passive vs active reconnaissance examples","internal audit vs external audit independence","penetration test rules of engagement scope"],
traps:["Unknown environment is black box; known is white box; partially known is gray box","Red is offensive, blue is defensive, purple integrates, white manages the exercise","Any packet sent to the target is active recon, including a zone transfer attempt","Independence is what gives an audit external credibility"]},

"5.6":{start:"Mostly common sense, but the enumerated lists still get tested. Learn the three anomalous-behaviour categories and the training topic list.",
covers:["Phishing: campaigns, recognizing an attempt, responding to reported suspicious messages","Anomalous behaviour recognition: risky, unexpected, unintentional","User guidance and training: policy and handbooks, situational awareness, insider threat, password management, removable media and cables, social engineering, operational security, hybrid and remote work practices","Reporting and monitoring: initial and recurring","Development and execution"],
terms:["security awareness program metrics click rate report rate","OPSEC operational security five step process","USB drop attack malicious USB cable","insider threat behavioural indicators training","security awareness training program lifecycle"],
traps:["Click rate measures susceptibility; report rate measures culture and early warning","Deliberately bypassing a control is risky behaviour even with good intent","Training must be initial AND recurring, never one-time","Malicious cables are a named vector, not just USB drives"]}

const CARDS = [
/* ---- PORTS ---- */
{d:"p",f:"20 / 21",b:"FTP",x:"File Transfer Protocol. 21 is control, 20 is data. Cleartext - replace with SFTP or FTPS."},
{d:"p",f:"22",b:"SSH / SCP / SFTP",x:"Secure Shell and everything tunnelled over it. The replacement for Telnet, rlogin, and FTP."},
{d:"p",f:"23",b:"Telnet",x:"Cleartext remote terminal. Credentials visible on the wire. Always replace with SSH (22)."},
{d:"p",f:"25",b:"SMTP",x:"Mail transfer between servers. Cleartext. Submission with STARTTLS is 587; implicit TLS is 465."},
{d:"p",f:"49",b:"TACACS+",x:"Cisco AAA protocol. Encrypts the entire payload and separates authentication from authorization - unlike RADIUS."},
{d:"p",f:"53",b:"DNS",x:"Name resolution. UDP for queries, TCP for zone transfers and large responses. A top exfiltration and C2 channel."},
{d:"p",f:"67 / 68",b:"DHCP",x:"67 server, 68 client. DHCP logs map an IP to a host at a point in time - essential in investigations."},
{d:"p",f:"69",b:"TFTP",x:"Trivial FTP. UDP, no authentication at all. Common for device configs and firmware; should not cross untrusted networks."},
{d:"p",f:"80",b:"HTTP",x:"Cleartext web. Replace with HTTPS (443)."},
{d:"p",f:"88",b:"Kerberos",x:"Windows domain authentication. Ticket-based. Attacks to know: Kerberoasting, golden and silver tickets, pass-the-ticket."},
{d:"p",f:"110",b:"POP3",x:"Mail retrieval, download-and-delete model. Cleartext. Secure version POP3S is 995."},
{d:"p",f:"123",b:"NTP",x:"Time synchronization. Matters for security because log correlation and Kerberos both depend on accurate time. Also abused for amplification DDoS."},
{d:"p",f:"135",b:"MS RPC / DCOM",x:"Windows RPC endpoint mapper. Should never be exposed to the internet; used for lateral movement."},
{d:"p",f:"137 / 138 / 139",b:"NetBIOS",x:"Legacy Windows name service, datagram, and session. Should be disabled or blocked at boundaries."},
{d:"p",f:"143",b:"IMAP",x:"Mail retrieval, server-side mailbox model. Cleartext. Secure version IMAPS is 993."},
{d:"p",f:"161",b:"SNMP",x:"Network device monitoring and polling. v1 and v2c send community strings in cleartext. Use v3 for authentication and privacy."},
{d:"p",f:"162",b:"SNMP trap",x:"Device-initiated unsolicited notification to the management station. Push, not poll."},
{d:"p",f:"389",b:"LDAP",x:"Directory queries, cleartext. Secure version LDAPS is 636. Global Catalog is 3268."},
{d:"p",f:"443",b:"HTTPS",x:"HTTP over TLS. Also the carrier for most C2 traffic, which is why TLS inspection and destination reputation matter."},
{d:"p",f:"445",b:"SMB / CIFS",x:"Windows file sharing. The classic ransomware and worm propagation path (EternalBlue, WannaCry). Never expose to the internet."},
{d:"p",f:"465",b:"SMTPS",x:"SMTP with implicit TLS. Distinguish from 587, which is submission using STARTTLS."},
{d:"p",f:"500",b:"ISAKMP / IKE",x:"IPSec key exchange negotiation. UDP. NAT traversal moves to UDP 4500."},
{d:"p",f:"514",b:"Syslog",x:"Centralized log collection, UDP, no encryption or delivery guarantee. Syslog over TLS is 6514."},
{d:"p",f:"587",b:"SMTP submission",x:"Mail submission from clients, usually with STARTTLS and authentication required. Preferred over 25 for clients."},
{d:"p",f:"636",b:"LDAPS",x:"LDAP over TLS. The secure replacement for 389."},
{d:"p",f:"989 / 990",b:"FTPS",x:"FTP over TLS, 990 control and 989 data. Distinct from SFTP, which is file transfer over SSH on 22."},
{d:"p",f:"993",b:"IMAPS",x:"IMAP over TLS."},
{d:"p",f:"995",b:"POP3S",x:"POP3 over TLS."},
{d:"p",f:"1433",b:"Microsoft SQL Server",x:"Database port. Exposure to the internet is a critical finding."},
{d:"p",f:"1521",b:"Oracle database",x:"Oracle listener port."},
{d:"p",f:"1645 / 1646",b:"RADIUS (legacy)",x:"Original RADIUS authentication and accounting ports. Superseded by 1812 and 1813."},
{d:"p",f:"1812 / 1813",b:"RADIUS",x:"1812 authentication, 1813 accounting. Used by 802.1X for wired and wireless network access control."},
{d:"p",f:"3268",b:"LDAP Global Catalog",x:"Active Directory forest-wide searches. Secure version is 3269."},
{d:"p",f:"3306",b:"MySQL",x:"Database port. Should be reachable only from application tiers, never the internet."},
{d:"p",f:"3389",b:"RDP",x:"Remote Desktop Protocol. The single most common ransomware initial-access vector when exposed. Put it behind a VPN or jump server."},
{d:"p",f:"5060 / 5061",b:"SIP",x:"VoIP session signalling. 5060 cleartext, 5061 over TLS."},
{d:"p",f:"5432",b:"PostgreSQL",x:"Database port."},
{d:"p",f:"6514",b:"Syslog over TLS",x:"Encrypted, reliable centralized logging. The secure replacement for UDP 514."},
{d:"p",f:"8080 / 8443",b:"HTTP / HTTPS alternate",x:"Common proxy and application server ports. Frequently forgotten in scans and firewall reviews."},
/* ---- ACRONYMS ---- */
{d:"a",f:"AAA",b:"Authentication, Authorization, Accounting",x:"Prove identity, decide permissions, record actions. RADIUS and TACACS+ implement it."},
{d:"a",f:"ACL",b:"Access Control List",x:"Rules permitting or denying traffic or object access by address, port, protocol, or identity."},
{d:"a",f:"AES",b:"Advanced Encryption Standard",x:"Symmetric block cipher, 128/192/256-bit keys. The default for data at rest and in transit."},
{d:"a",f:"ALE",b:"Annualized Loss Expectancy",x:"SLE x ARO. The expected yearly loss, and the ceiling on rational annual control spend."},
{d:"a",f:"APT",b:"Advanced Persistent Threat",x:"Well-funded actor maintaining long-term covert access, usually nation-state."},
{d:"a",f:"ARO",b:"Annualized Rate of Occurrence",x:"Expected occurrences per year. Once in 20 years = 0.05."},
{d:"a",f:"ASLR",b:"Address Space Layout Randomization",x:"Randomizes memory layout to make buffer overflow exploitation harder. A mitigation, not a fix."},
{d:"a",f:"ATT&CK",b:"Adversarial Tactics, Techniques, and Common Knowledge",x:"MITRE's framework of observed adversary behaviours. Used to map detection coverage."},
{d:"a",f:"BCP",b:"Business Continuity Plan",x:"Keeping essential business functions running. Broader than disaster recovery."},
{d:"a",f:"BEC",b:"Business Email Compromise",x:"Fraud using a genuine or convincingly spoofed executive mailbox. Passes SPF, DKIM and DMARC."},
{d:"a",f:"BIA",b:"Business Impact Analysis",x:"Identifies critical processes and produces RTO, RPO, MTTR and MTBF."},
{d:"a",f:"BPA",b:"Business Partners Agreement",x:"Governs the terms of a partnership between organizations."},
{d:"a",f:"BYOD",b:"Bring Your Own Device",x:"Employee-owned hardware. The organization manages only the corporate container."},
{d:"a",f:"CA",b:"Certificate Authority",x:"Issues and signs digital certificates; the root of trust in a PKI."},
{d:"a",f:"CASB",b:"Cloud Access Security Broker",x:"Policy enforcement point between users and cloud services. A component of SASE."},
{d:"a",f:"CER",b:"Crossover Error Rate",x:"Point where biometric FAR equals FRR. Lower is a better system."},
{d:"a",f:"CIA",b:"Confidentiality, Integrity, Availability",x:"The core security triad. Non-repudiation is a separate fourth concept."},
{d:"a",f:"COOP",b:"Continuity of Operations Plan",x:"Alternative ways to keep essential functions running, including manual workarounds."},
{d:"a",f:"COPE",b:"Corporate Owned, Personally Enabled",x:"Organization owns and fully controls the device; personal use permitted."},
{d:"a",f:"CRL",b:"Certificate Revocation List",x:"Published list of revoked certificate serial numbers. Grows large; OCSP is the real-time alternative."},
{d:"a",f:"CSR",b:"Certificate Signing Request",x:"Contains the public key and distinguished name, self-signed to prove key possession. The private key never leaves."},
{d:"a",f:"CSRF",b:"Cross-Site Request Forgery",x:"Tricks an authenticated browser into submitting an unintended action. Defeated by anti-CSRF tokens and SameSite."},
{d:"a",f:"CVE",b:"Common Vulnerabilities and Exposures",x:"The unique identifier for a specific vulnerability. Not a score."},
{d:"a",f:"CVSS",b:"Common Vulnerability Scoring System",x:"Severity score 0.0-10.0 in Base, Temporal and Environmental metric groups."},
{d:"a",f:"CWE",b:"Common Weakness Enumeration",x:"Classification of weakness TYPES (for example CWE-89 SQL injection). CVE is the instance."},
{d:"a",f:"CYOD",b:"Choose Your Own Device",x:"Employee selects from an approved list; the organization still owns the device."},
{d:"a",f:"DAC",b:"Discretionary Access Control",x:"The data owner sets permissions at their discretion. The opposite of MAC."},
{d:"a",f:"DDoS",b:"Distributed Denial of Service",x:"Availability attack from many sources. Variants: amplified, reflected, volumetric."},
{d:"a",f:"DEP",b:"Data Execution Prevention",x:"Marks memory regions non-executable to hinder overflow exploitation. A mitigation."},
{d:"a",f:"DKIM",b:"DomainKeys Identified Mail",x:"Cryptographic signature proving a message was not altered and came from the domain."},
{d:"a",f:"DLP",b:"Data Loss Prevention",x:"Inspects content for sensitive patterns and blocks, quarantines, or encrypts."},
{d:"a",f:"DMARC",b:"Domain-based Message Authentication, Reporting and Conformance",x:"Ties SPF and DKIM to the visible From domain, sets policy (none/quarantine/reject), and provides reporting."},
{d:"a",f:"DNSSEC",b:"Domain Name System Security Extensions",x:"Signs DNS records to provide origin authentication and integrity. Does not provide confidentiality."},
{d:"a",f:"DRP",b:"Disaster Recovery Plan",x:"Restoring IT systems and data. The technology subset of continuity planning."},
{d:"a",f:"EAP",b:"Extensible Authentication Protocol",x:"Authentication framework used by 802.1X. EAP-TLS uses certificates on both sides."},
{d:"a",f:"EDR",b:"Endpoint Detection and Response",x:"Agent providing deep host telemetry, detection, and response actions such as isolation."},
{d:"a",f:"ESP",b:"Encapsulating Security Payload",x:"IPSec component providing confidentiality, integrity and authentication. AH authenticates only and breaks NAT."},
{d:"a",f:"FAR",b:"False Acceptance Rate",x:"Rate at which a biometric system admits an impostor. The security failure."},
{d:"a",f:"FIM",b:"File Integrity Monitoring",x:"Baselines hashes of critical files and alerts on unauthorized change."},
{d:"a",f:"FRR",b:"False Rejection Rate",x:"Rate at which a biometric system rejects a legitimate user. The usability failure."},
{d:"a",f:"HIDS / HIPS",b:"Host Intrusion Detection / Prevention System",x:"Host-based behavioural inspection. HIPS can block activity riding on permitted ports."},
{d:"a",f:"HSM",b:"Hardware Security Module",x:"Tamper-resistant appliance for enterprise key generation and operations. Keys never leave in plaintext."},
{d:"a",f:"IaC",b:"Infrastructure as Code",x:"Declarative, version-controlled infrastructure. Enforces baselines; templates must themselves be scanned."},
{d:"a",f:"IAM",b:"Identity and Access Management",x:"Provisioning, authentication, authorization, federation, and attestation of identities."},
{d:"a",f:"ICS",b:"Industrial Control System",x:"Operational technology controlling physical processes. Usually unpatchable; protect by isolation."},
{d:"a",f:"IDS / IPS",b:"Intrusion Detection / Prevention System",x:"IDS alerts (often passive on a tap); IPS sits inline and can block."},
{d:"a",f:"IoC",b:"Indicator of Compromise",x:"Observable evidence of intrusion: hashes, domains, IPs, behaviours, missing logs."},
{d:"a",f:"ISAC",b:"Information Sharing and Analysis Center",x:"Sector-specific peer organization sharing threat intelligence among members."},
{d:"a",f:"KRI",b:"Key Risk Indicator",x:"Forward-looking metric with a threshold that triggers escalation to the risk owner."},
{d:"a",f:"MAC",b:"Mandatory Access Control",x:"System-enforced labels and clearances; the owner cannot override. Also Media Access Control address - read context."},
{d:"a",f:"MDM",b:"Mobile Device Management",x:"Central policy enforcement, app control, compliance checks, and remote or selective wipe."},
{d:"a",f:"MFA",b:"Multifactor Authentication",x:"Two or more DIFFERENT factor categories: know, have, are, somewhere you are."},
{d:"a",f:"MOU / MOA",b:"Memorandum of Understanding / Agreement",x:"MOU is a non-binding statement of intent; MOA is more formal and can be binding."},

{id:"pl1",type:"log",o:"4.9",title:"Authentication log analysis",
 brief:"Review the authentication events below and answer each question.",
 evidence:"2026-10-27 02:14:07  AUTH  FAIL  user=a.chen      src=203.0.113.41  reason=bad_password\n2026-10-27 02:14:09  AUTH  FAIL  user=b.okafor    src=203.0.113.41  reason=bad_password\n2026-10-27 02:14:11  AUTH  FAIL  user=c.duarte    src=203.0.113.41  reason=bad_password\n2026-10-27 02:14:13  AUTH  FAIL  user=d.silva     src=203.0.113.41  reason=bad_password\n...  [1,847 further FAIL events, each a distinct user, one attempt per user]\n2026-10-27 03:52:40  AUTH  OK    user=m.varga     src=203.0.113.41\n2026-10-27 03:52:58  AUTH  OK    user=m.varga     src=203.0.113.41  mfa=not_enrolled\n2026-10-27 03:54:12  PRIV  OK    user=m.varga     action=added_to_group  group=Domain Admins",
 fields:[
  {label:"Which attack does the failure pattern indicate?",o:"atk",c:0,why:"One attempt against each of 1,847 distinct accounts is password spraying. Brute force would be many attempts against a single account and would trip per-account lockout."},
  {label:"Why did account lockout not stop it?",o:"yn",c:1,why:"Lockout counts failures per account. One attempt per account never reaches the threshold, which is exactly why spraying is designed this way. Detection requires correlating failures ACROSS accounts."},
  {label:"Did the attacker achieve privilege escalation?",o:"yn",c:0,why:"The PRIV event shows m.varga being added to Domain Admins, which is vertical privilege escalation following the successful authentication."},
  {label:"What is the correct FIRST response action?",o:"first",c:3,why:"The credential is the active foothold. Resetting it and revoking live sessions stops the attacker using it, and must happen before cleanup. Note that m.varga had no MFA enrolled, which is the control gap to fix."}],
 debrief:"Spraying is invisible per account and obvious in aggregate. The log tells a complete story: spray, one success against an account without MFA, then immediate group escalation. Containment order matters - kill the credential before you start remediating hosts."},

 fields:[

  {label:"What does the final large outbound session most likely represent?",o:"atk",c:8,why:"A single session moving roughly 419 MB outbound at 02:17 is bulk data exfiltration - the beaconing implant being tasked to stage and ship data. The channel is HTTPS here rather than DNS, but the exfiltration pattern is the same."},

{o:"4.8",k:"FIRST",q:"Ransomware is actively encrypting files on a file server. What should you do FIRST?",a:["Isolate the server from the network while leaving it powered on","Power the server off to stop the encryption","Restore the affected shares from last night's backup","Notify the cyber insurance carrier"],c:0,e:"Isolation stops the spread and any command-and-control channel while preserving volatile memory, which may hold the encryption key and the malware configuration.",trap:"Powering off feels decisive and is the most commonly chosen wrong answer. It destroys RAM, and with it any chance of recovering keys or understanding the intrusion. Containment comes before eradication and recovery, and never at the cost of evidence you cannot regather."},
{o:"4.8",k:"FIRST",q:"You are acquiring evidence from a compromised server that is still running. What should you collect FIRST?",a:["The contents of RAM, including running processes and network connections","A full forensic disk image","Archived logs from the central SIEM","The most recent backup tape"],c:0,e:"Order of volatility dictates collecting the most perishable data first. RAM disappears the instant power is lost; disk, SIEM data and backups persist.",trap:"The disk image is the attractive answer because imaging feels like the definitive forensic act. It is, but it is also the step that usually requires shutting the machine down. Collect memory first, then disk."},
{o:"4.8",k:"BEST",q:"An incident is contained and the attacker's persistence has been removed. What BEST describes the next phase?",a:["Recovery: restore systems to production with heightened monitoring and validate they are clean","Eradication: remove the root cause of the intrusion","Lessons learned: hold the post-incident review","Preparation: update the incident response plan"],c:0,e:"The seven phases run preparation, detection, analysis, containment, eradication, recovery, lessons learned. With eradication done, recovery follows.",trap:"Lessons learned is tempting because the incident feels over. It comes last, after systems are back in production and validated. Restoring before confirming eradication is what causes reinfection."},
{o:"4.8",k:"FIRST",q:"An employee reports they clicked a link in a phishing email and entered their credentials. What should you do FIRST?",a:["Reset that user's password and revoke their active sessions and tokens","Run a full antivirus scan on the user's workstation","Block the phishing sender's domain at the mail gateway","Deliver additional security awareness training to the user"],c:0,e:"The credential is the exposed asset and may already be in use. Resetting it and invalidating live sessions closes the active window immediately.",trap:"Blocking the sender domain is the reflex, and it is useful, but it protects everyone except the person already compromised. Act on the known exposure before you harden against the next attempt."},
{o:"4.8",k:"FIRST",q:"Legal counsel informs you that litigation is anticipated involving a department. What must happen FIRST?",a:["Issue a legal hold suspending routine deletion for potentially relevant data","Archive the department's data and continue the normal retention schedule","Delete data that has passed its retention period to reduce scope","Encrypt the department's mailboxes"],c:0,e:"A legal hold overrides routine retention and deletion. It must be issued immediately, because continued deletion after litigation is anticipated is spoliation.",trap:"Continuing the retention schedule looks defensible because it is documented policy. Once a hold attaches, following your own retention policy becomes the violation. The hold stays until counsel releases it."},
{o:"4.3",k:"FIRST",q:"A scanner reports a critical vulnerability on a production server. What should you do FIRST?",a:["Confirm the finding is a true positive before scheduling remediation","Apply the vendor patch immediately during business hours","File an exception and apply compensating controls","Report the finding to the risk committee"],c:0,e:"Confirmation is a formal step in vulnerability analysis. Acting on false positives wastes remediation effort and erodes trust in the programme.",trap:"Patching immediately feels responsible but skips both confirmation and change management, and an unscheduled production change can cause the outage you were trying to prevent. Urgency changes the sequence only when exploitation is confirmed."},
{o:"4.3",k:"BEST",q:"A critical patch cannot be applied because it breaks a certified medical application. What is the BEST course of action?",a:["Document a time-bound exception with compensating controls, a named owner and a review date","Mark the finding as a false positive and close it","Remove the host from the scanning scope","Apply the patch and accept the clinical outage"],c:0,e:"An exception records the accepted risk formally, with controls, accountability and an expiry so it is revisited rather than forgotten.",trap:"Descoping the host from scanning is the dangerous answer because it makes the metrics look clean while the risk grows invisibly. Suppressing a finding is not the same as managing it."},
{o:"4.3",k:"FIRST",q:"Your team has just deployed a patch for a critical vulnerability across 400 servers. What should happen FIRST before closing the finding?",a:["Rescan the affected systems to verify the vulnerability is actually remediated","Update the risk register to show the risk as closed","Notify the asset owners that patching is complete","Archive the original scan report"],c:0,e:"Validation by rescanning, audit or verification is a required step. Deployment tools regularly report success on patches that did not fully apply or need a pending reboot.",trap:"Trusting the deployment tool's success report is the trap. It reports that the package was delivered, not that the vulnerability is gone."},
{o:"2.4",k:"FIRST",q:"Authentication logs show one failed login against each of 2,000 accounts from a single IP overnight. What should you do FIRST?",a:["Block the source address and check whether any of those accounts authenticated successfully","Enable account lockout after three failed attempts","Force a password reset for all 2,000 accounts","Submit the IP address to a threat intelligence feed"],c:0,e:"This is password spraying. Stopping the source and determining whether anything succeeded establishes whether you have an intrusion or only an attempt.",trap:"Tightening lockout is the instinctive fix and does almost nothing here: spraying is specifically designed to stay below per-account thresholds. Worse, aggressive lockout hands an attacker a denial-of-service tool."},
{o:"2.4",k:"MOST",q:"A host shows outbound beaconing in network telemetry, but its process list, netstat output and file system appear completely normal. What is MOST likely present?",a:["A rootkit subverting the operating system's reporting","A false positive in the network sensor","A scheduled task running a legitimate update check","A misconfigured DNS client"],c:0,e:"When off-host telemetry contradicts on-host tooling, the host is lying. A rootkit hooks the OS so its artifacts are hidden from local queries.",trap:"Dismissing it as a false positive is the comfortable answer and the one that lets an intrusion persist. When two sources disagree, trust the one the attacker does not control."},
{o:"4.6",k:"BEST",q:"Developers need to restart specific services on production servers. They currently hold domain administrator rights. What is the BEST change?",a:["Delegate the right to restart only those named services, granted just in time","Reduce the number of developers holding domain administrator rights","Require a longer, more complex password on the admin accounts","Move the developers into a separate administrative domain"],c:0,e:"Least privilege means the minimum right for the specific task on the specific resource, and just-in-time elevation removes standing privilege entirely.",trap:"Reducing headcount with admin rights is the plausible-sounding distractor. Fewer people holding excessive standing privilege is still excessive standing privilege - you have reduced the count, not the capability."},
{o:"4.6",k:"FIRST",q:"An employee is terminated at 10:00. What should happen FIRST from a security standpoint?",a:["Disable their accounts and revoke active sessions, tokens and VPN access","Collect their laptop and badge","Conduct the exit interview","Archive their mailbox according to retention policy"],c:0,e:"Logical access is the fastest-acting risk and can be exercised from anywhere. Disabling accounts and killing live sessions closes it immediately.",trap:"Collecting the laptop feels like the concrete first step, but the departing employee does not need their laptop to use credentials that still work from any device."},
{o:"3.4",k:"BEST",q:"A database has a 15-minute RPO. Which backup approach BEST satisfies it?",a:["Transaction log shipping or journaling at or below a 15-minute interval","Nightly full backups written to offsite tape","Weekly full plus daily differential backups","Hourly storage snapshots retained for a week"],c:0,e:"RPO caps tolerable data loss, so capture intervals must be no longer than the RPO itself.",trap:"Hourly snapshots look modern and frequent, and they are still four times too slow for a 15-minute RPO. Match the interval to the number in the requirement, not to what sounds frequent."},
{o:"3.4",k:"FIRST",q:"Ransomware has encrypted production data and you are preparing to restore. What should you verify FIRST?",a:["That the restore point predates the intrusion and the backups themselves are not encrypted or tampered with","That the restore will complete within the RTO","That the backup media has sufficient free space","That the backup software is on the latest version"],c:0,e:"Attackers commonly dwell for weeks and target backups before encrypting. Restoring a compromised backup reinstates the attacker's access.",trap:"Checking RTO feels like the right operational concern, but restoring quickly from a backup that already contains the implant simply restarts the incident on a faster clock."},
{o:"5.2",k:"BEST",q:"A risk has an ALE of 40,000 dollars. A control costing 55,000 dollars per year would reduce the ALE to 5,000 dollars. What is the BEST recommendation on financial grounds?",a:["Do not implement the control, since it costs more than the loss it prevents","Implement it, because it reduces the ALE by 87 percent","Implement it, because any risk reduction justifies the spend","Transfer the risk by purchasing insurance for 60,000 dollars"],c:0,e:"The control prevents 35,000 dollars of expected annual loss while costing 55,000, a net loss of 20,000.",trap:"The 87 percent reduction is the trap: a large percentage reduction on a small base still loses money. Always compare the saving in currency to the cost, and note that a regulatory or safety mandate can still override the arithmetic."},
{o:"5.2",k:"FIRST",q:"A key risk indicator crosses its defined threshold. What should happen FIRST?",a:["Notify the risk owner and initiate the predefined escalation and treatment response","Recalibrate the threshold so it reflects current conditions","Accept the risk and record the exception","Remove the indicator from the risk register"],c:0,e:"A threshold exists precisely so that crossing it triggers a predetermined response and escalation to the accountable owner.",trap:"Recalibrating the threshold is the organizationally comfortable answer and defeats the entire purpose of the indicator. You adjust a threshold during periodic review, never as a response to it firing."},
{o:"1.3",k:"FIRST",q:"A critical zero-day affecting internet-facing servers must be patched within hours, outside the normal change window. What should you do FIRST?",a:["Invoke the documented emergency change procedure","Apply the patch immediately and document it afterwards if time allows","Wait for the next scheduled change advisory board meeting","Obtain verbal approval from each affected system owner"],c:0,e:"Mature change management includes an emergency path with abbreviated approval and mandatory retroactive review and documentation.",trap:"Patching first and documenting later is the pragmatic-sounding answer that fails the exam and the audit. Urgency compresses the approval sequence; it never removes the requirement to follow a defined process."},
{o:"2.5",k:"BEST",q:"Ransomware spread from one workstation to every server in a flat network. Which control would have BEST limited the damage?",a:["Network segmentation separating user and server VLANs with enforced ACLs","More frequent antivirus signature updates","Longer and more complex user passwords","Increased log retention on all endpoints"],c:0,e:"Segmentation restricts lateral movement, so a compromise in one zone cannot reach another without passing an enforcement point.",trap:"Antivirus updates are the intuitive answer to a malware question, but signatures do not stop a novel payload and do nothing about lateral movement. The question asks what limits spread, which is a network architecture problem."},
{o:"4.5",k:"BEST",q:"Your domain still appears in spoofed emails despite published SPF and DKIM records. What is the BEST next step?",a:["Publish a DMARC record with a quarantine or reject policy and enable reporting","Add a second SPF record covering additional senders","Increase the DKIM key length from 1024 to 2048 bits","Add an external sender warning banner to all inbound mail"],c:0,e:"DMARC ties SPF and DKIM to the visible From domain through alignment, tells receivers what to do with failures, and provides reporting.",trap:"Adding a second SPF record is actively harmful: more than one SPF record for a domain is invalid and causes evaluation to fail entirely. Extend the existing record instead."},
{o:"4.5",k:"BEST",q:"Laptops must have identical web filtering whether in the office or at home. What is the BEST approach?",a:["Deploy an agent-based web filter on each endpoint","Backhaul all remote traffic to the on-premises proxy over full-tunnel VPN","Apply filtering rules on the office perimeter firewall","Configure proxy settings through a DHCP option"],c:0,e:"An agent enforces policy wherever the device is, with no dependency on being connected to corporate infrastructure.",trap:"Backhauling over full tunnel does work and is the near-miss answer. It fails on cost, latency and the fact that it stops protecting the moment the user disconnects the VPN. The agent travels with the device unconditionally."},
{o:"3.2",k:"BEST",q:"An internet-facing application is being exploited through SQL injection in a POST body. Which control BEST blocks this specific traffic today?",a:["A web application firewall inspecting HTTP request bodies","A stateful layer 4 firewall restricting source addresses","An intrusion detection system on a SPAN port","Network access control with posture assessment"],c:0,e:"A WAF understands HTTP semantics and can inspect and block request bodies against application attack patterns.",trap:"The IDS is the near-miss: it may well detect the attack, but on a SPAN port it is passive and can only alert. Read whether the question asks you to detect or to block."},
{o:"2.3",k:"BEST",q:"Which change BEST remediates the root cause of SQL injection in an application?",a:["Rewrite queries to use parameterized statements with bound variables","Deploy a web application firewall in blocking mode","Escape single quotes in all user input before building the query","Restrict the database account to read-only access"],c:0,e:"Parameterization separates code from data so input can never alter query structure. It eliminates the vulnerability rather than filtering its symptoms.",trap:"Escaping quotes is the classic wrong answer. Blacklist-style escaping is repeatedly defeated by encoding and alternate syntax, and it leaves the flawed pattern of building queries by string concatenation intact."},
{o:"4.4",k:"FIRST",q:"Analysts are dismissing 94 percent of alerts from one SIEM rule as benign while real detections are being missed. What should you do FIRST?",a:["Tune the rule's logic and add exclusions for verified benign patterns","Disable the rule to reduce analyst fatigue","Route the alerts to a low-priority queue that is reviewed weekly","Hire additional analysts to work the queue"],c:0,e:"Tuning preserves the detection capability while removing known-benign noise. Alert tuning is a named operational activity, not a workaround.",trap:"Disabling the rule removes the noise and creates a blind spot, which is worse than the noise. So does a queue nobody reads - it produces the same outcome while appearing to be a process."},
{o:"4.9",k:"BEST",q:"You have a malicious external IP and must identify which employee's machine contacted it last Tuesday. Which sequence is BEST?",a:["Firewall or NetFlow records, then DHCP or DNS logs, then OS security logs","OS security logs, then the asset inventory, then the vulnerability scan report","Packet capture alone, since it contains the full conversation","The SIEM dashboard alone, since it aggregates every source"],c:0,e:"Investigation moves from network to host to identity: find the internal IP and time, resolve that IP to a machine for that moment, then determine who was logged on.",trap:"Skipping the DHCP or DNS step is the most common error. In a dynamic environment an internal IP address identifies nothing on its own - last Tuesday's lease may belong to a different machine today."},
{o:"4.2",k:"BEST",q:"A batch of SSDs from a decommissioned database cluster will not be reused. What is the BEST sanitization method?",a:["Physical destruction with a serialized certificate of destruction","A single-pass overwrite of the addressable space","Degaussing the drives","Quick format and repartition"],c:0,e:"Wear levelling and over-provisioning make overwriting unreliable on flash, and degaussing has no effect on it. For media not being reused, destruction with documented certification is strongest.",trap:"Degaussing is the trap for anyone who memorized it as the strong answer. It works on magnetic media only and does literally nothing to an SSD."},
{o:"1.4",k:"BEST",q:"An internal certificate authority's root private key must be protected so it can never be exported in plaintext. What is BEST?",a:["Generate and store the key inside a hardware security module","Store the key in a TPM on the CA server","Export the key to a password-protected PKCS#12 file on an offline USB drive","Place a copy of the key in escrow with a third party"],c:0,e:"An HSM generates keys inside tamper-resistant hardware and performs operations without ever releasing the private key.",trap:"The TPM is the near-miss. A TPM binds keys to one machine and is not designed for CA-scale key operations or for the availability and backup model a CA root requires."},
{o:"4.1",k:"BEST",q:"A regulated workstation must run only five approved applications, including blocking signed-but-unapproved administrative tools. Which control is BEST?",a:["An application allow list permitting only the five approved executables","Antivirus with heuristic and behavioural scanning enabled","A block list of known malicious and dual-use tool hashes","A host-based firewall restricting outbound connections"],c:0,e:"An allow list denies by default, so unknown binaries and living-off-the-land tools cannot execute regardless of signature.",trap:"The block list is the trap because it sounds equivalent and is operationally easier. It can only stop what someone already enumerated, which by definition excludes anything new."},
{o:"2.2",k:"FIRST",q:"A controller receives an email from the CFO's genuine mailbox referencing a real acquisition and requesting an urgent wire to a new account. What should they do FIRST?",a:["Verify the request with the CFO through a known, separate channel before acting","Reply to the email asking the CFO to confirm the request","Forward the email to the security team and wait for analysis","Process the payment and flag it for review afterwards"],c:0,e:"Business email compromise originates from a genuine or convincingly spoofed mailbox, so technical controls pass. Out-of-band verification against a previously known contact is the control that works.",trap:"Replying to the email is the obvious-seeming verification and is useless: if the mailbox is compromised, the attacker receives and answers your reply. Verification must leave the compromised channel."},
{o:"3.3",k:"BEST",q:"A requirement states that a stored document's integrity must be verifiable, but the original must never be reproducible from the stored value. Which method is BEST?",a:["Hashing","Symmetric encryption","Tokenization","Reversible data masking"],c:0,e:"Hashing is one-way: it validates integrity with no possibility of recovering the input.",trap:"Encryption is the reflexive answer to anything about protecting data. Here it fails the requirement outright, because encryption is reversible by design and the requirement forbids recoverability."},
{o:"3.3",k:"BEST",q:"A retailer must remove card numbers from its order database to reduce PCI scope, while still being able to retrieve the real number for refunds. What is BEST?",a:["Tokenization with a separate token vault","Data masking showing only the last four digits","Full-disk encryption on the database server","Hashing the card numbers with a per-record salt"],c:0,e:"Tokenization replaces the value with a surrogate that has no mathematical relationship to the original; only the vault can map back, so the storing system leaves PCI scope.",trap:"Masking is the near-miss. It satisfies the display requirement but is one-way, so the refund lookup becomes impossible. Read what the system must still be able to do."},
{o:"5.3",k:"FIRST",q:"You are evaluating a payroll SaaS provider that will process employee data. What should you obtain FIRST?",a:["Evidence of independent assessment, such as a SOC 2 Type II report","A signed non-disclosure agreement","A service level agreement specifying uptime","A completed security questionnaire"],c:0,e:"Due diligence before contracting means obtaining evidence from an independent party rather than the vendor's own assertions.",trap:"The questionnaire is the tempting answer because it is standard practice. It is self-reported and unverified, making it the weakest assurance artifact available - useful as a supplement, not as your primary evidence."},
{o:"5.3",k:"BEST",q:"You want the contractual right to inspect a vendor's security controls directly. When must this be established?",a:["Before signing, as a right-to-audit clause in the contract","At any time, by sending a written request to the vendor","After an incident, as part of the response process","During annual vendor monitoring"],c:0,e:"Without a negotiated right-to-audit clause you have no contractual basis to demand access, and a vendor is under no obligation to grant it.",trap:"Believing you can request it after an incident is the costly misconception. The moment you most want to audit a vendor is the moment they are least willing, unless you already secured the right."},
{o:"4.6",k:"BEST",q:"A cloud policy must grant access only when the user is in Finance, the device is compliant, and the request comes from a corporate IP range. Which model is BEST?",a:["Attribute-based access control","Role-based access control","Mandatory access control","Discretionary access control"],c:0,e:"ABAC evaluates multiple attributes of subject, object and environment at request time, which is the only model that can express all three conditions together.",trap:"RBAC is the near-miss because the Finance department looks like a role. RBAC decides on role membership alone and cannot express device posture or network location."},
{o:"4.6",k:"BEST",q:"Which authentication deployment BEST protects administrators against credential phishing?",a:["FIDO2 hardware security keys with passwordless sign-in","Time-based one-time passwords from an authenticator app","SMS one-time codes sent to a registered phone","A password manager generating long unique passwords"],c:0,e:"FIDO2 binds the assertion cryptographically to the legitimate origin and never releases the private key, so a lookalike site obtains nothing reusable.",trap:"TOTP from an app is the strong-looking distractor and is still phishable: a real-time proxy page simply relays the code within its validity window. Phishing resistance requires origin binding, not merely a second factor."},
{o:"1.1",k:"BEST",q:"A medical device cannot be patched without voiding its certification. The team places it on an isolated VLAN with a restrictive ACL. How is this BEST classified?",a:["A compensating control","A corrective control","A preventive control only","A detective control"],c:0,e:"A compensating control substitutes for a primary control that cannot be applied, meeting the intent of the requirement by another route.",trap:"Corrective is the common wrong answer. Nothing here repairs the vulnerability - it still exists on the device. Isolation limits who can reach it, which is compensation, not correction."},
{o:"2.1",k:"MOST",q:"An intrusion used three previously unknown zero-days, maintained firmware-level persistence for 14 months, and exfiltrated nothing for the first year. Which actor is MOST likely?",a:["A nation-state actor","An organized crime group","A hacktivist collective","An unskilled attacker using purchased tooling"],c:0,e:"Multiple zero-days, firmware persistence and extreme patience indicate the highest levels of funding, capability and strategic intent.",trap:"Organized crime is the plausible alternative because they are well funded and sophisticated. The discriminator is the year of silence: criminals monetize quickly, because dwell time without revenue is pure cost to them."},
{o:"4.4",k:"BEST",q:"You must identify every internal host that contacted a known malicious IP over the past 30 days, without the storage cost of retaining full traffic content. Which data source is BEST?",a:["NetFlow records","Full packet capture","Antivirus quarantine logs","SNMP trap history"],c:0,e:"Flow data records source, destination, ports, bytes and time compactly enough to retain for months.",trap:"Packet capture is the trap for anyone reaching for the most detailed source. It contains more, but almost nobody retains 30 days of it at scale, and the question explicitly rules out the storage cost."},
{o:"5.5",k:"MOST",q:"A tester reviews WHOIS records, certificate transparency logs and employee LinkedIn profiles. Which activity is this MOST accurately called?",a:["Passive reconnaissance","Active reconnaissance","Vulnerability scanning","Social engineering"],c:0,e:"Passive reconnaissance uses third-party and public sources and leaves no trace in the target's own logs.",trap:"Candidates often mark anything involving employee information as social engineering. No person is being manipulated here - information is simply being collected from public sources."},
{o:"5.5",k:"MOST",q:"Which of these crosses the line from passive into active reconnaissance?",a:["Attempting a DNS zone transfer against the target's name servers","Reading the target's published SSL certificates in a transparency log","Searching job postings for the technologies the target uses","Reviewing the target's filings with a public regulator"],c:0,e:"Any packet sent to the target's own infrastructure is active, including a zone transfer attempt, regardless of whether it succeeds.",trap:"Zone transfers get classified as passive because they feel like merely reading DNS data. The test is not what you learn - it is whether you touched the target's systems to learn it."},
{o:"3.2",k:"BEST",q:"An inline IPS protecting a payment authorization system loses power. To preserve security rather than availability, how should it be configured?",a:["Fail-closed, blocking traffic until the device is restored","Fail-open, passing traffic uninspected","Fail-open with an alert sent to the SOC","Automatically switch to passive tap mode"],c:0,e:"Fail-closed denies traffic when inspection is unavailable, prioritizing security at the cost of availability.",trap:"Fail-open with alerting is the comfortable compromise and still passes uninspected traffic. The question states the priority explicitly - read which of security or availability the stem says matters more."},
{o:"4.7",k:"MOST",q:"A security team maintains 200 undocumented automation scripts written by staff who have left. Which consideration does this MOST represent?",a:["Technical debt and ongoing supportability","Workforce multiplier","Guard rails","Reaction time"],c:0,e:"Undocumented, unowned scripts holding production privilege are both operational fragility and a security exposure, since nobody can review what they do.",trap:"Workforce multiplier is the trap because the scripts genuinely are doing work the team no longer has to. The question asks about the problem this represents, not the benefit the automation originally delivered."},
{o:"5.1",k:"MOST",q:"A document states that passwords must be at least 14 characters and screened against a breach corpus. Which document type is this MOST likely?",a:["A standard","A policy","A procedure","A guideline"],c:0,e:"A standard specifies the mandatory, measurable detail that implements a policy's intent.",trap:"Policy is the default answer most candidates give. A policy states intent at a high level - access must be authenticated. The moment you see a specific measurable number, you are looking at a standard."},
{o:"5.4",k:"MOST",q:"A processor suffers a breach affecting personal data it handles for a controller. Who is responsible for notifying the supervisory authority?",a:["The controller, after being notified by the processor without undue delay","The processor, since the breach occurred in its environment","Both parties independently","Neither, if the processor restores the data within 72 hours"],c:0,e:"Accountability to the regulator and data subjects sits with the controller, because the controller determined the purpose and means of processing.",trap:"Assigning notification to the processor feels fair because the breach happened there. Responsibility can be delegated by contract; accountability to the regulator cannot be outsourced."},
{o:"3.1",k:"BEST",q:"A SCADA system cannot be patched during an 11-month production season and uses protocols with no authentication. What is the BEST architectural response?",a:["Isolate it on a segmented OT network reached only through a filtered or unidirectional gateway","Deploy endpoint detection and response agents to the controllers","Enrol the controllers in the corporate mobile device management platform","Enable automatic updates so patches apply as soon as they are released"],c:0,e:"Devices that cannot be patched and cannot run agents are protected by controlling what can reach them.",trap:"Deploying EDR is the instinctive security answer and is simply not possible on most PLCs and RTUs. When a stem tells you the constraints, the answer must respect them."},
{o:"4.1",k:"BEST",q:"Which improvement does WPA3-Personal provide that BEST addresses WPA2-PSK's core weakness?",a:["SAE replaces the four-way handshake, so a captured handshake cannot be cracked offline","It increases the maximum passphrase length","It replaces AES with a stronger proprietary cipher","It removes the need for a passphrase entirely"],c:0,e:"Simultaneous Authentication of Equals provides forward secrecy and resists offline dictionary attacks against a captured handshake, which was exactly WPA2-PSK's weakness.",trap:"Longer passphrases are the intuitive fix and only raise the cost of the offline attack rather than preventing it. SAE removes the possibility of the offline attack altogether."},
{o:"2.3",k:"MOST",q:"A publicly readable cloud storage bucket exposes customer invoices because its access policy was never changed after testing. Which vulnerability type is this MOST accurately?",a:["Misconfiguration","Zero-day","Supply chain vulnerability","Cryptographic vulnerability"],c:0,e:"The software works as designed; the deployment is insecure. Misconfiguration is consistently among the leading causes of cloud data exposure.",trap:"Candidates reach for zero-day whenever data is exposed and no patch exists. A zero-day is a flaw in the software with no available fix. Nothing is broken here except the settings."},
{o:"4.8",k:"BEST",q:"Malware is actively moving laterally through production. Leadership asks whether to isolate the segment now or keep observing to gather intelligence. What BEST supports isolating now?",a:["Continued spread increases impact faster than the additional intelligence is worth","Isolation preserves volatile memory better than continued observation","The incident response plan prohibits observing an active intruder","Isolation removes the need for a subsequent eradication phase"],c:0,e:"Containment timing balances damage limitation against intelligence gathering. Active lateral movement means the cost of waiting compounds with every minute.",trap:"The claim that isolation preserves memory is backwards and tempting because it sounds forensically sophisticated. Isolation can disrupt volatile evidence, which is why memory acquisition happens first where feasible."},
{o:"1.2",k:"BEST",q:"A contract system must prove to an arbitrator that one specific executive approved a purchase order. Which concept and mechanism are BEST?",a:["Non-repudiation using a digital signature created with the executive's private key","Integrity using a SHA-256 checksum stored with the record","Confidentiality using AES-256 encryption of the record","Availability using a clustered database with synchronous replication"],c:0,e:"Only the holder of the private key can produce a signature that validates against the matching public key, so the signer cannot credibly deny the action.",trap:"The checksum is the near-miss. A hash proves the document was not altered but says nothing about who approved it - anyone can compute a hash. Integrity is not the same as proof of origin."},
{o:"4.2",k:"FIRST",q:"An audit finds 60 laptops enrolled in the EDR console that do not appear in the asset inventory. What should you do FIRST?",a:["Identify the owner and business purpose of each device and bring them under management","Remove the EDR agents to reduce licence consumption","Wipe the devices remotely as unauthorized assets","Add them to the next quarterly vulnerability scan scope"],c:0,e:"You cannot protect, patch, classify or offboard what you do not know you own. Establishing ownership and purpose is the prerequisite for every other control.",trap:"Remotely wiping unknown devices is the aggressive answer that could destroy legitimate business data on machines someone simply failed to record. Identify before you act destructively."},
{o:"5.6",k:"BEST",q:"Which metric BEST indicates that a security awareness programme is improving organizational resilience?",a:["The rate at which employees report suspicious messages, relative to the click rate","The percentage of employees who completed training on time","The total number of simulated phishing emails sent","The average time employees spent viewing the training module"],c:0,e:"Reporting rate measures whether the organization gains early warning. A workforce that reports quickly shortens detection time even when someone clicks.",trap:"Completion rate is the metric most organizations actually report and it measures attendance, not behaviour. Everyone can complete training and still click."}
];
BANK.forEach(function(q,i){
  q.id = "q"+(i+1);
  q.C = Array.isArray(q.c) ? q.c.slice().sort() : [q.c];
  q.note = NOTES[q.t] || "";
});

/* readiness targets */
const GOAL = { raw:0.85, runs:2, domFloor:0.75, blindMax:0.03, spareMin:300, riskMax:2.0, simRaw:0.85 };
/* Exam-day shape: CompTIA opens with 3-5 performance-based tasks, then multiple
   choice, all inside 90 minutes. equiv is how many multiple-choice items one PBQ
   is modelled as being worth - CompTIA does not publish the real weighting. */
const SIMSPEC = { pbq:4, mc:76, minutes:90, equiv:4 };

/* ---------------------------------------------------------------- helpers */
const $ = function(s,r){ return (r||document).querySelector(s); };
const esc = function(s){ return String(s).replace(/[&<>"]/g, function(m){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]; }); };
const pct = function(n){ return Math.round(n*100); };
const LTR = ["A","B","C","D","E"];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function band(acc){
  if(acc>=0.85) return {k:"ok",  label:"Solid"};
  if(acc>=0.70) return {k:"med", label:"Adequate"};
  if(acc>=0.55) return {k:"high",label:"Shaky"};
  return {k:"crit", label:"Critical"};
}
function scaled(raw){
  const s = raw<=CUTRAW ? 100 + (raw/CUTRAW)*(PASS-100) : PASS + ((raw-CUTRAW)/(1-CUTRAW))*(900-PASS);
  return Math.round(Math.max(100, Math.min(900, s)));
}
function fmtClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h=Math.floor(sec/3600), m=Math.floor(sec%3600/60), s=sec%60;
  const pad=function(n){ return n<10?"0"+n:""+n; };
  return (h?h+":":"")+pad(m)+":"+pad(s);
}
const byDomain = {1:[],2:[],3:[],4:[],5:[]}, byObj = {};
BANK.forEach(function(q){ byDomain[q.d].push(q); (byObj[q.o]=byObj[q.o]||[]).push(q); });
const byId = {}; BANK.forEach(function(q){ byId[q.id]=q; });

function allocate(n){
  const raw = {}, out = {}; let used = 0;
  Object.keys(DOMAINS).forEach(function(d){
    raw[d] = n * DOMAINS[d].w / 100;
    out[d] = Math.min(byDomain[d].length, Math.floor(raw[d]));
    used += out[d];
  });
  const order = Object.keys(DOMAINS).sort(function(a,b){ return (raw[b]-Math.floor(raw[b])) - (raw[a]-Math.floor(raw[a])); });
  let i = 0;
  while(used < n && i < order.length*5){
    const d = order[i % order.length];
    if(out[d] < byDomain[d].length){ out[d]++; used++; }
    i++;
  }
  return out;
}
function sampleDomain(d, n){
  const pools = {}, codes = [];
  byDomain[d].forEach(function(q){ if(!pools[q.o]){ pools[q.o]=[]; codes.push(q.o); } pools[q.o].push(q); });
  codes.forEach(function(c){ pools[c] = shuffle(pools[c]); });
  const order = shuffle(codes), out = []; let pass = 0;
  while(out.length < n && pass < 80){
    for(let i=0;i<order.length && out.length<n;i++){ if(pools[order[i]].length) out.push(pools[order[i]].shift()); }
    pass++;
  }
  return out;
}
function buildExam(spec){
  let qs = [];
  if(spec.kind === "weighted"){
    const alloc = allocate(spec.count);
    Object.keys(alloc).forEach(function(d){ qs = qs.concat(sampleDomain(d, alloc[d])); });
    qs = shuffle(qs);
  } else if(spec.kind === "domain"){ qs = shuffle(byDomain[spec.domain]); }
  else if(spec.kind === "obj"){ qs = shuffle(byObj[spec.obj] || []); }
  else if(spec.kind === "ids"){ qs = spec.ids.map(function(id){ return byId[id]; }).filter(Boolean); }
  return qs.map(function(q){ return newItem(q); });
}
function newItem(q){ return { q:q, order:shuffle(q.a.map(function(_,i){ return i; })), picked:[], conf:null, flag:false, ms:0 }; }

/* ------------------------------------------------------- derived history */
function lifetime(){
  const objs = {}, doms = {};
  history.forEach(function(h){
    if(h.objs) Object.keys(h.objs).forEach(function(k){
      const v = h.objs[k]; if(!OBJ[k]) return;
      if(!objs[k]) objs[k] = {n:0,c:0};
      objs[k].n += v.n||0; objs[k].c += v.c||0;
    });
    if(h.domains) Object.keys(h.domains).forEach(function(k){
      const v = h.domains[k];
      if(!doms[k]) doms[k] = {n:0,c:0};
      doms[k].n += v.n||0; doms[k].c += v.c||0;
    });
  });
  return {objs:objs, doms:doms};
}
function missCounts(){
  const m = {};
  history.forEach(function(h){ (h.missed||[]).forEach(function(id){ if(byId[id]) m[id] = (m[id]||0)+1; }); });
  return m;
}

/* --------------------------------------------------------- readiness gate */
function readiness(){
  const fulls = history.filter(function(h){ return h.mode === "full" || h.mode === "sim"; });
  const strong = fulls.filter(function(h){
    const r = (typeof h.blend === "number") ? h.blend : (h.total ? h.correct/h.total : 0);
    return r >= GOAL.raw;
  });
  const last = fulls[0];
  const C = [];
  C.push({
    name:"Two full-length runs at "+pct(GOAL.raw)+"% or better",
    why:"One good run can be luck. Two shows the knowledge is stable. Full diagnostics and exam-day simulations both count; a simulation counts on its blended score.",
    have: strong.length >= GOAL.runs,
    known: true,
    val: strong.length + " of " + GOAL.runs
  });
  if(!last){
    ["No domain below "+pct(GOAL.domFloor)+"%","Blind spots at or under "+pct(GOAL.blindMax)+"%","Finished with 5+ minutes spare","Weakest objective under "+GOAL.riskMax.toFixed(1)+" pts at risk"].forEach(function(n){
      C.push({name:n, why:"Needs a completed full diagnostic.", have:false, known:false, val:"no data"});
    });
    C.push(pbqCriterion()); C.push(simCriterion());
    return {crit:C, met:C.filter(function(c){ return c.have; }).length, last:null};
  }
  let domMin = null, domName = "";
  Object.keys(last.domains||{}).forEach(function(d){
    const v = last.domains[d];
    if(v && v.n){ const a = v.c/v.n; if(domMin === null || a < domMin){ domMin = a; domName = d+".0"; } }
  });
  if(domMin === null) domMin = 1;
  C.push({
    name:"No domain below "+pct(GOAL.domFloor)+"% on your latest full run",
    why:"The live exam can overweight your weakest area. A low domain is a single point of failure.",
    have: domMin >= GOAL.domFloor, known:true,
    val: pct(domMin)+"%"+(domName ? " (domain "+domName+")" : "")
  });
  const tagged = last.cal ? (last.total - (last.cal.untagged||0)) : 0;
  const blindPct = tagged ? (last.cal.blind||0)/tagged : null;
  C.push({
    name:"Blind spots at or under "+pct(GOAL.blindMax)+"% of tagged items",
    why:"A confident wrong answer is a misconception. Under time pressure those are what break a run.",
    have: blindPct !== null && blindPct <= GOAL.blindMax, known: blindPct !== null,
    val: blindPct === null ? "not tagged" : pct(blindPct)+"% ("+(last.cal.blind||0)+" of "+tagged+")"
  });
  const spare = (last.timed && !last.paused) ? (90*60 - (last.elapsed||0)) : null;
  C.push({
    name:"Finished the timed 90 minutes with 5+ minutes spare",
    why:"Pacing is a separate skill from knowledge. Running out of clock costs points you could have earned. A run you paused does not count here.",
    have: spare !== null && spare >= GOAL.spareMin, known: spare !== null,
    val: spare === null ? (last.paused ? "paused run" : "untimed run") : fmtClock(Math.max(0,spare))+" spare"
  });
  const tr = (typeof last.topRisk === "number") ? last.topRisk : null;
  C.push({
    name:"Weakest objective under "+GOAL.riskMax.toFixed(1)+" points at risk",
    why:"No single objective should be able to sink the score on its own.",
    have: tr !== null && tr < GOAL.riskMax, known: tr !== null,
    val: tr === null ? "no data" : tr.toFixed(1)+" pts"
  });
  C.push(pbqCriterion()); C.push(simCriterion());
  return {crit:C, met:C.filter(function(c){ return c.have; }).length, last:last};
}
function simCriterion(){
  const st = practiceStats().sim;
  return {
    name:"One exam-day simulation at "+pct(GOAL.simRaw)+"% or better",
    why:"Performance tasks first, multiple choice after, one 90-minute clock across both. It is the only mode that shows whether the PBQs eat the time you need for everything else.",
    have: st.best !== null && st.best >= GOAL.simRaw,
    known: st.runs > 0,
    val: st.runs === 0 ? "none run" : st.runs+" run"+(st.runs>1?"s":"")+" "+DOT+" best "+pct(st.best)+"%"
  };
}
function pbqCriterion(){
  const st = practiceStats().pbq;
  const enough = st.attempted >= 6, good = st.avgBest !== null && st.avgBest >= 0.8;
  return {
    name:"Six or more PBQs attempted, averaging 80% or better",
    why:"The live exam opens with three to five performance-based questions and they carry more weight than a multiple-choice item. Nothing else on this gate measures them.",
    have: enough && good,
    known: st.attempted > 0,
    val: st.attempted === 0 ? "none attempted" : st.attempted+" of "+st.total+" "+DOT+" avg "+pct(st.avgBest)+"%"
  };
}

function sparkline(hist){
  const pts = hist.slice(0,14).reverse().map(function(a){ return a.scaled; });
  if(pts.length < 2) return "";
  const W=600, H=64, pad=6;
  const min=Math.min(400, Math.min.apply(null,pts)-40), max=Math.max(900, Math.max.apply(null,pts)+20);
  const x=function(i){ return pad + i*(W-pad*2)/(pts.length-1); };
  const y=function(v){ return H-pad - (v-min)/(max-min)*(H-pad*2); };
  const d = pts.map(function(v,i){ return (i?"L":"M")+x(i).toFixed(1)+","+y(v).toFixed(1); }).join(" ");
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" style="width:100%;height:64px;margin-bottom:14px" role="img" aria-label="Scaled score trend across recent attempts">'+
