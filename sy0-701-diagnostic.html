<title>SY0-701 Readiness Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface-2:#F5F7FA; --surface-3:#E3E8EF;
  --ink:#0E1B2E; --ink-2:#455468; --ink-3:#74849A;
  --line:#DBE1E9; --line-2:#B9C3D0;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FCE8EB; --accent-line:#E4A5AE;
  --crit:#C8102E; --crit-bg:#FBE4E8;
  --high:#B5560B; --high-bg:#FBEADA;
  --med:#856600; --med-bg:#F7EFD6;
  --ok:#146B4B; --ok-bg:#DCEEE6;
  --r:3px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#080F1A; --surface:#101A2A; --surface-2:#152238; --surface-3:#1E2E48;
    --ink:#E5ECF5; --ink-2:#A2B0C4; --ink-3:#7B8AA0;
    --line:#213149; --line-2:#334764;
    --accent:#F04255; --accent-ink:#FFFFFF; --accent-soft:#331119; --accent-line:#7A2635;
    --crit:#F5657A; --crit-bg:#341220;
    --high:#EE9A4E; --high-bg:#33220F;
    --med:#D8BB57; --med-bg:#2E2810;
    --ok:#48C296; --ok-bg:#0E3128;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#080F1A; --surface:#101A2A; --surface-2:#152238; --surface-3:#1E2E48;
  --ink:#E5ECF5; --ink-2:#A2B0C4; --ink-3:#7B8AA0;
  --line:#213149; --line-2:#334764;
  --accent:#F04255; --accent-ink:#FFFFFF; --accent-soft:#331119; --accent-line:#7A2635;
  --crit:#F5657A; --crit-bg:#341220;
  --high:#EE9A4E; --high-bg:#33220F;
  --med:#D8BB57; --med-bg:#2E2810;
  --ok:#48C296; --ok-bg:#0E3128;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink); margin:0;
  font-family:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  font-size:15.5px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{margin:0; text-wrap:balance; font-weight:600; letter-spacing:-.012em}
h1{font-size:2.05rem; line-height:1.14; letter-spacing:-.022em}
h2{font-size:1.12rem}
p{margin:0}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:2px}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-variant-numeric:tabular-nums}
.eyebrow{font-family:"IBM Plex Mono",monospace; font-size:.65rem; font-weight:500; letter-spacing:.15em; text-transform:uppercase; color:var(--ink-3)}
.wrap{max-width:1060px; margin:0 auto; padding:0 24px}
.spacer{margin-left:auto}

/* rail */
.rail{position:sticky; top:0; z-index:40; background:var(--surface); border-bottom:3px solid var(--accent)}
.rail-in{display:flex; align-items:center; gap:16px; height:54px}
.mark{display:flex; align-items:baseline; gap:10px; margin-right:auto; min-width:0}
.mark b{font-weight:700; font-size:.95rem; letter-spacing:-.015em; white-space:nowrap}
.mark span{font-family:"IBM Plex Mono",monospace; font-size:.64rem; color:var(--ink-3); letter-spacing:.11em; text-transform:uppercase}
.rail-stat{font-family:"IBM Plex Mono",monospace; font-size:.74rem; color:var(--ink-2); display:flex; gap:7px; white-space:nowrap}
.timer.warn{color:var(--high); font-weight:600}
.timer.crit{color:var(--crit); font-weight:600}
.ghost{border:1px solid var(--line-2); border-radius:var(--r); padding:5px 11px; font-size:.78rem; font-weight:500; color:var(--ink-2)}
.ghost:hover{border-color:var(--accent); color:var(--accent)}
.progline{height:2px; background:var(--surface-3)}
.progline i{display:block; height:100%; background:var(--accent); width:0; transition:width .25s ease}

/* console */
.hero{padding:54px 0 34px; display:grid; gap:16px; max-width:62ch}
.hero p{color:var(--ink-2); font-family:"Source Serif 4",Georgia,serif; font-size:1.04rem; line-height:1.62}
.section{padding:26px 0; border-top:1px solid var(--line)}
.sec-head{display:flex; align-items:baseline; gap:14px; margin-bottom:18px; flex-wrap:wrap}
.sec-head p{color:var(--ink-3); font-size:.83rem}

.bp{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.bp-row{display:grid; grid-template-columns:44px minmax(0,1fr) 130px 88px 78px; gap:14px; align-items:center; background:var(--surface); padding:11px 14px}
.bp-row.head{background:var(--surface-2); padding:7px 14px}
.bp-row.head span{font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.bp-code{font-family:"IBM Plex Mono",monospace; font-size:.78rem; color:var(--ink); font-weight:600}
.bp-name{font-size:.88rem; font-weight:500; min-width:0}
.bp-name em{display:block; font-style:normal; font-size:.69rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; margin-top:2px}
.wbar{display:flex; align-items:center; gap:8px}
.wbar i{flex:1; height:7px; background:var(--surface-3); position:relative}
.wbar i b{position:absolute; inset:0 auto 0 0; background:var(--ink-2)}
.wbar span{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-2); width:30px; text-align:right}
.bp-count{font-family:"IBM Plex Mono",monospace; font-size:.73rem; color:var(--ink-3); text-align:right}
.pill{display:inline-block; font-family:"IBM Plex Mono",monospace; font-size:.65rem; font-weight:600; letter-spacing:.05em; padding:3px 7px; border-radius:2px; text-transform:uppercase; white-space:nowrap}
.pill.crit{background:var(--crit-bg); color:var(--crit)}
.pill.high{background:var(--high-bg); color:var(--high)}
.pill.med{background:var(--med-bg); color:var(--med)}
.pill.ok{background:var(--ok-bg); color:var(--ok)}
.pill.none{background:var(--surface-3); color:var(--ink-3)}

.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(214px,1fr)); gap:13px}
.mode{text-align:left; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--line-2); border-radius:var(--r); padding:15px; display:grid; gap:6px; align-content:start; transition:border-color .15s}
.mode:hover{border-color:var(--line-2); border-top-color:var(--accent)}
.mode:disabled{opacity:.45; cursor:not-allowed}
.mode .k{font-family:"IBM Plex Mono",monospace; font-size:.63rem; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-3)}
.mode .t{font-size:1rem; font-weight:600}
.mode .d{font-size:.8rem; color:var(--ink-2); line-height:1.45}
.mode.primary{border-top-color:var(--accent)}
.mode.primary .k{color:var(--accent); font-weight:600}

.opts{display:flex; gap:22px; flex-wrap:wrap; margin-top:18px}
.opt{display:flex; gap:9px; align-items:flex-start; cursor:pointer; max-width:36ch}
.opt input{margin:3px 0 0; accent-color:var(--accent); width:15px; height:15px; flex:none}
.opt span{font-size:.8rem; color:var(--ink-2); line-height:1.45}
.opt span b{display:block; color:var(--ink); font-weight:600; font-size:.85rem}

.hist{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.hist-row{display:grid; grid-template-columns:1fr auto auto auto 28px; gap:14px; align-items:center; background:var(--surface); padding:10px 14px; font-size:.83rem}
.hist-row.paused .lbl-x{font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3); letter-spacing:.06em; text-transform:uppercase; margin-left:8px}
.xbtn{width:24px; height:24px; border:1px solid transparent; border-radius:2px; color:var(--ink-3); font-size:.9rem; line-height:1; display:grid; place-items:center}
.xbtn:hover{border-color:var(--crit); color:var(--crit); background:var(--crit-bg)}
.hist-tools{display:flex; gap:10px; align-items:center; margin-top:12px}
.linkish{font-size:.76rem; color:var(--ink-3); text-decoration:underline; text-underline-offset:2px}
.linkish:hover{color:var(--crit)}
.hist-row .when{font-family:"IBM Plex Mono",monospace; font-size:.73rem; color:var(--ink-3)}
.empty{border:1px dashed var(--line-2); border-radius:var(--r); padding:22px; color:var(--ink-3); font-size:.84rem; text-align:center}

/* exam */
.exam{padding:32px 0 90px; max-width:70ch; margin:0 auto}
.qmeta{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px}
.ocode{font-family:"IBM Plex Mono",monospace; font-size:.7rem; font-weight:600; color:var(--ink); background:var(--surface-3); padding:3px 7px; border-radius:2px; letter-spacing:.04em}
.otitle{font-size:.75rem; color:var(--ink-3)}
.dtag{font-size:.73rem; color:var(--ink-3); margin-left:auto; font-family:"IBM Plex Mono",monospace}
.stem{font-family:"Source Serif 4",Georgia,serif; font-size:1.16rem; line-height:1.55}
.multi-note{font-size:.73rem; color:var(--high); font-family:"IBM Plex Mono",monospace; margin-top:8px; font-weight:600; letter-spacing:.06em}
.choices{display:grid; gap:8px; margin:20px 0 22px}
.choice{display:grid; grid-template-columns:26px 1fr; gap:11px; align-items:start; text-align:left; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:13px 15px; transition:border-color .12s; font-family:"Source Serif 4",Georgia,serif; font-size:.98rem; line-height:1.45}
.choice:hover{border-color:var(--line-2)}
.choice .ltr{font-family:"IBM Plex Mono",monospace; font-size:.73rem; font-weight:600; color:var(--ink-3); border:1px solid var(--line-2); border-radius:2px; width:22px; height:22px; display:grid; place-items:center; margin-top:1px}
.choice[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 3px 0 0 var(--accent)}
.choice[aria-pressed="true"] .ltr{background:var(--accent); color:var(--accent-ink); border-color:var(--accent)}
.conf{border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:13px 0; margin-bottom:20px; display:grid; gap:9px}
.conf .lbl{font-family:"IBM Plex Mono",monospace; font-size:.64rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.cbtns{display:flex; gap:8px; flex-wrap:wrap}
.cbtn{border:1px solid var(--line-2); border-radius:var(--r); padding:6px 13px; font-size:.79rem; color:var(--ink-2); display:grid; gap:1px; text-align:left}
.cbtn u{text-decoration:none; font-family:"IBM Plex Mono",monospace; font-size:.62rem; color:var(--ink-3); letter-spacing:.04em}
.cbtn[aria-pressed="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--accent); font-weight:600}
.cbtn[aria-pressed="true"] u{color:var(--accent); opacity:.8}
.navrow{display:flex; gap:9px; align-items:center; flex-wrap:wrap}
.btn{background:var(--accent); color:var(--accent-ink); border-radius:var(--r); padding:9px 20px; font-size:.87rem; font-weight:600}
.btn:hover{filter:brightness(1.1)}
.btn:disabled{opacity:.4; cursor:not-allowed}
.btn.sec{background:none; color:var(--ink-2); border:1px solid var(--line-2)}
.btn.sec:hover{border-color:var(--accent); color:var(--accent); filter:none}
.flagbtn[aria-pressed="true"]{border-color:var(--high); color:var(--high); background:var(--high-bg); font-weight:600}
.hint{font-size:.75rem; color:var(--ink-3); margin-top:14px; line-height:1.5}

/* navigator */
.nav-toggle{margin-top:26px; border-top:1px solid var(--line); padding-top:16px}
.navgrid{display:flex; flex-wrap:wrap; gap:5px; margin-top:12px}
.nq{width:30px; height:30px; border:1px solid var(--line-2); border-radius:2px; font-family:"IBM Plex Mono",monospace; font-size:.7rem; color:var(--ink-3); background:var(--surface); position:relative}
.nq.done{background:var(--surface-3); color:var(--ink); border-color:var(--surface-3)}
.nq.flag{border-color:var(--high); border-width:2px; color:var(--high); font-weight:600}
.nq.here{outline:2px solid var(--accent); outline-offset:1px; color:var(--accent); font-weight:700}
.legend{display:flex; gap:16px; flex-wrap:wrap; font-size:.72rem; color:var(--ink-3); margin-top:12px; font-family:"IBM Plex Mono",monospace}
.legend i{display:inline-block; width:11px; height:11px; border:1px solid var(--line-2); border-radius:2px; margin-right:5px; vertical-align:-1px}
.legend i.done{background:var(--surface-3); border-color:var(--surface-3)}
.legend i.flag{border-color:var(--high); border-width:2px}

/* submit gate */
.gate{max-width:62ch; margin:0 auto; padding:44px 0 80px; display:grid; gap:20px}
.gate .tally{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.gate .tally div{background:var(--surface); padding:12px 15px; display:flex; align-items:center; gap:12px; font-size:.88rem}
.gate .tally b{font-family:"IBM Plex Mono",monospace; font-size:1.1rem; width:44px; font-weight:600}
.gate .tally span.lab{color:var(--ink-2)}
.gate .tally .warnrow b{color:var(--high)}

/* report */
.report{padding:32px 0 80px}
.score-block{display:grid; grid-template-columns:auto minmax(0,1fr); gap:34px; align-items:center; background:var(--surface); border:1px solid var(--line); border-top:3px solid var(--accent); border-radius:var(--r); padding:26px 28px; margin-bottom:24px}
.dial{width:186px; flex:none}
.verdict{display:grid; gap:10px}
.verdict h2{font-size:1.5rem; letter-spacing:-.02em}
.verdict p{font-size:.89rem; color:var(--ink-2); line-height:1.55; max-width:48ch}
.kpis{display:flex; gap:26px; flex-wrap:wrap; margin-top:6px}
.kpi{display:grid; gap:2px}
.kpi b{font-family:"IBM Plex Mono",monospace; font-size:1.16rem; font-weight:600; letter-spacing:-.02em}
.kpi span{font-family:"IBM Plex Mono",monospace; font-size:.62rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}

.dtable{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.dt-row{display:grid; grid-template-columns:40px minmax(0,1fr) 56px 146px 84px 112px; gap:12px; align-items:center; background:var(--surface); padding:12px 14px}
.dt-row.head{background:var(--surface-2); padding:7px 14px}
.dt-row.head span{font-family:"IBM Plex Mono",monospace; font-size:.6rem; letter-spacing:.11em; text-transform:uppercase; color:var(--ink-3)}
.dt-row.head .r{text-align:right}
.acc{display:flex; align-items:center; gap:9px}
.acc i{flex:1; height:9px; background:var(--surface-3); position:relative; overflow:hidden}
.acc i b{position:absolute; inset:0 auto 0 0}
.acc i u{position:absolute; top:-2px; bottom:-2px; width:1px; background:var(--ink-2); opacity:.55}
.num{font-family:"IBM Plex Mono",monospace; font-size:.82rem; text-align:right; font-variant-numeric:tabular-nums}
.num.muted{color:var(--ink-3); font-size:.76rem}

.queue{display:grid; gap:9px}
.qitem{display:grid; grid-template-columns:32px minmax(0,1fr) auto; gap:14px; align-items:start; background:var(--surface); border:1px solid var(--line); border-left:3px solid var(--line-2); border-radius:var(--r); padding:14px 16px}
.qitem.p1{border-left-color:var(--crit)}
.qitem.p2{border-left-color:var(--high)}
.qitem.p3{border-left-color:var(--med)}
.qrank{font-family:"IBM Plex Mono",monospace; font-size:1.05rem; font-weight:600; color:var(--ink-3)}
.qbody{display:grid; gap:5px; min-width:0}
.qbody .h{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap}
.qbody .h b{font-size:.93rem; font-weight:600}
.qbody .why{font-size:.82rem; color:var(--ink-2); line-height:1.5}
.qbody .topics{font-size:.74rem; color:var(--ink-3); font-family:"IBM Plex Mono",monospace; line-height:1.6}
.qmetric{text-align:right; display:grid; gap:2px}
.qmetric b{font-family:"IBM Plex Mono",monospace; font-size:1.02rem; font-weight:600}
.qmetric span{font-family:"IBM Plex Mono",monospace; font-size:.59rem; letter-spacing:.09em; text-transform:uppercase; color:var(--ink-3)}

.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:24px}
.states{display:grid; gap:1px; background:var(--line); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.st{background:var(--surface); padding:12px 14px; display:grid; grid-template-columns:44px 1fr; gap:12px; align-items:center}
.st b{font-family:"IBM Plex Mono",monospace; font-size:1.25rem; font-weight:600; text-align:right}
.st .tx{display:grid; gap:1px}
.st .n{font-size:.85rem; font-weight:600}
.st .s{font-size:.74rem; color:var(--ink-3); line-height:1.4}
.st.bad{background:var(--crit-bg)} .st.bad b,.st.bad .n{color:var(--crit)}
.st.warn{background:var(--high-bg)} .st.warn b,.st.warn .n{color:var(--high)}
.st.good b,.st.good .n{color:var(--ok)}
.dbars{display:grid; gap:12px}
.dbar{display:grid; grid-template-columns:104px minmax(0,1fr) 54px; gap:12px; align-items:center}
.dbar .l{font-size:.8rem; color:var(--ink-2)}
.dbar i{height:10px; background:var(--surface-3); position:relative; overflow:hidden}
.dbar i b{position:absolute; inset:0 auto 0 0}

/* study notes */
.nblock{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden; margin-bottom:10px}
.nhead{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; padding:11px 15px; background:var(--surface-2); border-bottom:1px solid var(--line)}
.nhead b{font-size:.9rem; font-weight:600}
.nhead .sc{font-family:"IBM Plex Mono",monospace; font-size:.72rem; color:var(--ink-3); margin-left:auto}
.ncard{padding:13px 15px; border-bottom:1px solid var(--line); display:grid; gap:6px}
.ncard:last-child{border-bottom:none}
.ncard .t{display:flex; gap:9px; align-items:baseline; flex-wrap:wrap}
.ncard .t b{font-size:.86rem; font-weight:600}
.ncard .body{font-size:.87rem; line-height:1.62; color:var(--ink-2); font-family:"Source Serif 4",Georgia,serif}
.tagx{font-family:"IBM Plex Mono",monospace; font-size:.6rem; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:2px 6px; border-radius:2px}
.tagx.miss{background:var(--crit-bg); color:var(--crit)}
.tagx.luck{background:var(--high-bg); color:var(--high)}
.tagx.blind{background:var(--crit-bg); color:var(--crit)}

/* review */
.rev{display:grid; gap:9px}
.rq{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); overflow:hidden}
.rq summary{display:grid; grid-template-columns:24px 1fr auto; gap:12px; align-items:center; padding:12px 15px; cursor:pointer; list-style:none}
.rq summary::-webkit-details-marker{display:none}
.rq summary:hover{background:var(--surface-2)}
.rq .mk{font-family:"IBM Plex Mono",monospace; font-size:.8rem; font-weight:700; width:22px; height:22px; display:grid; place-items:center; border-radius:2px}
.rq.wrong .mk{background:var(--crit-bg); color:var(--crit)}
.rq.right .mk{background:var(--ok-bg); color:var(--ok)}
.rq.luck .mk{background:var(--high-bg); color:var(--high)}
.rq .sq{font-size:.86rem; line-height:1.4; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical}
.rq-body{padding:0 15px 16px 51px; border-top:1px solid var(--line); display:grid; gap:12px}
.rq-body .full{font-family:"Source Serif 4",Georgia,serif; font-size:.96rem; line-height:1.5; padding-top:14px}
.ans{display:grid; gap:5px}
.ans div{font-size:.86rem; padding:7px 11px; border-radius:2px; border:1px solid transparent; font-family:"Source Serif 4",Georgia,serif}
.ans .correct{background:var(--ok-bg); color:var(--ok); border-color:var(--ok)}
.ans .chosen{background:var(--crit-bg); color:var(--crit); border-color:var(--crit)}
.ans .plain{color:var(--ink-3)}
.expl{font-size:.86rem; line-height:1.6; color:var(--ink-2); background:var(--surface-2); border-left:2px solid var(--line-2); padding:11px 14px}
.expl b{color:var(--ink); font-weight:600}
.notebox{font-size:.87rem; line-height:1.62; background:var(--accent-soft); border-left:3px solid var(--accent); padding:12px 15px; font-family:"Source Serif 4",Georgia,serif; color:var(--ink)}
.notebox .lbl{display:block; font-family:"IBM Plex Mono",monospace; font-size:.61rem; letter-spacing:.13em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:5px}
.filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px}
.fbtn{border:1px solid var(--line-2); border-radius:var(--r); padding:4px 11px; font-size:.76rem; color:var(--ink-2); font-family:"IBM Plex Mono",monospace}
.fbtn[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}

{d:1,o:"1.1",t:"Compensating controls",df:3,q:"An FDA-regulated infusion pump runs an unsupported OS and cannot be patched or re-imaged without voiding certification. The security team places it on an isolated VLAN with an ACL permitting only the clinical server. This is BEST described as a:",a:["Compensating control","Corrective control","Directive control","Detective control"],c:0,e:"A compensating control is deployed when the primary control (patching) cannot be applied, providing an alternative that meets the intent of the requirement. Isolation does not fix the vulnerability, so it is not corrective."},
{d:1,o:"1.1",t:"Detective controls",df:1,q:"A facilities manager reviews the visitor sign-in sheet every Friday to identify anyone who entered without an escort. Which control type is this?",a:["Detective","Preventive","Deterrent","Compensating"],c:0,e:"Reviewing records after the fact to discover events that already happened is detective. The sign-in requirement itself would be directive; the escort requirement would be preventive."},
{d:1,o:"1.1",t:"Directive controls",df:2,q:"An acceptable use policy states that all removable media must be encrypted before leaving company premises. No technology enforces this yet. Which control category and type apply?",a:["Managerial category, directive type","Technical category, preventive type","Operational category, detective type","Physical category, deterrent type"],c:0,e:"Policies are managerial (administrative) controls, and a policy that instructs people what they must do is directive. It becomes technical/preventive only once DLP or port control actually enforces it."},
{d:1,o:"1.1",t:"Corrective controls",df:1,q:"Following a ransomware event, the response team restores encrypted file shares from immutable backups and rebuilds two domain controllers. These actions represent which control type?",a:["Corrective","Preventive","Detective","Deterrent"],c:0,e:"Corrective controls act after an incident to restore normal operations and limit damage. The backups themselves are preventive/corrective infrastructure; the act of restoring is corrective."},
{d:1,o:"1.2",t:"Non-repudiation",df:2,q:"A contract management system must be able to prove to an arbitrator that a specific executive, and no one else, approved a purchase order. Which concept and technology satisfy this?",a:["Non-repudiation, using a digital signature created with the executive's private key","Confidentiality, using AES-256 encryption of the purchase order","Integrity, using an MD5 checksum stored alongside the record","Availability, using a clustered database with synchronous replication"],c:0,e:"Non-repudiation prevents the signer from credibly denying the action. Only the holder of the private key can produce a signature that validates against the matching public key. Hashing alone proves integrity but not origin."},
{d:1,o:"1.2",t:"Zero Trust control plane",df:3,q:"In a Zero Trust architecture, which component evaluates the subject, device posture, and context, then renders the access decision?",a:["Policy engine","Policy enforcement point","Policy administrator","Implicit trust zone"],c:0,e:"The policy engine makes the grant/deny/revoke decision. The policy administrator communicates that decision and establishes/tears down the session, and the policy enforcement point is the data-plane component that actually allows or blocks the traffic."},
{d:1,o:"1.2",t:"Control vs data plane",df:3,q:"Which of the following Zero Trust elements resides in the DATA plane rather than the control plane?",a:["Policy enforcement point","Adaptive identity","Threat scope reduction","Policy-driven access control"],c:0,e:"The data plane contains the subject/system, the policy enforcement point, and the implicit trust zone. Adaptive identity, threat scope reduction, policy-driven access control, and the policy administrator/engine live in the control plane."},
{d:1,o:"1.2",t:"AAA",df:2,q:"An auditor needs to determine which commands a network engineer ran on a core switch and when. Which element of AAA provides this?",a:["Accounting","Authentication","Authorization","Attestation"],c:0,e:"Accounting records what an authenticated, authorized subject actually did. Authentication proves identity, authorization determines permitted actions, and attestation is a claim about system or identity state."},
{d:1,o:"1.2",t:"Deception technology",df:2,q:"A security team seeds a production customer database with fabricated records containing uniquely traceable email addresses. Any use of those addresses generates an alert. What is this called?",a:["Honeytoken","Honeynet","Honeypot","Honeyfile"],c:0,e:"A honeytoken is fabricated data (fake credentials, records, or addresses) whose only legitimate use is zero, so any observed use signals compromise. A honeyfile is a specific bait file; a honeypot is a decoy system; a honeynet is a decoy network."},
{d:1,o:"1.2",t:"Gap analysis",df:1,q:"Before pursuing certification, an organization documents its current control set, compares it against the target framework's required controls, and lists every deficiency. This activity is a:",a:["Gap analysis","Business impact analysis","Quantitative risk assessment","Penetration test"],c:0,e:"A gap analysis compares the current state to a desired state and enumerates the differences. A BIA identifies critical processes and recovery objectives; a risk assessment measures likelihood and impact."},
{d:1,o:"1.3",t:"Backout plan",df:1,q:"A change request to upgrade the core firewall firmware is rejected by the change advisory board because one required element is missing. The engineer documented the schedule, the test results, and the approvals. What is MOST likely missing?",a:["A backout plan","A maintenance window","A stakeholder list","An asset inventory"],c:0,e:"A backout (rollback) plan defines how to return to the prior known-good state if the change fails. It is a standard mandatory element of a change request alongside impact analysis and test results."},
{d:1,o:"1.3",t:"Dependencies & downtime",df:3,q:"A change to rotate the service account password for a middleware component is proposed. Which technical implication requires the MOST analysis before approval?",a:["Dependencies, because legacy apps may use the same credential","Allow lists, because the middleware IP is unchanged","Version control, because the password is not stored in the repository","Restricted activities, because password changes are routine"],c:0,e:"Hardcoded or shared credentials in downstream legacy applications are the classic cause of outages during credential rotation. Mapping dependencies is the critical pre-change analysis; the IP and repository considerations are not affected."},
{d:1,o:"1.3",t:"Ownership & approval",df:2,q:"Who is responsible for sponsoring a change request, confirming it aligns with business need, and accepting the residual risk of the change?",a:["The change owner","The change advisory board secretary","The system custodian performing the work","The end users in the affected department"],c:0,e:"The owner sponsors the change and accepts the risk. The CAB reviews and approves, the custodian implements it, and stakeholders are consulted and notified."},
{d:1,o:"1.3",t:"Change documentation",df:2,q:"Immediately after a successful change adds a new DMZ subnet, which documentation task is MOST important to complete?",a:["Update the network diagrams and firewall rule documentation","Schedule the next maintenance window early","Notify the vendor of the new subnet range","Archive the original change request form"],c:0,e:"Diagrams and rule documentation must reflect reality or the next incident response and the next change will be based on false assumptions. Version control preserves the history of what changed and when."},
{d:1,o:"1.4",t:"TPM",df:2,q:"A fleet of laptops must use full-disk encryption where the volume key is sealed to the machine's boot state, so a stolen drive cannot be read in another chassis. Which component provides this?",a:["Trusted Platform Module","Hardware security module","Key management service","Secure enclave for biometric templates"],c:0,e:"A TPM is a chip on the motherboard that seals keys to platform measurements, binding the encrypted volume to that specific machine. An HSM is a dedicated, often network-attached appliance for high-volume key operations."},
{d:1,o:"1.4",t:"HSM",df:2,q:"An internal certificate authority must protect its root private key so that it is generated inside tamper-resistant hardware and can never be exported in plaintext. Which solution is MOST appropriate?",a:["Hardware security module","Trusted Platform Module","Key escrow with a third party","A password-protected PKCS#12 file on an offline USB drive"],c:0,e:"An HSM generates and stores keys in tamper-evident, FIPS-validated hardware and performs cryptographic operations without releasing the private key. A TPM is bound to one host and is not designed for CA-scale key operations."},
{d:1,o:"1.4",t:"Key escrow",df:2,q:"What is the primary purpose of key escrow?",a:["To let an authorized party recover data when the key is unavailable","To distribute session keys during a TLS handshake","To publish revoked certificate serial numbers","To increase the effective entropy of a symmetric key"],c:0,e:"Escrow stores a copy of a key with a trusted party so data can be recovered after employee departure or key loss, and to satisfy lawful access requirements. It introduces risk because the escrow becomes a high-value target."},
{d:1,o:"1.4",t:"Certificate revocation",df:3,q:"Clients on a high-latency link are timing out while validating certificates because the revocation list has grown very large. Which change BEST addresses this while still checking revocation status?",a:["Enable OCSP stapling on the web servers","Shorten the CRL publication interval","Reissue all certificates as wildcards","Switch the certificates to a self-signed root"],c:0,e:"OCSP stapling has the server present a recent, CA-signed status response during the handshake, eliminating the client's separate revocation fetch and the large CRL download. A shorter CRL interval makes the problem worse, not better."},
{d:1,o:"1.4",t:"CSR contents",df:2,q:"An administrator generates a certificate signing request. Which items are included in the CSR?",a:["The subject's public key and distinguished name","The subject's private key and distinguished name","The CA's private key and the requested validity period","The certificate revocation list distribution point only"],c:0,e:"A CSR carries the public key and identifying information, self-signed with the matching private key to prove possession. The private key never leaves the requester."},
{d:1,o:"1.4",t:"Salting & key stretching",df:3,q:"A password database is stored as unsalted SHA-256 digests. Which two changes MOST directly defeat precomputed rainbow tables and slow offline cracking? (Select TWO.)",a:["Add a unique random salt per password","Replace SHA-256 with bcrypt or PBKDF2 at a high work factor","Store the digests in a database encrypted at rest","Require passwords to contain a special character"],c:[0,1],m:true,e:"A unique salt makes precomputed tables useless because each password must be attacked individually. A deliberately slow key derivation function (key stretching) raises the per-guess cost. Encryption at rest and complexity rules help but do not address offline cracking of a stolen hash file."},
{d:1,o:"1.4",t:"Wildcard certificates",df:2,q:"An organization hosts app.example.com, mail.example.com, and vpn.example.com and wants a single certificate covering all of them and any future first-level subdomain. Which certificate type fits?",a:["A wildcard certificate for *.example.com","A self-signed certificate for example.com","Three separate third-party certificates","A root certificate installed on each server"],c:0,e:"A wildcard covers all first-level subdomains of a single domain. The trade-off is blast radius: one compromised private key exposes every host using it, and it does not cover multi-level names such as a.b.example.com."},
{d:1,o:"1.4",t:"Tokenization vs masking",df:3,q:"A retailer must remove primary account numbers from its order database so the system falls out of PCI DSS scope, while keeping the ability to retrieve the real card number through a separate vault when a refund is issued. Which technique fits BEST?",a:["Tokenization","Data masking","Full-disk encryption","Steganography"],c:0,e:"Tokenization replaces the PAN with a surrogate that has no mathematical relationship to the original; only the token vault can map it back, so the storing system leaves PCI scope. Masking is one-way and could never support the refund lookup, and encryption keeps the value mathematically recoverable inside the system, so it stays in scope."},
/* ---- DOMAIN 2: Threats, Vulnerabilities, and Mitigations (22%) ---- */
{d:2,o:"2.1",t:"Threat actor attributes",df:2,q:"An intrusion uses three previously unknown zero-days, custom implants that survive firmware reflash, and maintains access for 14 months without exfiltrating anything for the first year. Which threat actor is MOST likely?",a:["Nation-state actor","Organized crime","Hacktivist","Unskilled attacker"],c:0,e:"Multiple zero-days, firmware persistence, extreme patience, and an espionage-shaped objective indicate very high sophistication and funding. Organized crime monetizes quickly; hacktivists seek publicity; unskilled attackers use existing tooling."},
{d:2,o:"2.1",t:"Motivation mapping",df:2,q:"A group defaces a chemical company's public website with slogans about environmental damage and leaks internal memos to journalists. What is the PRIMARY motivation?",a:["Philosophical or political beliefs","Financial gain","Espionage","Blackmail"],c:0,e:"Public messaging plus a cause-driven leak is classic hacktivism, motivated by philosophical/political belief. There is no ransom demand (blackmail), no monetization (financial gain), and no covert collection (espionage)."},
{d:2,o:"2.1",t:"Shadow IT",df:2,q:"A marketing team, frustrated by procurement delays, signs up for a SaaS analytics platform with a corporate credit card and uploads customer lists. Security learns of it six months later. This is an example of:",a:["Shadow IT","An insider threat with malicious intent","A supply chain attack","Organized crime activity"],c:0,e:"Shadow IT is unsanctioned technology adopted by employees outside approved processes. The intent is productivity, not harm, which distinguishes it from a malicious insider."},
{d:2,o:"2.1",t:"Insider threat",df:2,q:"Which attribute makes an insider threat particularly difficult to detect compared with an external attacker?",a:["The insider already holds credentials and knows where data lives","Insiders always have more funding than external actors","Insiders exclusively use zero-day exploits to move","Insiders operate only outside normal business hours"],c:0,e:"The defining attribute is legitimate access plus contextual knowledge, so insider activity often resembles normal work and evades perimeter controls. Funding and sophistication vary widely."},
{d:2,o:"2.1",t:"Unskilled attacker",df:1,q:"A teenager downloads a prebuilt stresser tool and launches a flood against a school's registration portal during finals week. Which actor type and motivation apply?",a:["Unskilled attacker motivated by disruption/chaos","Nation-state actor motivated by war","Organized crime motivated by financial gain","Insider threat motivated by revenge"],c:0,e:"Using someone else's tooling with no development capability marks an unskilled attacker. Timing the outage for maximum nuisance points to disruption/chaos rather than profit."},
{d:2,o:"2.1",t:"Organized crime",df:2,q:"Which combination BEST characterizes an organized crime threat actor?",a:["High resources, high sophistication, motivated by financial gain and blackmail","Low resources, low sophistication, motivated by ethical disclosure","High resources, high sophistication, motivated by war","Low resources, high sophistication, motivated by revenge"],c:0,e:"Criminal syndicates operate as businesses: substantial funding, professional tooling and affiliates, and profit motives such as ransomware extortion and data resale."},
{d:2,o:"2.2",t:"Business email compromise",df:3,q:"A controller receives an email that appears to come from the CFO's real, previously compromised mailbox, referencing an actual in-flight acquisition and asking for an urgent wire to a new account. Which describes this attack MOST precisely?",a:["Business email compromise","Typosquatting","Watering hole attack","Smishing"],c:0,e:"BEC uses a legitimate or convincingly spoofed executive mailbox plus real business context to authorize fraudulent payments. Because it originates from a genuine account, SPF/DKIM/DMARC pass and technical filters often do not fire."},
{d:2,o:"2.2",t:"Watering hole",df:3,q:"Attackers compromise a niche industry standards website that engineers at several defense suppliers visit weekly, planting a drive-by exploit kit. This is a:",a:["Watering hole attack","Supply chain attack on a managed service provider","Pretexting campaign","Brand impersonation attack"],c:0,e:"A watering hole compromises a third-party site the intended victims are known to visit, letting the attacker wait rather than reach out. The site is not a supplier of software or services to the targets, so it is not a supply chain compromise."},
{d:2,o:"2.2",t:"Typosquatting",df:1,q:"Users are being redirected to a credential-harvesting page at 'micros0ft-login.com'. Which threat vector does the domain itself represent?",a:["Typosquatting","Vishing","Impersonation of a data subject","On-path attack"],c:0,e:"Typosquatting registers domains that visually or typographically resemble a legitimate one to catch mistyped URLs and inattentive readers."},
{d:2,o:"2.2",t:"Supply chain vector",df:3,q:"An organization is breached through a managed service provider's remote monitoring agent, which was already installed with SYSTEM privileges on every endpoint. Which vector characteristic made this so damaging?",a:["The MSP already held privileged access to the fleet","The agent used an unsecure wireless network","The endpoints were left with default credentials","The attack used an image-based payload file"],c:0,e:"Supply chain compromise inherits the trust and privilege already granted to the vendor. A single upstream compromise scales instantly to every downstream customer, bypassing perimeter controls entirely."},
{d:2,o:"2.2",t:"Vishing vs smishing",df:1,q:"An employee receives a text message claiming a package is held and asking them to tap a link to pay a redelivery fee. Which vector is this?",a:["Smishing","Vishing","Whaling","Pretexting via email"],c:0,e:"Smishing is phishing delivered by SMS or other text messaging. Vishing is voice-based."},
{d:2,o:"2.2",t:"Removable device vector",df:2,q:"USB drives with a company logo are left in the parking lot of a target's headquarters. When plugged in, they register as a keyboard and inject commands. Which two elements are in play? (Select TWO.)",a:["A removable device threat vector","A human vector exploiting curiosity","An on-path attack","A cryptographic downgrade attack"],c:[0,1],m:true,e:"The physical media is the removable device vector; the reason someone plugs it in is social engineering exploiting curiosity and the logo's implied legitimacy. Disabling unused USB ports and configuration enforcement mitigates it."},
{d:2,o:"2.2",t:"Open service ports",df:2,q:"An external scan of a new cloud subnet reveals TCP/3389 and TCP/5432 reachable from the internet. Which attack surface issue does this represent?",a:["Open service ports for management and database","An unsupported operating system version","A file-based threat vector in email","Misinformation on social media"],c:0,e:"Exposed RDP (3389) and PostgreSQL (5432) are open service ports that should be reachable only through a jump server or VPN. This is a top cause of ransomware initial access."},
{d:2,o:"2.2",t:"Client-based vs agentless",df:3,q:"A vulnerability program must choose between installed scanning agents and agentless credentialed scanning for a fleet of laptops that are frequently off the corporate network. Which is the stronger argument for agents?",a:["Agents keep collecting when the device is off the network","Agentless scanning cannot detect missing patches","Agents remove the need for credential management entirely","Agentless scanning requires software installed on each host"],c:0,e:"Agents give continuous coverage for roaming and remote hosts and do not depend on network reachability at scan time. Agentless credentialed scanning can find missing patches but only when the host is online and reachable."},
{d:2,o:"2.3",t:"Race condition / TOCTOU",df:3,q:"A privileged script checks that a file is owned by the invoking user, then opens and writes to it. An attacker replaces the path with a symlink to /etc/shadow between the two operations. Which vulnerability class is this?",a:["Time-of-check to time-of-use race condition","Buffer overflow of the stack","Directory traversal of the path","Memory injection into the process"],c:0,e:"TOCTOU exploits the window between validating a resource and using it. The fix is to operate on a handle obtained once (check and use the same object) rather than re-resolving the path."},
{d:2,o:"2.3",t:"VM escape",df:2,q:"Which virtualization vulnerability allows code running inside a guest to execute on the hypervisor or another guest?",a:["VM escape","Resource reuse","VM sprawl","Side loading"],c:0,e:"VM escape breaks guest isolation and compromises the hypervisor, which puts every VM on the host at risk. Resource reuse is the exposure of residual memory or storage data to a subsequent tenant."},
{d:2,o:"2.3",t:"Resource reuse",df:3,q:"A cloud tenant provisions a new volume and finds fragments of another customer's data. Which vulnerability does this illustrate?",a:["Resource reuse","VM escape","Race condition","Malicious update"],c:0,e:"Resource reuse occurs when memory, storage, or other resources are reallocated without being sanitized, leaking residual data across tenants or processes."},
{d:2,o:"2.3",t:"SQL injection",df:2,q:"A login form permits the input ' OR '1'='1' -- to authenticate as the first user in the table. Which control MOST directly remediates the root cause?",a:["Parameterized queries with bound variables","A web application firewall in monitor mode","Account lockout after five failed logins","Forcing TLS 1.3 on the login endpoint"],c:0,e:"Parameterized queries separate code from data so input can never alter query structure, fixing the root cause. A WAF is a compensating control, and lockout and TLS address different problems entirely."},
{d:2,o:"2.3",t:"Cross-site scripting",df:2,q:"A support ticket portal renders user-supplied text without encoding, and an attacker stores a script that steals session cookies from every agent who views the ticket. Which two mitigations apply MOST directly? (Select TWO.)",a:["Contextual output encoding of user-supplied data","Setting the HttpOnly attribute on session cookies","Increasing the password minimum length","Enabling full-disk encryption on the web server"],c:[0,1],m:true,e:"Output encoding prevents the stored payload from executing, and HttpOnly prevents script access to the session cookie even if a payload does run. Password length and disk encryption are unrelated to this vector."},
{d:2,o:"2.3",t:"End-of-life hardware",df:2,q:"A network switch reached end of life two years ago and the vendor no longer issues firmware updates. Which vulnerability category applies and what is the standard response?",a:["Legacy end-of-life hardware; replace or isolate it","Misconfiguration; reapply the secure baseline","Zero-day; wait for the vendor advisory","Cryptographic vulnerability; rotate the device certificates"],c:0,e:"End-of-life hardware cannot be patched, so the risk grows monotonically. The correct response is replacement, with segmentation and compensating controls as an interim measure and a documented exception."},
{d:2,o:"2.3",t:"Mobile: side loading & jailbreak",df:2,q:"Which pair of mobile device conditions MOST increases the risk of installing unvetted code outside the official app store?",a:["Side loading and jailbreaking/rooting","Screen lock and biometric enrollment","Cellular tethering and Bluetooth pairing","Containerization and remote wipe"],c:0,e:"Side loading installs applications outside the vetted store, and jailbreaking/rooting removes the OS integrity and sandbox protections that would otherwise contain them. MDM should detect and block both."},
{d:2,o:"2.3",t:"Zero-day",df:1,q:"Which statement BEST defines a zero-day vulnerability?",a:["A flaw exploited before the vendor has released a patch","Any vulnerability with a CVSS base score above 9.0","A vulnerability in software that has reached end of life","A misconfiguration discovered during the first day of a scan"],c:0,e:"Zero-day refers to the absence of an available fix at the time of exploitation, not to severity. It is why detective and compensating controls matter even in a well-patched environment."},
{d:2,o:"2.3",t:"Malicious update",df:3,q:"A widely used build tool's official update server is compromised and signed with the vendor's real key, distributing a backdoored release. Which two vulnerability categories does this represent? (Select TWO.)",a:["Malicious update","Supply chain vulnerability","Buffer overflow","Improper input validation"],c:[0,1],m:true,e:"The delivery mechanism itself was subverted, making it a malicious update, and because it arrives through a trusted upstream vendor it is also a supply chain vulnerability. Valid signing is precisely why it evaded normal defenses."},
{d:2,o:"2.4",t:"Ransomware indicators",df:2,q:"An analyst sees mass file-extension changes across a share, deletion of volume shadow copies, and a spike in write I/O on one workstation. What is the MOST likely activity?",a:["Ransomware encryption in progress","A worm scanning for open SMB shares","A keylogger exfiltrating credentials","A logic bomb awaiting its trigger date"],c:0,e:"Bulk renaming, shadow copy deletion (to prevent recovery), and heavy write I/O from a single host are the signature pattern of active ransomware encryption. Immediate containment is isolating that host."},
{d:2,o:"2.4",t:"Logic bomb",df:2,q:"Two weeks after a systems administrator is terminated, a script deletes payroll records at 02:00 on the first of the month. Which malware type is this?",a:["Logic bomb","Rootkit","Worm","Spyware"],c:0,e:"A logic bomb is dormant code that executes when a condition is met, such as a date or the absence of an account. It is frequently associated with malicious insiders."},
{d:2,o:"2.4",t:"Rootkit",df:2,q:"A host shows outbound beaconing in NetFlow records, but the process list, netstat output, and file listings on the host itself show nothing unusual. Which malware is MOST likely present?",a:["Rootkit","Bloatware","Adware","Ransomware"],c:0,e:"A rootkit subverts the OS or kernel so that its artifacts are hidden from host-based tools. Network telemetry collected off-host, and offline or boot-time forensic imaging, are how it is detected."},
{d:2,o:"2.4",t:"Worm vs virus",df:1,q:"Which characteristic distinguishes a worm from a virus?",a:["A worm propagates across networks without user action","A worm always encrypts data for ransom","A worm requires a host program to execute","A worm can only spread via removable media"],c:0,e:"Self-propagation without user interaction is the defining property of a worm. A virus requires a host file and, typically, user action to execute."},
{d:2,o:"2.4",t:"Impossible travel",df:2,q:"A user authenticates successfully from Chicago at 09:14 and from Warsaw at 09:41 the same morning. Which indicator is this, and what should be suspected?",a:["Impossible travel, suggesting credential compromise or token theft","Concurrent session usage, suggesting normal VPN behavior","Out-of-cycle logging, suggesting a clock skew","Blocked content, suggesting a web filter misconfiguration"],c:0,e:"Impossible travel flags authentications from geographically separated locations within a window no physical travel could cover. Common causes are stolen credentials or a replayed session token."},
{d:2,o:"2.4",t:"Password spraying",df:3,q:"Authentication logs show a single failed login attempt against 4,000 distinct accounts over six hours, all using the password 'Autumn2025!'. Which attack is this and why did lockout not fire?",a:["Password spraying; one attempt per account stays under the lockout threshold","Brute force; lockout was disabled on the domain","Credential replay; lockout does not apply to replayed tokens","Rainbow table attack; lockout only applies to interactive logons"],c:0,e:"Spraying inverts the usual pattern: few passwords against many accounts, deliberately staying beneath per-account lockout thresholds. Detection requires correlating failures across accounts rather than per account."},
{d:2,o:"2.4",t:"DNS amplification",df:3,q:"A victim's link is saturated by large DNS responses from thousands of open resolvers, none of which the victim ever queried. Which attack is this?",a:["Reflected, amplified distributed denial of service","On-path DNS hijacking","DNS cache poisoning","Domain hijacking via registrar compromise"],c:0,e:"The attacker spoofs the victim's source address to open resolvers (reflection) and chooses queries whose responses are far larger than the requests (amplification). Mitigations include upstream scrubbing, BCP 38 source filtering, and closing open resolvers."},
{d:2,o:"2.4",t:"On-path attack",df:2,q:"Users on a guest wireless network report certificate warnings, and their traffic is being decrypted and re-encrypted by an unknown device. Which attack is occurring?",a:["On-path attack","Replay attack","Downgrade attack","Birthday attack"],c:0,e:"An on-path (formerly man-in-the-middle) attacker sits between the endpoints and relays traffic. Because it cannot present a trusted certificate for the real site, users see certificate warnings, which is the key indicator."},
{d:2,o:"2.4",t:"Downgrade attack",df:3,q:"An attacker forces a client and server to negotiate TLS 1.0 with an export-grade cipher suite even though both support TLS 1.3. Which attack is this, and which control prevents it?",a:["Downgrade attack; disable legacy versions and weak ciphers","Collision attack; increase the hash output length","Replay attack; add sequence numbers to the session","Directory traversal; validate and canonicalize input paths"],c:0,e:"A downgrade attack manipulates negotiation to force weaker cryptography that the attacker can break. The definitive fix is removing the weak options entirely so there is nothing to negotiate down to."},
{d:2,o:"2.4",t:"Privilege escalation",df:2,q:"A standard user account is observed adding itself to the local Administrators group after exploiting an unpatched service running as SYSTEM. Which attack is this?",a:["Privilege escalation","Directory traversal","Credential replay","Forgery"],c:0,e:"Privilege escalation moves from lower to higher rights on a system. Vertical escalation gains higher privilege; horizontal escalation gains another user's equivalent access."},
{d:2,o:"2.4",t:"Missing logs",df:3,q:"During an investigation, an analyst finds that the security event log on a compromised server is empty from 03:00 to 05:00, though logging was enabled. What does this MOST likely indicate?",a:["Anti-forensic log clearing by the attacker during the intrusion window","Normal log rotation configured for the maintenance window","A time zone mismatch between the host and the SIEM","Insufficient disk space on the log volume"],c:0,e:"Missing logs are themselves an indicator of compromise. A gap that aligns with other intrusion evidence points to deliberate clearing, which is why forwarding logs off-host in near real time is essential."},
{d:2,o:"2.4",t:"RFID cloning",df:2,q:"An attacker stands near an employee in a coffee shop with a concealed reader, then enters the building the next morning using a duplicated badge. Which attack occurred?",a:["RFID cloning","Brute force against the badge reader","An environmental attack","Credential replay over the network"],c:0,e:"Low-frequency proximity badges often transmit a static identifier that can be read and rewritten to a blank card. Mitigations include cryptographically authenticated smart cards and adding a second factor at the door."},
{d:2,o:"2.5",t:"Segmentation",df:2,q:"After a ransomware incident spread from a single workstation to every server, which mitigation would have MOST limited the blast radius?",a:["Network segmentation separating user and server VLANs","A longer password expiration interval","Enabling verbose logging on all endpoints","Adding a second antivirus engine to each server"],c:0,e:"Segmentation restricts lateral movement so a compromise in one zone cannot reach another without passing an enforcement point. Logging aids detection but does not contain; layered AV adds little against a novel payload."},
{d:2,o:"2.5",t:"Application allow list",df:3,q:"A regulated workstation must run only five approved applications, and users must be unable to execute anything else, including signed but unapproved tools. Which control is MOST effective?",a:["An application allow list permitting only the approved executables","A block list of known malicious hashes","A host-based firewall restricting outbound ports","Antivirus with heuristic scanning enabled"],c:0,e:"An allow list denies by default and permits only explicitly approved code, which stops unknown and living-off-the-land binaries. Block lists inherently fail against anything not yet enumerated."},
{d:2,o:"2.5",t:"Configuration enforcement",df:2,q:"An organization finds that 18% of endpoints drift from the secure baseline within 60 days of imaging. Which mitigation directly addresses this?",a:["Configuration enforcement that continuously reapplies the baseline","Decommissioning the affected endpoints","Increasing the frequency of vulnerability scans","Adding a compensating control exception for each host"],c:0,e:"Configuration enforcement (group policy, MDM, or desired-state tooling) continuously detects and remediates drift. Scanning finds drift but does not correct it."},
{d:2,o:"2.5",t:"Hardening: services",df:2,q:"Which two hardening actions MOST directly reduce a server's attack surface? (Select TWO.)",a:["Disabling unused ports, protocols, and services","Removing unnecessary software and default sample content","Increasing the log retention period to one year","Enabling verbose debug logging on the web application"],c:[0,1],m:true,e:"Attack surface reduction means removing reachable functionality. Longer retention and verbose debug logging support investigation but do not reduce what an attacker can reach, and debug output can leak information."},
{d:2,o:"2.5",t:"Least privilege",df:2,q:"Developers currently hold domain administrator rights so they can restart services on production servers. Which change BEST applies least privilege while preserving the capability?",a:["A delegated right to restart only those services, just in time","Move the developers into a separate domain with the same rights","Reduce the number of developers who hold domain administrator rights","Require the developers to use a longer password for the admin account"],c:0,e:"Least privilege grants the minimum rights needed for the task, scoped to the specific services, and just-in-time elevation limits the window. Reducing headcount or lengthening passwords leaves excessive standing privilege in place."},
{d:2,o:"2.5",t:"Decommissioning",df:2,q:"A file server is being retired. Which mitigation step is specific to the decommissioning phase?",a:["Sanitize or destroy the media and document the destruction","Apply the latest cumulative security update","Enroll the server in the EDR console first","Add the server to the quarterly vulnerability scan scope"],c:0,e:"Decommissioning must remove the asset from the environment and ensure residual data cannot be recovered, with documented sanitization or destruction. The other actions belong to the operational lifecycle."},
/* ---- DOMAIN 3: Security Architecture (18%) ---- */
{d:3,o:"3.1",t:"Shared responsibility",df:2,q:"Under a cloud responsibility matrix for an IaaS deployment, which task remains the CUSTOMER's responsibility?",a:["Patching the guest OS on provisioned instances","Physical security of the data center floor","Patching the hypervisor layer","Maintaining the availability of the storage backplane"],c:0,e:"In IaaS the provider secures the facility, hardware, and hypervisor; the customer owns the guest OS upward, including patching, configuration, identity, and data. This boundary shifts as you move to PaaS and SaaS."},
{d:3,o:"3.1",t:"Serverless",df:3,q:"A team migrates a batch job to a serverless function platform. Which security implication changes MOST?",a:["No OS to patch, but misconfigured function permissions dominate the risk","The organization gains full control of the underlying host kernel","Network segmentation becomes irrelevant","Logging is handled entirely by the application code"],c:0,e:"Serverless removes host patching from scope but concentrates risk in the function's IAM role, event triggers, and dependencies. Over-permissive execution roles are the most common serverless finding."},
{d:3,o:"3.1",t:"Microservices",df:2,q:"Which security consideration is introduced by decomposing a monolith into microservices?",a:["Service-to-service calls become network transactions","Patching is no longer required because containers are immutable","The overall attack surface is always reduced","Data at rest no longer needs to be encrypted"],c:0,e:"East-west traffic multiplies, so mutual TLS, service identity, and authorization on every call become necessary. The attack surface generally grows, which is why service meshes and API gateways appear alongside microservices."},
{d:3,o:"3.1",t:"IaC",df:2,q:"What is the PRIMARY security benefit of defining infrastructure as code?",a:["Configurations are version-controlled, peer-reviewed, and reproducible","It eliminates the need for vulnerability scanning","It guarantees the environment is free of misconfiguration","It removes the requirement for identity and access management"],c:0,e:"IaC makes the environment declarative and auditable, so baselines are enforced and drift is visible in a diff. It does not remove the need to scan the templates themselves, which can codify a misconfiguration at scale."},
{d:3,o:"3.1",t:"SCADA/ICS constraints",df:3,q:"A water treatment facility's SCADA controllers cannot be patched during the 11-month production season and use protocols with no authentication. Which architectural approach is MOST appropriate?",a:["A segmented OT network with a unidirectional gateway to IT","Enroll the controllers in the corporate MDM and apply the workstation baseline","Expose the HMIs through a cloud-hosted remote desktop for vendor support","Deploy an agent-based EDR product to each controller"],c:0,e:"OT devices with unpatchable, unauthenticated protocols are protected by isolation and controlled data flow, not by host agents they cannot run. MDM and EDR are not supported on most PLCs and RTOS controllers."},
{d:3,o:"3.1",t:"Air gap vs logical segmentation",df:2,q:"Which statement correctly contrasts physical isolation with logical segmentation?",a:["Physical isolation removes shared paths; logical separation is configured","Logical segmentation is always more secure than physical isolation","Physical isolation is implemented with VLANs and ACLs","Logical segmentation requires separate cabling and switches"],c:0,e:"An air gap has no connecting path, so a configuration error cannot bridge it, but it is costly and hampers monitoring. VLANs and ACLs are logical and can be defeated by misconfiguration or VLAN hopping."},
{d:3,o:"3.1",t:"Risk transference",df:2,q:"An organization moves its email platform to a SaaS provider and purchases cyber liability insurance. Which architectural consideration do these two actions share?",a:["Risk transference","Ease of recovery","Patch availability","Compute cost"],c:0,e:"Both shift a portion of loss or responsibility to another party. Note that accountability for the data cannot be transferred even when responsibility is."},
{d:3,o:"3.1",t:"Containerization",df:2,q:"Which statement about container security is accurate?",a:["Containers share the host kernel, so a kernel flaw affects all of them","Each container runs its own kernel, providing isolation equal to a virtual machine","Containers cannot be scanned for vulnerabilities before deployment","Container images do not require any signing"],c:0,e:"Shared-kernel isolation is weaker than hypervisor isolation, which is why image scanning, minimal base images, non-root users, and kernel hardening matter. Image signing establishes provenance."},
{d:3,o:"3.2",t:"Jump server",df:2,q:"Administrators need to manage servers in a protected zone without exposing RDP and SSH to the user VLAN. Which appliance addresses this?",a:["A jump server as the only permitted management source","A load balancer in front of the management interfaces","A reverse proxy publishing RDP to the internet","A network tap mirroring management traffic"],c:0,e:"A jump server (bastion) is a hardened, heavily monitored chokepoint that is the single permitted administrative entry point into a zone, reducing the number of paths that must be secured."},
{d:3,o:"3.2",t:"Fail-open vs fail-closed",df:3,q:"An inline IPS protecting a payment authorization system loses power. To preserve the security posture rather than availability, the device should be configured to:",a:["Fail-closed, blocking traffic until the device is restored","Fail-open, passing traffic uninspected","Fail-open, and log the event to the SIEM","Switch automatically to tap mode"],c:0,e:"Fail-closed prioritizes security by denying traffic when inspection is unavailable; fail-open prioritizes availability by passing traffic uninspected. The correct choice depends on whether an outage or an unfiltered breach is worse."},
{d:3,o:"3.2",t:"Inline vs tap",df:2,q:"Which is the key operational difference between an IDS deployed on a network tap and an IPS deployed inline?",a:["A tap IDS cannot block; an inline IPS can block but can fail closed","The tap-based IDS blocks traffic while the inline IPS only alerts","Both can block traffic, but only the IDS adds latency","Neither device can be bypassed if it fails"],c:0,e:"A passive sensor on a tap or SPAN port sees a copy of traffic and can only alert. An inline IPS sits in the forwarding path so it can drop packets, at the cost of latency and a new failure mode."},
{d:3,o:"3.2",t:"802.1X and EAP",df:3,q:"A company wants to prevent an unauthorized laptop plugged into a conference room jack from reaching any internal resource, while allowing corporate devices to be placed automatically on the correct VLAN. Which solution fits?",a:["802.1X with EAP-TLS and RADIUS-assigned VLANs","MAC address filtering on each access switch","A host-based firewall policy pushed by group policy","A captive portal on the wireless controller"],c:0,e:"802.1X authenticates the supplicant at the port before any traffic is forwarded, and the RADIUS server returns VLAN assignment attributes. EAP-TLS uses certificates, so it is not defeated by credential theft. MAC filtering is trivially spoofed."},
{d:3,o:"3.2",t:"WAF vs NGFW",df:3,q:"An externally facing application is being exploited through SQL injection in a POST body. Which appliance is designed to inspect and block this specific traffic?",a:["Web application firewall","Layer 4 stateful firewall","Network load balancer","Unified threat management device in IDS mode"],c:0,e:"A WAF understands HTTP semantics and inspects request bodies, headers, and parameters against application attack signatures. A layer 4 firewall makes decisions on ports and addresses and cannot see the payload's meaning."},
{d:3,o:"3.2",t:"Forward proxy",df:2,q:"Which appliance sits between internal users and the internet, enforcing URL category policy, caching content, and logging all outbound web requests?",a:["Forward proxy","Reverse proxy","Load balancer","Jump server"],c:0,e:"A forward proxy acts on behalf of internal clients going out. A reverse proxy acts on behalf of servers, accepting inbound requests from the internet and distributing them to back-end hosts."},
{d:3,o:"3.2",t:"SASE",df:2,q:"A company with a fully remote workforce and no data center wants identity-aware access, web filtering, and CASB delivered from the cloud edge rather than by backhauling traffic. Which model is this?",a:["Secure access service edge","Site-to-site IPSec VPN","Software-defined networking within the campus","A screened subnet at headquarters"],c:0,e:"SASE converges networking (SD-WAN) and security services (SWG, CASB, ZTNA, FWaaS) at cloud points of presence, applying policy near the user rather than hairpinning traffic to a central site."},
{d:3,o:"3.2",t:"IPSec modes",df:3,q:"Which statement about IPSec is correct?",a:["ESP encrypts and authenticates the payload; AH authenticates without encryption","AH encrypts the payload while ESP only authenticates it","Tunnel mode encrypts only the payload and leaves the original IP header exposed","IPSec operates at the application layer, above TCP"],c:0,e:"ESP encrypts and authenticates; AH authenticates only and is incompatible with NAT. Tunnel mode encapsulates the entire original packet in a new IP header, which transport mode does not."},
{d:3,o:"3.2",t:"Security zones",df:2,q:"Where should an internet-facing web server that must query an internal database be placed?",a:["In a screened subnet, permitting only the database port inward","On the internal LAN with the database server","Directly on the internet-facing interface with a host firewall","In the management VLAN alongside the jump server"],c:0,e:"A screened subnet (DMZ) isolates internet-reachable services so a compromise does not put the attacker directly on the internal network, with tightly scoped rules to the back end."},
{d:3,o:"3.3",t:"Data states",df:2,q:"Which technology protects data specifically while it is IN USE?",a:["Confidential computing in a trusted execution environment","TLS 1.3 for the transport session only","AES-256 full-disk encryption on the host","Encrypted database backups written to object storage"],c:0,e:"Data in use is decrypted in memory for processing; a TEE or secure enclave keeps it encrypted and isolated even from the host OS. TLS protects data in transit, and disk or backup encryption protects data at rest."},
{d:3,o:"3.3",t:"Data sovereignty",df:2,q:"A European subsidiary's customer records must remain physically stored within the EU regardless of where the parent company operates. Which concept applies, and which control enforces it?",a:["Data sovereignty; restrictions on storage and replication region","Data classification; labeling records as confidential","Data masking; obscuring identifiers in reports","Tokenization; replacing identifiers with surrogates"],c:0,e:"Data sovereignty means data is subject to the laws of the country it resides in, so the control is a geographic restriction on where it is stored and replicated. Classification and obfuscation do not change physical location."},
{d:3,o:"3.3",t:"Classification levels",df:2,q:"Which data type is defined by the fact that a specific law or contractual regime dictates how it must be handled?",a:["Regulated data","Trade secret","Intellectual property","Public data"],c:0,e:"Regulated data (PHI under HIPAA, cardholder data under PCI DSS, personal data under GDPR) carries externally imposed handling requirements. Trade secrets and IP derive their protection from business value and law of a different kind."},
{d:3,o:"3.3",t:"Hashing vs encryption",df:3,q:"A system must verify that a stored document has not been altered, but must never be able to reproduce the original from the stored value. Which method fits?",a:["Hashing","Symmetric encryption","Tokenization","Data masking"],c:0,e:"Hashing is one-way, so it validates integrity without any possibility of recovering the input. Encryption is reversible by design, which is exactly what the requirement forbids."},
{d:3,o:"3.3",t:"Masking",df:2,q:"A call center application displays a customer's card as **** **** **** 4127 so agents can confirm the last four digits. Which technique is this?",a:["Data masking","Tokenization","Steganography","Key stretching"],c:0,e:"Masking replaces portions of a value with a placeholder for display while retaining a small, usable fragment. Tokenization substitutes the whole value with a surrogate and is used for storage and processing, not just display."},
{d:3,o:"3.3",t:"Human vs non-human readable",df:2,q:"Which of the following is BEST described as non-human-readable data requiring protection?",a:["Serialized binary telemetry from a sensor fleet","A signed PDF contract document","A spreadsheet of employee salaries","An email thread with a customer contact"],c:0,e:"Non-human-readable data such as binary protocol streams, images, and serialized records still carries sensitivity and must be classified and protected, even though it is not directly legible."},
{d:3,o:"3.3",t:"Permission restrictions",df:2,q:"An audit finds that the 'Everyone' group has Modify rights on a finance share containing regulated data. Which protection method addresses this MOST directly?",a:["Permission restrictions based on least privilege and role membership","Encrypting the share's underlying volume","Applying a geographic restriction to the file server","Enabling a longer password history policy"],c:0,e:"Excessive permissions are an access control problem, fixed by scoping rights to roles that need them. Volume encryption does not restrict an authenticated user who already has Modify rights."},
{d:3,o:"3.4",t:"Load balancing vs clustering",df:3,q:"Which statement correctly distinguishes load balancing from clustering?",a:["Load balancing spreads requests across independent nodes; clustering shares state","Clustering distributes requests across independent nodes; load balancing shares state between them","Both require shared storage to function at all","Neither provides any high availability benefit"],c:0,e:"A load balancer spreads traffic across servers that need not know about each other. A cluster coordinates nodes, often sharing state or storage, so the group presents itself as a single resilient system."},
{d:3,o:"3.4",t:"Recovery site types",df:2,q:"An organization needs to resume operations within one business day of a site loss and cannot justify a continuously running duplicate facility. Which site type fits BEST?",a:["Warm site","Cold site","Hot site","Mobile site with no pre-staged equipment"],c:0,e:"A warm site has space, connectivity, and some pre-staged hardware, and needs data restoration and configuration, which fits a one-day objective at moderate cost. A hot site is already running and meets a near-zero RTO at the highest cost; a cold site is bare space and takes days to weeks."},
{d:3,o:"3.4",t:"RTO vs RPO in backup design",df:3,q:"A database has an RPO of 15 minutes and an RTO of 2 hours. Which backup strategy BEST satisfies the RPO?",a:["Log shipping or journaling every 15 minutes to a second site","A nightly full backup written to offsite tape","Weekly full plus daily differential backups","Quarterly snapshots retained for seven years"],c:0,e:"RPO defines the maximum tolerable data loss, so capture intervals must be no longer than 15 minutes. Nightly or weekly schedules can lose up to a day or a week of transactions regardless of how quickly you restore."},
{d:3,o:"3.4",t:"Testing methods",df:2,q:"Which continuity test runs the recovery environment alongside production, processing the same workload, without cutting over?",a:["Parallel processing test","Tabletop exercise","Failover test","Simulation"],c:0,e:"A parallel test brings up the alternate site and runs real workload against it while production continues, validating capacity and correctness without risking a live cutover. A failover test actually shifts production."},
{d:3,o:"3.4",t:"Platform diversity",df:3,q:"After a single vendor's authentication outage halted all operations, leadership asks for an architectural change. Which principle addresses this?",a:["Platform diversity, so one product's defect does not affect everything","Capacity planning, so more instances of the same product are available","Journaling, so transactions can be replayed after restoration","Geographic dispersion of the same vendor's regions"],c:0,e:"Platform diversity avoids a common-mode failure by not depending on one vendor or codebase. Adding more instances or regions of the same product does not help when the defect is in the product itself."},
{d:3,o:"3.4",t:"UPS vs generator",df:1,q:"Which power protection combination is appropriate for a data center that must ride through both momentary sags and multi-hour utility outages?",a:["A UPS for instant coverage plus a generator for runtime","A generator alone, started automatically on power loss","A UPS alone, sized for eight hours of load","Dual power supplies in each server chassis"],c:0,e:"A UPS covers the seconds to minutes of transfer time and conditions power; a generator provides sustained supply. Generators take time to start, so neither alone covers both scenarios."},
{d:3,o:"3.4",t:"Snapshots vs backups",df:3,q:"Why should storage snapshots NOT be the sole protection against ransomware?",a:["Snapshots live on the same system and can be deleted by an attacker","Snapshots cannot be taken while a system is running","Snapshots do not preserve file permissions or ACLs","Snapshots always take longer to restore than tape"],c:0,e:"Snapshots are fast and useful, but sharing fate with the primary system makes them reachable by an attacker who gains storage or hypervisor privileges. Offsite, offline, or immutable copies are required."},
{d:3,o:"3.4",t:"Capacity planning",df:2,q:"Continuity planning includes capacity planning across which three dimensions?",a:["People, technology, and infrastructure","Confidentiality, integrity, and availability","Preventive, detective, and corrective","Onsite, offsite, and cloud"],c:0,e:"Capacity planning asks whether enough trained staff, sufficient compute and licensing, and adequate facilities and bandwidth exist to sustain operations at the required level, including during a disruption."},
/* ---- DOMAIN 4: Security Operations (28%) ---- */
{d:4,o:"4.1",t:"Secure baselines",df:2,q:"What is the correct sequence for managing a secure baseline?",a:["Establish, deploy, then maintain as requirements change","Deploy a vendor default, scan it, then establish a baseline from the results","Maintain existing configurations, deploy patches, then establish exceptions","Establish exceptions, deploy agents, then maintain the inventory"],c:0,e:"Baselines are established from a standard such as a CIS Benchmark or DISA STIG, deployed through configuration management, and then maintained through review as new CVEs and business requirements appear."},
{d:4,o:"4.1",t:"Wireless site survey",df:2,q:"Before deploying access points across a new warehouse, the team walks the facility measuring signal strength and interference and produces a heat map. What is the security-relevant benefit?",a:["It limits signal bleed outside the building","It eliminates the need for WPA3 encryption","It automatically configures RADIUS authentication","It prevents rogue access points from being installed"],c:0,e:"A site survey and heat map size and place APs so coverage matches the intended space, minimizing the usable signal in the parking lot. It complements, but never replaces, strong wireless authentication and encryption."},
{d:4,o:"4.1",t:"WPA3 / SAE",df:3,q:"Which improvement does WPA3-Personal provide over WPA2-Personal?",a:["SAE replaces the PSK handshake and blocks offline dictionary attacks","It replaces AES with 3DES for compatibility","It removes the need for a passphrase entirely","It disables management frame protection to improve performance"],c:0,e:"SAE (Dragonfly) provides forward secrecy and resists offline cracking of a captured handshake, which was WPA2-PSK's core weakness. WPA3 also mandates protected management frames."},
{d:4,o:"4.1",t:"Mobile deployment models",df:2,q:"Which mobile deployment model gives the organization full ownership and control of the device while permitting reasonable personal use?",a:["COPE","BYOD","CYOD with employee-owned hardware","A personal device enrolled in a MAM-only profile"],c:0,e:"Corporate-owned, personally enabled devices are purchased and managed by the organization, so full-device policy, wipe, and inspection are available. BYOD limits the organization to containerized management of corporate data."},
{d:4,o:"4.1",t:"Code signing",df:2,q:"An enterprise wants to guarantee that internally distributed applications originate from its build system and have not been altered in transit. Which control provides this?",a:["Code signing with a certificate issued to the build system","Static code analysis during the build","Sandboxing the application at runtime","Input validation within the application"],c:0,e:"Code signing provides authenticity and integrity for the artifact itself. Static analysis finds flaws in the source, and sandboxing constrains behavior after execution; neither proves origin."},
{d:4,o:"4.1",t:"Input validation",df:2,q:"Which application security practice is the primary defense against injection attacks?",a:["Server-side input validation combined with parameterized queries","Client-side JavaScript validation of form fields","Setting the Secure flag on session cookies","Obfuscating the application's source code"],c:0,e:"Validation must happen server-side because client-side checks are trivially bypassed. Combined with parameterization, it ensures untrusted input is never interpreted as code."},
{d:4,o:"4.2",t:"Sanitization vs destruction",df:3,q:"A batch of SSDs from a decommissioned database cluster held regulated data and will not be reused. Which disposal method provides the STRONGEST assurance?",a:["Physical destruction with a certificate of destruction","A single-pass overwrite of the addressable space","Quick format followed by re-partitioning","Degaussing the solid-state media"],c:0,e:"Overwriting is unreliable on SSDs due to wear leveling and over-provisioned cells, and degaussing does nothing to flash memory. For media that will not be reused, physical destruction with documented certification is the strongest option."},
{d:4,o:"4.2",t:"Asset ownership",df:2,q:"During asset assignment and accounting, what does designating an owner for each asset accomplish?",a:["It establishes accountability for classification decisions","It transfers legal liability to the individual named","It removes the need for an asset inventory","It automatically applies the correct security baseline"],c:0,e:"Ownership creates a named party accountable for the asset's classification, who may access it, and when it is patched or retired. Custodians perform the day-to-day handling on the owner's behalf."},
