"Missing logs":"A LOG GAP IS ITSELF AN INDICATOR. Missing logs aligned with other intrusion evidence = anti-forensic clearing. This is the argument for forwarding logs off-host in near real time.",
"RFID cloning":"Low-frequency proximity badges broadcast a STATIC ID that can be read at a distance and written to a blank card. Fix: cryptographically authenticated smart cards plus a second factor at the door (PIN or biometric).",
"Segmentation":"Segmentation is the answer to any 'it spread everywhere' scenario. It limits LATERAL MOVEMENT / blast radius. Detection controls (logging, alerting) never contain; only segmentation, isolation, and access control do.",
"Application allow list":"ALLOW LIST = deny by default, permit only approved code; stops unknown malware and living-off-the-land binaries. BLOCK LIST = permit by default, always one step behind. For locked-down or regulated hosts, allow list is the answer.",
"Configuration enforcement":"Scanning FINDS drift; CONFIGURATION ENFORCEMENT (Group Policy, MDM, desired-state tooling) CORRECTS it continuously. If the scenario is about hosts drifting from baseline, the fix is enforcement, not more scanning.",
"Hardening: services":"Hardening list to memorize: EDR, host-based firewall, HIPS, disable unused ports/protocols/services, change default passwords, remove unnecessary software, encrypt, patch. Attack surface reduction means REMOVING reachable functionality.",
"Least privilege":"Least privilege = minimum rights for the specific task, scoped to the specific resource, ideally granted just-in-time. 'Fewer people with admin' and 'stronger admin password' are distractors: standing excessive privilege remains.",
"Decommissioning":"Decommissioning steps: remove from the environment, sanitize or DESTROY the media, obtain a CERTIFICATE OF DESTRUCTION, update the asset inventory, honour data retention requirements.",
/* --- Domain 3 --- */
"Shared responsibility":"Draw the stack and the line. IaaS: provider owns facility/hardware/hypervisor, YOU own guest OS upward (patching, config, IAM, data). PaaS: provider adds the OS and runtime. SaaS: provider owns almost all of it. In EVERY model the DATA and identity remain yours.",
"Serverless":"Serverless removes OS patching from your scope and concentrates risk in the FUNCTION'S IAM ROLE, its event triggers, and its dependencies. Over-permissive execution roles are the number one serverless finding.",
"Microservices":"Decomposing a monolith multiplies EAST-WEST traffic, so every service-to-service call now needs authentication and encryption (mTLS, service identity, API gateway). Attack surface grows, it does not shrink.",
"IaC":"IaC benefit = version-controlled, peer-reviewed, reproducible baselines with drift visible as a diff. Caveat to write down: a misconfiguration in a template gets deployed at scale, so scan the templates too.",
"SCADA/ICS constraints":"OT/ICS reality: cannot patch, cannot reboot, protocols have no authentication, host agents are unsupported. Therefore the answer is ISOLATION - air gap, tightly segmented OT zone, unidirectional gateway or filtered DMZ. Never 'install EDR/MDM on the PLC'.",
"Air gap vs logical segmentation":"PHYSICAL isolation / air gap = no connecting path exists; a misconfiguration cannot bridge it. LOGICAL segmentation = VLANs, ACLs, SDN on shared infrastructure; cheaper and monitorable but defeatable by misconfiguration or VLAN hopping.",
"Risk transference":"Transference = shifting LOSS or responsibility to another party (insurance, outsourcing, SaaS). Critical caveat: you can transfer responsibility but you can NEVER transfer accountability for your data.",
"Containerization":"Containers SHARE THE HOST KERNEL, so isolation is weaker than a VM's hypervisor boundary. Controls: minimal base images, image scanning, image signing, run as non-root, kernel hardening.",
"Jump server":"Jump server / bastion = the single hardened, heavily monitored entry point for administrative protocols into a protected zone. It reduces the number of paths you have to secure to one.",
"Fail-open vs fail-closed":"FAIL-CLOSED = deny traffic when the device fails; protects SECURITY, costs availability. FAIL-OPEN = pass traffic uninspected; protects AVAILABILITY, costs security. The right answer depends entirely on which loss the scenario says is worse.",
"Inline vs tap":"INLINE (IPS) sits in the forwarding path: can BLOCK, adds latency, becomes a failure point. TAP/SPAN (IDS, passive) sees a COPY: can only ALERT, adds no latency, cannot be a failure point.",
"802.1X and EAP":"802.1X = port-based network access control; authenticates the SUPPLICANT before ANY traffic is forwarded, and RADIUS can return the VLAN assignment. EAP-TLS uses certificates, so stolen passwords do not help. MAC filtering is trivially spoofed and is never the right answer.",
"WAF vs NGFW":"Match the layer to the attack. Layer 4 firewall = ports and IPs. NGFW = application awareness and identity. WAF = understands HTTP, inspects bodies/headers/parameters, blocks SQLi and XSS. UTM = many functions in one box.",
"Forward proxy":"FORWARD proxy acts for internal CLIENTS going out (URL filtering, caching, egress logging). REVERSE proxy acts for SERVERS receiving inbound traffic (TLS termination, load distribution, hiding the back end).",
"SASE":"SASE = SD-WAN networking CONVERGED with cloud-delivered security (SWG, CASB, ZTNA, FWaaS) applied at a point of presence near the user, instead of backhauling traffic to a central site. The answer for a distributed remote workforce with no data center.",
"IPSec modes":"ESP = encrypts AND authenticates the payload. AH = authenticates only, no encryption, and BREAKS THROUGH NAT. TUNNEL mode encapsulates the WHOLE original packet in a new IP header (site-to-site); TRANSPORT mode keeps the original header (host-to-host).",
"Security zones":"Internet-facing services go in a SCREENED SUBNET (DMZ) with tightly scoped rules inward to the back end, so a web compromise does not put the attacker on the internal LAN. Zones: untrusted / screened subnet / internal / management / OT.",
"Data states":"Three states, three controls. AT REST = disk/file/database encryption. IN TRANSIT = TLS, IPSec, VPN. IN USE = the hard one - secure enclave, TEE, confidential computing, because the data is decrypted in memory to be processed.",
"Data sovereignty":"Data sovereignty = data is subject to the laws of the country it physically SITS in. The enforcing control is a GEOGRAPHIC RESTRICTION on storage region, replication targets, and backups. Obfuscation does not change location.",
"Classification levels":"Two lists. DATA TYPES: regulated, trade secret, intellectual property, legal information, financial, human/non-human readable. CLASSIFICATIONS: public, private, sensitive, confidential, restricted, critical. 'Regulated' means an external law or contract dictates handling.",
"Hashing vs encryption":"Hashing is ONE-WAY: proves integrity, can never reproduce the input. Encryption is REVERSIBLE by design. If the requirement says the original must never be recoverable, the answer is hashing every time.",
"Masking":"Masking = permanently obscure part of a value for DISPLAY, keeping a usable fragment (**** 4127). Tokenization = replace the WHOLE value with a surrogate for storage and processing. Display need = masking; storage/processing need = tokenization.",
"Human vs non-human readable":"Non-human-readable data (binary telemetry, serialized records, images, sensor streams) still requires classification and protection. The exam's point: sensitivity is not the same thing as legibility.",
"Permission restrictions":"Excessive permissions are an ACCESS CONTROL problem, fixed by scoping rights to roles under least privilege. Encryption does not restrict an already-authenticated user who holds Modify. Watch for 'Everyone' and 'Authenticated Users' in the stem.",
"Load balancing vs clustering":"LOAD BALANCING distributes requests across INDEPENDENT nodes that need not know about each other. CLUSTERING coordinates nodes, often with shared state or storage, so they act as ONE logical system.",
"Recovery site types":"HOT = fully equipped and running, near-zero RTO, highest cost. WARM = space, connectivity, some hardware; needs data restore and config; hours. COLD = space and power only; days to weeks; cheapest. Match the site to the RTO in the stem.",
"RTO vs RPO in backup design":"RPO drives BACKUP/REPLICATION FREQUENCY (max tolerable data LOSS). RTO drives RECOVERY ARCHITECTURE (max tolerable DOWNTIME). A 15-minute RPO means capturing at least every 15 minutes - log shipping, journaling, or replication.",
"Testing methods":"Escalating order: TABLETOP (discussion only) -> WALKTHROUGH -> SIMULATION (act it out, no production impact) -> PARALLEL PROCESSING (run the alternate site alongside production) -> FAILOVER (actually cut over, highest risk and highest assurance).",
"Platform diversity":"Platform diversity avoids a COMMON-MODE failure: one vendor's defect or outage cannot take down everything. Adding more instances or more regions of the SAME product does not help when the flaw is in the product.",
"UPS vs generator":"UPS covers the seconds-to-minutes gap instantly and conditions power. GENERATOR provides sustained runtime but takes time to start. Multi-hour outage protection requires BOTH, in that order.",
"Snapshots vs backups":"Snapshots share fate with the primary system, so an attacker with storage or hypervisor privilege can delete or encrypt them. Real ransomware protection needs OFFSITE, OFFLINE, or IMMUTABLE copies. Remember 3-2-1.",
"Capacity planning":"Continuity capacity planning covers three dimensions: PEOPLE (trained staff), TECHNOLOGY (compute, licences), INFRASTRUCTURE (facilities, bandwidth, power). A plan that only covers hardware is incomplete.",
/* --- Domain 4 --- */
"Secure baselines":"Three verbs, in order: ESTABLISH the baseline (CIS Benchmark, DISA STIG, vendor guide), DEPLOY it via configuration management, MAINTAIN it as CVEs and requirements change. Any question about baselines is asking which verb.",
"Wireless site survey":"Site survey + HEAT MAP size and place APs so coverage matches the intended space and signal bleed outside the building is minimised. It reduces where an attacker can stand; it never replaces WPA3 and 802.1X.",
"WPA3 / SAE":"WPA3-Personal replaces the WPA2 4-way handshake with SAE (Dragonfly): forward secrecy, and a captured handshake cannot be cracked offline. WPA3 also MANDATES protected management frames. WPA2 = CCMP/AES; WPA3 = SAE + GCMP.",
"Mobile deployment models":"BYOD = employee owns; organization manages only the corporate container. COPE = organization owns, full control, personal use allowed. CYOD = employee picks from an approved list, organization still owns. Control level tracks ownership.",
"Code signing":"Code signing proves ORIGIN and INTEGRITY of the artifact. Static analysis finds flaws in the SOURCE. Sandboxing constrains BEHAVIOUR at runtime. Three different jobs - do not substitute one for another.",
"Input validation":"Validation must be SERVER-SIDE; client-side JavaScript checks are trivially bypassed with an intercepting proxy. Prefer allow-list validation (what is permitted) over block-list (what is forbidden).",
"Sanitization vs destruction":"SSDs: overwriting is UNRELIABLE (wear levelling, over-provisioned cells) and degaussing does NOTHING to flash. For media not being reused, the answer is physical destruction (shred, disintegrate, pulverize) plus a certificate of destruction. Degaussing is for magnetic media only.",
"Asset ownership":"Assigning an OWNER creates accountability for classification, access decisions, and lifecycle actions. The CUSTODIAN/STEWARD does the day-to-day handling. Ownership never transfers legal liability to an individual.",
"Enumeration & inventory":"An accurate inventory with OWNER and DATA CLASSIFICATION attributes is the prerequisite for prioritising containment. If responders cannot tell what a host is or what it holds, response stalls. Inventory is a security control, not paperwork.",
"Data retention":"Retention has two halves and the exam tests the second: data you no longer hold cannot be breached. Minimisation and timely deletion reduce breach impact and satisfy privacy 'storage limitation'. Periods come from legal and business need.",
"CVSS vs CVE":"CVE = the unique IDENTIFIER so everyone means the same flaw. CVSS = the SCORE (0.0-10.0) describing severity, in Base / Temporal / Environmental metric groups. CWE = the weakness class. Three different things.",
"False positives":"FALSE POSITIVE = alerted, not real -> confirm, document, TUNE the template. FALSE NEGATIVE = real, not alerted -> the dangerous one. Confirmation of findings is a formal step in vulnerability analysis, not optional.",
"Prioritization inputs":"CVSS BASE describes the flaw in the abstract. Real priority comes from ENVIRONMENTAL VARIABLES: exposure (internet-facing?), data sensitivity, business/organizational impact, and risk tolerance. Identical base scores routinely get different priorities.",
"SAST vs DAST":"SAST = analyses SOURCE at rest, finds flaws early, more false positives, needs the code. DAST = tests the RUNNING application from outside, finds runtime and config issues, no source needed. Package/SCA = third-party dependencies.",
"Package monitoring":"Package monitoring / software composition analysis tracks DIRECT AND TRANSITIVE dependencies against vulnerability databases. It is how you find risk in code you did not write - the largest part of most applications.",
"Exceptions & exemptions":"When a patch cannot be applied, the answer is a FORMAL, TIME-BOUND EXCEPTION with compensating controls, a named owner, and a review date - recorded in the risk register. Suppressing or descoping the finding hides real risk.",
"Validation of remediation":"Remediation is not done until it is VALIDATED: rescan, audit, or verify. Deployment tools frequently report success on patches that did not fully apply or are pending a reboot. Then report.",
"SIEM correlation":"Aggregation is the input; CORRELATION across sources and time is the value - turning individually unremarkable events into a detection. SIEM detects and reports; SOAR and EDR act.",
"Alert tuning":"Alert tuning refines rule logic and adds verified benign exclusions, PRESERVING the detection. Disabling the rule or ignoring the queue creates a blind spot, which is worse than the noise. Tuning is a listed activity, not a shortcut.",
"SCAP & benchmarks":"SCAP = machine-readable format for security configuration and vulnerability content, so different vendors' tools evaluate a system against the SAME benchmark identically. Pairs with CIS Benchmarks and DISA STIGs.",
"NetFlow":"NETFLOW = conversation METADATA (source, destination, ports, bytes, timestamps). Compact, so it can be retained for months. FULL PACKET CAPTURE = contents, huge, retained for days at best. Pick by whether the question needs content or just who-talked-to-whom.",
"DLP":"DLP inspects CONTENT for sensitive patterns and enforces block/quarantine/encrypt, across data in motion, at rest, and in use. NAC controls DEVICE ADMISSION. FIM watches for unauthorized FILE CHANGES. Do not swap them.",
"Agent vs agentless monitoring":"AGENT: deep continuous host visibility including off-network, but resource cost, deployment burden, and its own attack surface. AGENTLESS: nothing to install, but needs credentials and network reachability at scan time.",
"Quarantine":"Quarantine CONTAINS while PRESERVING for analysis (isolate the host's network, hold the file). Deleting outright destroys evidence. Alert response activities: validate, quarantine, remediate, tune.",
"SPF, DKIM, DMARC":"SPF = which servers may send for the domain. DKIM = cryptographic signature proving the message was not altered. DMARC = binds them to the visible From domain (ALIGNMENT), publishes the policy (none/quarantine/reject), and provides REPORTING. Only one SPF record per domain is valid.",
"DNS filtering":"DNS filtering blocks RESOLUTION of known-bad, newly registered, or categorised domains - stopping the callback before any connection. It beats IP-based egress rules against fast-flux infrastructure.",
"NAC":"NAC gates admission on IDENTITY + POSTURE (patch level, AV status, configuration), quarantining noncompliant devices to a remediation VLAN. Often implemented with 802.1X.",
"EDR vs XDR":"EDR = endpoint telemetry, detection and response on the host. XDR = CORRELATES ACROSS endpoint, network, email, identity, and cloud. Both need an agent; the difference is breadth of telemetry, not agent vs agentless.",
"UBA":"UBA/UEBA builds a BEHAVIOURAL BASELINE per user and entity and alerts on deviation. It catches credential misuse and insider activity that violates no signature - which signature-based detection structurally cannot.",
"Group Policy vs SELinux":"Group Policy = centralized configuration enforcement for WINDOWS domain members. SELinux (and AppArmor) = MANDATORY ACCESS CONTROL on LINUX, confining processes regardless of file permissions.",
"Secure protocol selection":"Memorize the swaps and ports: Telnet 23 -> SSH 22. FTP 20/21 -> SFTP 22 or FTPS 989/990. HTTP 80 -> HTTPS 443. LDAP 389 -> LDAPS 636. SNMPv1/v2c 161 -> SNMPv3 (first version with authentication AND privacy). SMTP 25 -> submission 587 (STARTTLS) or SMTPS 465 (implicit TLS).",
"Screened subnet rules":"Firewall rules are evaluated TOP-DOWN, first match wins, most specific first, ending in an EXPLICIT deny-any-any WITH LOGGING - because the implicit deny is silent and gives you no visibility into what was blocked.",
"SAML vs OAuth":"SAML = XML assertions, AUTHENTICATION and SSO between IdP and SP, browser-based enterprise. OAUTH 2.0 = delegated AUTHORIZATION, access without sharing credentials. OPENID CONNECT = the authentication layer on top of OAuth. LDAP = the directory itself.",
"Access control models":"MAC = system-enforced labels, owner cannot override. DAC = owner sets permissions at their discretion. RBAC = rights by ROLE/job function. RULE-BASED = global rules like an ACL or time restriction. ABAC = evaluates MULTIPLE attributes of subject, object and environment at request time (department + device posture + location).",
"Mandatory access control":"MAC = labels and clearances enforced by the SYSTEM; the data owner has no ability to grant access. Government and military classification is the archetype. It is the opposite of DAC.",
"MFA factors":"Factors: something you KNOW, something you HAVE, something you ARE, somewhere you ARE, something you DO. Multifactor requires DIFFERENT CATEGORIES, not different devices. Password + PIN + security question = still single-factor.",
"Just-in-time PAM":"PAM tools: JUST-IN-TIME permissions (elevate only for an approved window, auto-revoke), PASSWORD VAULTING (check out credentials), EPHEMERAL CREDENTIALS (short-lived, auto-rotated). JIT is the one that eliminates STANDING privilege.",
"Ephemeral credentials":"For pipelines and workloads, use short-lived credentials issued per run via a workload identity. Long-lived access keys stay valid long after they are stolen - that lifetime is the whole risk.",
"Deprovisioning":"Offboarding must revoke EVERYTHING on the termination date: directory account, tokens and sessions, VPN profile, SaaS entitlements, physical badge, and return of assets. Automate it from the HR system (joiner-mover-leaver).",
"Password policy":"Current guidance: LENGTH over composition, screen against BREACHED password corpora, allow password managers and paste, and drop scheduled expiration - forced rotation produces predictable patterns. Rotate on suspected compromise.",
"Identity proofing":"IDENTITY PROOFING happens BEFORE an account exists: prove the person is who they claim (government ID, liveness check). ATTESTATION is the PERIODIC REVIEW confirming existing access is still appropriate. Different points in the lifecycle.",
"Guard rails":"Guard rails = automated policy constraints that make an insecure configuration IMPOSSIBLE at provisioning time, rather than detecting it afterwards. Automation use cases also include: user and resource provisioning, security groups, ticket creation, escalation, enabling/disabling services, CI/CD, APIs.",
"Automation benefits":"Benefits list: efficiency/time saving, enforcing baselines, standard infrastructure configurations, scaling securely, employee retention, REACTION TIME, workforce multiplier. Reaction time is the one that shortens detection-to-containment.",
"Automation risks":"Other considerations to write down: complexity, cost, SINGLE POINT OF FAILURE, technical debt, ongoing supportability. Automation amplifies bad logic at scale, and a compromised orchestrator holds broad privilege across the estate.",
"User provisioning automation":"Automating joiner-mover-leaver from the HR system of record enforces the same rules every time and removes the manual omissions that leave orphaned and over-provisioned accounts behind.",
"IR phase ordering":"Seven phases in order: PREPARATION, DETECTION, ANALYSIS, CONTAINMENT, ERADICATION, RECOVERY, LESSONS LEARNED. Containment stops spread; eradication removes the attacker and root cause; recovery restores and validates; lessons learned feeds back into preparation.",
"Containment decision":"Containment timing trades damage limitation against intelligence gathering. ACTIVE lateral movement means containment wins. Note the tension: isolating a host can destroy volatile evidence, so acquire memory FIRST where feasible.",
"Chain of custody":"CHAIN OF CUSTODY = the unbroken documented record of who handled evidence, when, and why - what makes it admissible. LEGAL HOLD = the instruction to preserve once litigation is anticipated. E-DISCOVERY = producing it. ACQUISITION, PRESERVATION, REPORTING complete the set.",
"Order of volatility":"Order of volatility, most to least: CPU registers and cache -> RAM (running processes, network connections) -> temp/swap -> disk -> remote and archived logs -> physical/offline backups. Collect in that order.",
"Threat hunting":"Threat hunting is PROACTIVE and HYPOTHESIS-DRIVEN: it assumes existing detections missed something and tests that assumption against telemetry. Successful hunts become new detection rules. Alert triage is reactive.",
"Log source selection":"Match the question to the source. Egress session, bytes, ports = firewall/NetFlow. Logon success/failure = OS security log (4624/4625). Application error/behaviour = application log. Process and file activity = endpoint/EDR log. Signature match = IDS/IPS log.",
"Metadata":"Metadata answers WHO, WHEN, and WITH WHAT without reading the content: authorship, timestamps, application version, revision history, GPS in images. EMAIL HEADERS are the metadata equivalent for message routing.",
"Packet capture":"Full packet capture gives CONTENT and allows session reconstruction, at high storage cost, and only for unencrypted traffic. Flow data gives metadata only. Other investigative sources: vulnerability scans, automated reports, dashboards.",
/* --- Domain 5 --- */
"Policy vs standard vs procedure":"Four-level hierarchy, memorize it: POLICY = high-level intent and requirement ('access must be authenticated'). STANDARD = mandatory measurable detail ('14 characters minimum'). PROCEDURE = step-by-step how-to. GUIDELINE = recommended, optional.",
"Data roles":"CONTROLLER decides the PURPOSE AND MEANS of processing and holds primary accountability. PROCESSOR acts only on the controller's documented instructions. OWNER is internal accountability, CUSTODIAN/STEWARD implements. This split drives contracts and breach notification duties.",
"Custodian vs owner":"OWNER = makes classification and access decisions, accountable. CUSTODIAN/STEWARD = implements and maintains the controls on the owner's behalf. In exam scenarios the DBA or sysadmin is almost always the custodian, never the owner.",
"AUP":"Policies to know by name: ACCEPTABLE USE, information security, business continuity, disaster recovery, incident response, SDLC, change management. AUP defines permitted use of systems and is acknowledged at onboarding - which is what makes enforcement defensible.",
"Governance structures":"CENTRALIZED = one standard for the whole organization, consistent but less responsive. DECENTRALIZED = business units set their own, responsive but inconsistent. Structures include boards, committees, and government entities.",
"Playbooks":"PLAYBOOK = ordered, per-scenario response steps that operationalize the incident response policy. Because it is deterministic, it is what SOAR automation executes. Procedures also cover change management and onboarding/offboarding.",
"SLE, ARO, ALE":"Memorize the chain: SLE = Asset Value x Exposure Factor. ALE = SLE x ARO. ARO = occurrences per year (once in 20 years = 0.05). ALE is the ceiling on rational annual control spend. Practise these until the arithmetic is automatic.",
"Exposure factor":"EXPOSURE FACTOR = the PERCENTAGE of an asset's value lost in ONE event. It is a percentage, never a count and never a dollar figure. AV x EF = SLE.",
"Risk strategies":"Four strategies: AVOID (stop doing the activity), MITIGATE (reduce likelihood or impact), TRANSFER (insurance, outsourcing), ACCEPT (documented, with exemption or exception). Discontinuing a product line is avoidance, not mitigation.",
"Risk appetite":"APPETITE = how much risk you are WILLING TO PURSUE overall: expansionary, neutral, conservative. TOLERANCE = acceptable variation around a SPECIFIC risk. THRESHOLD = the level that triggers action. Three different words, three different meanings.",
"Risk register contents":"Risk register holds: risk description, RISK OWNER, likelihood and impact, KEY RISK INDICATORS, risk threshold, chosen treatment, and residual risk. It is a living document, not a scan report.",
"RTO vs RPO":"RTO = maximum tolerable DOWNTIME (time to restore). RPO = maximum tolerable DATA LOSS (how far back you fall). MTTR = average time to repair. MTBF = average time between failures. Only the first two are recovery objectives; all four come from the BIA.",
"MTBF vs MTTR":"MTBF = expected runtime BETWEEN failures - a reliability figure for purchasing decisions. MTTR = expected time TO REPAIR once failed - drives spares and staffing. MTBF is about how often; MTTR is about how long.",
"Assessment cadence":"AD HOC = unplanned, reactive. ONE-TIME = scoped to a specific event or decision (an acquisition, a new system). RECURRING = on a defined schedule. CONTINUOUS = ongoing and automated.",
"Risk threshold":"A KEY RISK INDICATOR crossing its THRESHOLD triggers a predefined escalation to the RISK OWNER and the agreed treatment. Redefining the threshold to silence it defeats the purpose of the indicator.",
"Right-to-audit clause":"RIGHT TO AUDIT must be negotiated BEFORE signing; without it you have no contractual basis to inspect. Related vendor evidence: independent assessments, evidence of internal audits, penetration test results, supply chain analysis.",
"SLA vs MOU vs MSA":"SLA = measurable performance commitments and remedies. MOU = non-binding statement of intent. MOA = more formal, can be binding. MSA = overarching terms for a continuing relationship. BPA = terms of a partnership. NDA = confidentiality. SOW/WO = the specific work.",
"SOW / work order":"MSA sets the legal framework ONCE; each engagement is then scoped by a STATEMENT OF WORK or WORK ORDER covering deliverables, timeline, and price - so you never renegotiate the master terms per project.",
"Vendor due diligence":"DUE DILIGENCE = pre-contract investigation (SOC 2 reports, pen test summaries, financial stability, supply chain analysis). VENDOR MONITORING = the ongoing version after award. Selection also covers conflict of interest.",
"Conflict of interest":"An evaluator with a financial interest in a bidder must DISCLOSE and RECUSE. It sits in vendor selection alongside due diligence, and it exists to keep the decision defensible.",
"Vendor monitoring":"Third-party risk is CONTINUOUS, not point-in-time. Ongoing assurance = recurring QUESTIONNAIRES, refreshed independent assessments/attestations, and external risk ratings, so you detect posture drift over the contract's life.",
"Due care vs due diligence":"DUE DILIGENCE = the investigation and ongoing research (doing your homework). DUE CARE = acting reasonably on what you found (the prudent action). Courts examine both when judging negligence. Diligence first, care second.",
"Non-compliance consequences":"Consequences of non-compliance: FINES, SANCTIONS, REPUTATIONAL DAMAGE, LOSS OF LICENCE, CONTRACTUAL IMPACTS. Loss of licence to operate is unique to REGULATORS - no contract counterparty can impose it.",
"Attestation & acknowledgement":"ATTESTATION AND ACKNOWLEDGEMENT = individuals formally confirm they received and accept a requirement, creating the evidence auditors and enforcement depend on. Compliance monitoring also covers due diligence/care, internal and external review, and automation.",
"Right to be forgotten":"RIGHT TO BE FORGOTTEN / erasure requires deletion on request, but YIELDS to overriding legal retention duties (tax, regulatory). A DATA INVENTORY is what makes fulfilling the request possible at all. Related: data subject, ownership, retention.",
"Internal vs external reporting":"INTERNAL reporting informs management and the board. EXTERNAL reporting satisfies regulators, auditors, customers, and certification bodies - and carries far greater consequence for inaccuracy.",
"Pen test environment knowledge":"UNKNOWN environment (black box) = tester gets nothing, most realistic, budget spent on discovery. KNOWN environment (white box) = full documentation and credentials, maximum coverage per hour. PARTIALLY KNOWN (gray box) = some information, the usual compromise.",
"Passive vs active recon":"PASSIVE recon uses third-party and public sources and leaves NO TRACE in the target's logs (WHOIS, certificate transparency, social media, job postings, DNS records from public resolvers). ANY packet sent to the target - scans, zone transfer attempts, banner grabs - is ACTIVE.",
"Internal audit vs external":"INDEPENDENCE is what creates external credibility. Ranked: independent third-party audit / regulatory examination > internal audit (audit committee) > management self-assessment > vendor questionnaire. Attestation is the formal statement of the result.",
"Offensive vs defensive testing":"RED = offensive. BLUE = defensive. PURPLE = the integrated collaboration that turns attack findings into detections. WHITE cell = manages the exercise and adjudicates. 'Integrated' in the objectives means purple.",
"Rules of engagement":"RULES OF ENGAGEMENT define permitted targets, testing windows, prohibited techniques, handling of discovered data, and emergency contacts. Without it the tester has no documented authorization for otherwise illegal activity.",
"Phishing campaign metrics":"CLICK RATE measures susceptibility. REPORTING RATE measures whether you get early warning - and it is the better culture metric, because a workforce that reports fast shortens detection time even when someone clicks. Track both, plus time-to-report.",
"Anomalous behavior recognition":"Three categories to name: RISKY (knowingly circumventing a control), UNEXPECTED (out of pattern), UNINTENTIONAL (an honest mistake). Deliberately bypassing change control is RISKY regardless of good intent.",
"Operational security training":"OPSEC = controlling disclosure of information an adversary could aggregate (project names, org charts, travel, badges in photos, overheard calls). Training topics list also includes: insider threat, password management, removable media and cables, social engineering, hybrid/remote work.",
"Insider threat awareness":"Peers observe behavioural indicators long before technical controls fire. The goal of the training is RECOGNITION plus a clear REPORTING PATH - it complements monitoring rather than replacing it.",
"Program development & execution":"Awareness program cycle: DEVELOP content from your real threat profile -> EXECUTE recurring training (initial AND recurring, never one-time) -> MONITOR resulting behaviour -> REVISE from what you measured. Reporting and monitoring are explicit objective bullets.",
/* --- added: Domain 1 --- */
"Access control vestibule":"Access control vestibule (mantrap) = PHYSICAL + PREVENTIVE; it stops tailgating outright. A camera on the same door is PHYSICAL + DETECTIVE. Same location, different type - the type is always about what the control DOES.",
"Training as a control":"Security awareness training = OPERATIONAL category (people carry it out day to day) + PREVENTIVE type (stops incidents before they happen). The written policy REQUIRING the training is MANAGERIAL + DIRECTIVE. Two different controls, easily confused.",
"Detective technical controls":"A SIEM alert rule = TECHNICAL + DETECTIVE. If the same rule auto-disabled the account it would add a CORRECTIVE action. Rule of thumb: technology that watches = detective; technology that stops = preventive; technology that fixes = corrective.",
"CIA: availability":"Map the attack to the letter. DoS/ransomware encryption/hardware failure = AVAILABILITY. Data theft/eavesdropping = CONFIDENTIALITY. Tampering/unauthorized modification = INTEGRITY. Non-repudiation is a fourth concept, not part of the triad.",
"Authenticating systems":"Authenticating PEOPLE = passwords, MFA, biometrics. Authenticating SYSTEMS = certificates and mutual TLS, device certificates, workload identity. Shared API keys and IP allow lists are NOT system authentication - one is a shared secret, the other is a location.",
"Implicit deny":"IMPLICIT DENY = anything not explicitly permitted is refused (the default posture of a firewall ruleset). LEAST PRIVILEGE = how big the grant is once permitted. SEPARATION OF DUTIES = splitting a sensitive task across people. Three separate ideas.",
"Honeypot purpose":"Two benefits of deception, both worth writing: (1) near-zero false positives, because nothing legitimate should ever touch it; (2) it burns attacker time and reveals their tooling. It does NOT remediate anything or provide segmentation.",
"Emergency change":"Emergency changes get an ABBREVIATED approval path plus MANDATORY retroactive CAB review and documentation. Urgency changes the SEQUENCE, never the requirement to record what was done and why.",
"Standard operating procedure":"SOP = repeatable steps so a known change type is executed the same way by anyone. Distinguish from the change REQUEST (justification, risk acceptance) and the IMPACT ANALYSIS (what breaks, who to tell).",
"Impact analysis vs test results":"IMPACT ANALYSIS = forward-looking prediction of what could be disrupted and who must be notified. TEST RESULTS = evidence from staging that it actually works. A CAB wants both: a forecast and a proof.",
"Symmetric vs asymmetric roles":"In TLS: ASYMMETRIC does authentication and key exchange (slow, used briefly). SYMMETRIC encrypts the bulk session data (fast). Write this as the general rule - asymmetric to establish, symmetric to transport.",
"Root of trust & chain validation":"Certificate validation checks: (1) chains to a root already in the trust store (root of trust), (2) every signature in the chain verifies, (3) nothing expired, (4) nothing revoked (CRL/OCSP), (5) name matches. Self-signed = no external root = browser warning.",
"Blockchain & public ledger":"Blockchain integrity comes from each block containing the PREVIOUS block's hash, so altering an old block invalidates everything after it, plus distributed replication. It provides INTEGRITY and TRANSPARENCY, not confidentiality.",
"Encryption levels":"Levels, from coarsest to finest: FULL-DISK -> PARTITION -> VOLUME -> FILE -> DATABASE -> RECORD/FIELD/COLUMN. Critical point: disk/volume/partition encryption only protects powered-off media. A running database exposes everything to an authorized query, so a single sensitive column needs record or field level encryption.",
/* --- added: Domain 2 --- */
"Nation-state vs organized crime":"When both are sophisticated, MOTIVATION is the discriminator, not tooling. Strategic intelligence, prepositioning, disruption of critical services = nation-state. Ransomware, fraud, data resale = organized crime.",
"Revenge motivation":"Insider + grievance (demotion, termination, being passed over) = REVENGE. Look for a current or recent employee using legitimate access, with no cause, no payment, and no borrowed tooling in the stem.",
"Internal vs external attribute":"The internal/external attribute tells you WHERE your controls must sit. Against insiders the perimeter is useless; what works is least privilege, separation of duties, UBA/monitoring, and data-centric controls.",
"Pretexting":"PRETEXTING = inventing a plausible scenario and false identity so the request seems routine. It is usually the SETUP for a later attack (collecting names, schedules, layouts), not the payoff itself. Impersonation is claiming to be a specific person.",
"Misinformation & disinformation":"The distinction is INTENT. MISinformation = false, spread unknowingly. DISinformation = false, spread deliberately to cause harm. Coordinated fake accounts establish intent, so that is disinformation.",
"Image and file based vectors":"The objectives list these as separate vectors: MESSAGE-BASED (email/SMS/IM), IMAGE-BASED, FILE-BASED, VOICE CALL, REMOVABLE DEVICE. Macros in documents = file-based. Payload hidden in image data (steganography) = image-based.",
"Unsecure networks":"On hotel/airport/public wireless the threats are interception and on-path attacks. The control that actually addresses it is an ALWAYS-ON FULL-TUNNEL VPN, which makes the local network irrelevant. Screen locks and password rotation do nothing here.",
"Buffer overflow":"BUFFER OVERFLOW = writing past the end of an allocated buffer, often overwriting the return address. ROOT-CAUSE fix = bounds checking and safe string handling. ASLR, DEP/NX, and stack canaries are MITIGATIONS that make exploitation harder, not fixes.",
"Misconfiguration":"MISCONFIGURATION = the software is fine, the deployment is not (public bucket, default settings left from testing, anonymous access enabled). It is one of the most common causes of cloud data exposure. Never call this a zero-day.",
"Cryptographic vulnerability":"Cryptographic vulnerabilities include: weak/deprecated algorithms, short keys, INSUFFICIENT ENTROPY in key or token generation, key reuse, and improper certificate validation. A PRNG seeded with the clock makes tokens predictable and sessions forgeable - always use a CSPRNG.",
"Cloud-specific vulnerability":"In the cloud, IDENTITY IS THE PERIMETER. Over-permissive IAM roles and privilege chaining (one role able to assume another) are the classic cloud-specific vulnerability, and they are the CUSTOMER's side of the shared responsibility line, not the provider's.",
"Directory traversal":"DIRECTORY TRAVERSAL uses ../ sequences to escape the intended directory. Fix: CANONICALIZE the path (resolve it fully) and confirm it still sits under the permitted base directory; run the service with least privilege. Filtering the string alone is defeated by encoding tricks.",
"Replay attack":"REPLAY = capture valid data and resubmit it later; the attacker never needs the password. Defeated by FRESHNESS: nonces, sequence numbers, timestamps, short token lifetimes, and an encrypted channel so it cannot be captured in the first place.",
"Concurrent session usage":"CONCURRENT SESSION USAGE = the same account live in two incompatible places at once. IMPOSSIBLE TRAVEL = two logins too far apart in space for the time elapsed. Both point to a stolen credential or session token; the difference is simultaneous vs sequential.",
"Birthday and collision attacks":"COLLISION = two different inputs produce the same hash, which destroys the integrity guarantee a signature depends on. The BIRTHDAY PARADOX means collisions are found in roughly 2^(n/2) work, not 2^n - which is why MD5 and SHA-1 are deprecated.",
"Resource inaccessibility":"Multiple unrelated services failing simultaneously = RESOURCE INACCESSIBILITY. Think shared dependency (authentication/directory, DNS, storage) or an active destructive event such as ransomware. It is an availability INDICATOR, not routine troubleshooting.",
"Isolation":"ISOLATION cuts a compromised host's communication while KEEPING IT RUNNING for memory acquisition. Do not confuse with decommissioning (wipe/reimage - destroys evidence) or eradication (removing the attacker). Isolation is the containment step.",
"Monitoring as mitigation":"Monitoring is DETECTIVE. Its value is reducing DWELL TIME, which limits total impact - it never prevents the attack and never substitutes for segmentation or least privilege. Expect a distractor that claims monitoring blocks something.",
"Host-based firewall vs HIPS":"HOST FIREWALL = allow/deny by address, port, protocol. HIPS = inspects behavior and content, can block malicious activity riding on a PERMITTED port (443, for example). Because attackers hide in allowed ports, you need both layers.",
"Default password changes":"Default credentials are published in vendor manuals and are among the first things scanned for. Changing them belongs in the DEPLOYMENT PROCEDURE for every device class - and remember printers, cameras, switches, and appliances count as devices.",
/* --- added: Domain 3 --- */
"Centralized vs decentralized":"CENTRALIZED = consistent enforcement, unified visibility, easier audit - but the platform becomes a high-value target and a single point of failure. DECENTRALIZED = local responsiveness and blast-radius containment - but inconsistency and gaps. Every exam answer here is a trade-off, never a winner.",
"Inability to patch":"When patch availability ends (vendor gone, EOL, certification lock), risk only grows. The architectural response is fixed: ISOLATE + COMPENSATING CONTROLS + MONITORING + a funded, dated REPLACEMENT PLAN, recorded as an exception.",
"IoT architecture risks":"IoT risk profile: weak or absent authentication, rare firmware updates, no host agent possible, long service life. Therefore the answer is always a DEDICATED SEGMENT with tightly controlled flows - never host hardening or MDM enrollment.",
"High availability vs resilience":"HIGH AVAILABILITY = engineered redundancy for EXPECTED component failures, measured as uptime. RESILIENCE = the broader ability to absorb and recover from UNEXPECTED, larger shocks (region loss, destructive attack), covering architecture, process, and people.",
"Device placement":"A device can only act on traffic that PASSES THROUGH IT. East-west traffic between internal VLANs never reaches the internet edge, so internal inspection must sit at the internal routed boundary - and INLINE if it needs to block.",
"Load balancer security role":"Load balancer security functions worth listing: TLS termination/offload (centralizes certificate management), HEALTH CHECKS that pull failed nodes from rotation (protects availability), and absorption of connection floods. It is not an endpoint or identity control.",
"Active vs passive devices":"PASSIVE = off the forwarding path (tap/SPAN), sees a copy, can only alert, adds no latency, cannot fail the network. ACTIVE = in the path, can modify or block, adds latency, becomes a failure mode. Pair this with inline vs tap and fail-open vs fail-closed.",
"Remote access VPN vs tunneling":"SPLIT TUNNEL = only internal-bound traffic goes through the gateway; faster, but internet traffic BYPASSES corporate inspection. FULL TUNNEL = everything is backhauled and inspected; slower and bandwidth-hungry. Also know site-to-site (office to office) vs remote access (user to office).",
"Data in transit controls":"IN TRANSIT = encrypt the CHANNEL. TLS at the transport layer for application sessions; IPSec at the network layer for tunnels. Do not answer with disk encryption (at rest) or masking/tokenization (obfuscation of the value itself).",
"Trade secret vs intellectual property":"A TRADE SECRET is protected ONLY by remaining secret - once disclosed the protection is gone permanently, so access must be tightly restricted and logged. Patents and copyrights are REGISTERED intellectual property, which trade secrecy deliberately avoids.",
"Geographic restrictions":"Two location concepts, do not swap them. GEOGRAPHIC RESTRICTIONS / geofencing / geo-blocking = controls where users connect FROM. DATA SOVEREIGNTY = controls where the data is STORED and which laws apply to it.",
"Obfuscation methods compared":"By reversibility: STEGANOGRAPHY (extractable), TOKENIZATION (reversible via the vault only), ENCRYPTION (reversible with the key) vs HASHING (one-way, never) and destructive MASKING (one-way). Pick the method by whether you must ever get the original back.",
"Geographic dispersion":"GEOGRAPHIC DISPERSION protects against REGIONAL events - flood, storm, grid failure, civil disruption - which a second site across the street does not. Trade-off: replication latency and cost, which is what sets the distance you choose.",
"Backup frequency and encryption":"A ransomware-survivable backup needs BOTH: at least one OFFLINE or IMMUTABLE copy outside the production trust boundary, AND encryption at rest and in transit (a backup is a complete copy of the crown jewels). Remember 3-2-1: three copies, two media, one offsite.",
"Continuity of operations":"DISASTER RECOVERY = restoring the technology. CONTINUITY OF OPERATIONS = keeping essential BUSINESS FUNCTIONS running while the technology is down - who does what, from where, using which manual workaround. COOP is broader and business-facing.",
/* --- added: Domain 4 --- */
"Hardening ICS and RTOS":"For RTOS/ICS you CANNOT install agents, cannot auto-patch, cannot reboot freely. Hardening becomes: restrict network reachability, disable unused services and ports on the controller, enforce strict change windows. Any answer offering EDR, MDM, or auto-update on a PLC is wrong.",
"MDM capabilities":"MDM is the mobile ENFORCEMENT POINT: pushes configuration, verifies posture/compliance, controls which apps may install, and performs remote or SELECTIVE wipe (corporate data only, which is what makes BYOD workable).",
"Secure cookies":"Cookie flags: HttpOnly (script cannot read it - blocks XSS theft), Secure (never sent over plain HTTP), SameSite (mitigates CSRF). Long Expires and broad Domain scope INCREASE exposure - watch for those as distractors.",
"Sandboxing":"SANDBOXING = detonate/execute untrusted code in an isolated environment and observe behavior. It catches malware no signature covers. Contrast with STATIC analysis (inspects code without running it) and CODE SIGNING (proves origin).",
"Procurement security":"Security requirements belong at ACQUISITION AND PROCUREMENT - supported patch lifetime, security attestation, right to audit, exit/data return terms. Requirements added after deployment are expensive or impossible; before purchase they are free.",
"Asset classification":"INVENTORY tells you what exists. CLASSIFICATION tells you how much protection it needs, and therefore drives control level, monitoring depth, and disposal rigor. Without classification you either over-spend on everything or under-protect the critical few.",
"Certification of destruction":"Accountability for data does NOT transfer with the media. Keep a CERTIFICATE OF DESTRUCTION listing SERIAL NUMBERS, method, date, and responsible party - that serialized link between specific assets and a specific destruction event is what an auditor asks for.",
"Asset tracking through changes":"Untracked assets get NO baseline, NO patch schedule, NO owner, and are never wiped at offboarding. 'Devices in the EDR console but not in the inventory' is a classic finding - and untracked assets are frequently where a breach starts.",
"Threat intelligence sources":"Sources to name: VULNERABILITY SCANS, THREAT FEEDS, OSINT (public), PROPRIETARY/third-party feeds, ISACs (sector-specific PEER sharing), DARK WEB monitoring, PENETRATION TESTING, BUG BOUNTY, SYSTEM/PROCESS AUDIT. 'Peers in my industry' always means ISAC.",
"Responsible disclosure & bug bounty":"RESPONSIBLE DISCLOSURE = report privately, allow time to fix, then publish. BUG BOUNTY = the structured, incentivized PROGRAM that formalizes it and pays. Neither is a contracted penetration test, which is scoped by an SOW and rules of engagement.",
"Risk tolerance in remediation":"The same CVE gets different timelines at different organizations, and that is CORRECT. The drivers are RISK TOLERANCE, exposure (internet-facing?), organizational/industry impact, and regulatory obligation - not the scanner or the score.",
"Log aggregation and archiving":"Forwarding logs off-host in near real time IS a security control: once a host is compromised its local logs are under the attacker's control and get cleared. A copy outside their reach is what makes reconstruction possible. Pair with 'missing logs is an indicator'.",
"SNMP traps":"SNMP TRAP = device-INITIATED, unsolicited push when a condition occurs (fast). Polling = manager asks periodically (slower, predictable load). Use SNMPv3 - it is the first version with authentication AND privacy.",
"Monitoring infrastructure vs applications":"Three separate monitoring targets: SYSTEMS, APPLICATIONS, INFRASTRUCTURE. A host that is 'up' says nothing about whether the business TRANSACTION succeeds. Close that gap with application telemetry and synthetic transactions.",
"IDS signatures vs trends":"SIGNATURE/pattern based = accurate on known attacks, blind to novel ones. TREND/ANOMALY based = can find novel attacks, but more false positives and it depends on a baseline captured during a period that must itself have been clean.",
"Web filter approaches":"AGENT-BASED web filtering follows the device anywhere (the answer for remote/hybrid). CENTRALIZED PROXY only applies to traffic that reaches it, so remote devices are unprotected unless backhauled. Other pieces: URL scanning, content categorization, block rules, reputation.",
"File integrity monitoring":"FIM baselines cryptographic HASHES of critical binaries and configuration files and alerts on change outside an approved change record. It is a compliance staple and a reliable detector of persistence and tampering. Do not confuse with DLP (content leaving) or NAC (device admission).",
"Federation":"FEDERATION = a trust between two identity providers, so users authenticate at their HOME IdP and the other organization accepts the assertion. No duplicate accounts, and deprovisioning at the source removes access everywhere. SAML and OIDC are how it is implemented.",
"Attestation and access review":"ATTESTATION / access recertification = the RECURRING review where managers confirm each report's access is still appropriate. It exists to catch PRIVILEGE CREEP from role changes. Distinguish from identity proofing, which happens once, before the account exists.",
"Time-of-day restrictions":"TIME-OF-DAY RESTRICTIONS are a form of RULE-BASED access control: a condition evaluated regardless of who the user is. They shrink the window in which a stolen credential is usable. Group with location restrictions and other environmental conditions.",
"Passwordless and security keys":"FIDO2 / WebAuthn security keys are PHISHING-RESISTANT because the response is cryptographically bound to the true ORIGIN and the private key never leaves the device. They defeat credential phishing and replay. They do NOT address insider misuse, device theft, or DoS.",
"Resource provisioning automation":"Provisioning only through automated templates means every resource is built from a reviewed, known-good configuration, so DRIFT and one-off misconfiguration largely disappear. Manual console changes are where insecure defaults enter. Pair with guard rails and drift detection.",
"Ticket creation and escalation":"TICKET CREATION and ESCALATION are named automation use cases. Their security value: response times become MEASURABLE and an alert can no longer simply be missed because the on-call person was asleep.",
"Technical debt in automation":"Automation's downsides are examinable: COMPLEXITY, COST, SINGLE POINT OF FAILURE, TECHNICAL DEBT, ONGOING SUPPORTABILITY. Undocumented, unowned scripts holding production privileges are both operational fragility and a security exposure - nobody can review what they do.",
"Integrations and APIs":"A SOAR/orchestrator's integration credentials AGGREGATE high privilege across endpoint, identity, and cloud - making it one of the most privileged identities you own. Scope each integration to minimum actions, vault the credentials, rotate them, and monitor their use.",
"Eradication vs recovery":"ERADICATION removes the attacker's presence AND the root cause (persistence, backdoors, the exploited flaw). RECOVERY restores service with heightened monitoring to confirm it is genuinely clean. Restoring before eradicating simply reinfects - that ordering is the whole point.",
"Root cause analysis":"ROOT CAUSE ANALYSIS asks WHY the incident was POSSIBLE, not how it unfolded. The answer is nearly always a process or control gap (a decommissioning step that was skipped, an unowned asset). Fixing the cause prevents recurrence; fixing the symptom does not.",
"Legal hold":"A LEGAL HOLD suspends routine deletion and retention expiry for potentially relevant data once litigation is anticipated. Continuing to delete after a hold is SPOLIATION and carries legal consequences independent of the underlying case.",
"Tabletop vs simulation":"TABLETOP = discussion around a table, no systems touched, cheapest, validates plan and roles. SIMULATION = act the scenario out with real tooling. FAILOVER = actually move production. PARALLEL = run the alternate site alongside production. Increasing cost, risk, and assurance.",
"Firewall log interpretation":"BEACONING signature in logs: a REGULAR interval with a SMALL, UNIFORM byte count. Human browsing is irregular and variable in size. Legitimate update checks look similar, so confirm with destination reputation and process attribution on the host.",
"OS security log events":"Authentication outcomes live in the OS SECURITY log, with account name, LOGON TYPE, and source. Windows: 4624 = successful logon, 4625 = failed logon, 4720 = account created, 4672 = special privileges assigned. Firewall logs show connectivity, never which identity was used.",
"Endpoint logs":"PROCESS ANCESTRY (which parent launched which child) is host-level data only an ENDPOINT/EDR agent records. It is what distinguishes a user-launched program from one spawned by an exploited service or a malicious document macro.",
"Automated reports and dashboards":"Aggregation is what makes a dashboard readable AND what hides the detail. Dashboards are excellent for noticing something is wrong and insufficient for proving what happened - investigators always return to raw logs and packet captures.",
"Correlating across sources":"The investigation chain: NETWORK (firewall/NetFlow: internal IP + time) -> DHCP or DNS logs (IP to HOSTNAME at that moment) -> OS SECURITY log (host to USER). The DHCP/DNS step is the one people forget, and without it a dynamic IP identifies nothing.",
/* --- added: Domain 5 --- */
"Guidelines vs policy":"GUIDELINE = recommended, discretionary. POLICY/STANDARD = mandatory. The difference matters the moment an auditor asks why a control was not applied - 'the document only recommended it' is a valid answer for a guideline and not for a standard.",
"External governance considerations":"EXTERNAL considerations = regulatory, legal, industry, and geographic (local / regional / national / global) requirements you do not control. Multinationals normally resolve conflicting rules by designing to the STRICTEST applicable requirement.",
"Monitoring and revision of governance":"Governance is a LOOP: develop -> implement -> MONITOR -> REVISE. Every policy needs a named OWNER and a defined REVIEW CYCLE, or it silently stops matching reality and becomes unenforceable.",
"Qualitative vs quantitative analysis":"QUALITATIVE = High/Medium/Low on a matrix; fast, works without loss data, but subjective and NOT directly comparable to a control's cost. QUANTITATIVE = SLE/ARO/ALE in currency; needs asset valuation and frequency data, but can be set against a budget.",
"Residual and inherent risk":"INHERENT risk = exposure BEFORE controls. RESIDUAL risk = what REMAINS after treatment, and it is the figure the risk owner formally ACCEPTS. Residual risk above the threshold requires further treatment or a documented exception.",
"Risk reporting":"Board-level risk reporting speaks in BUSINESS terms: financial exposure, operational impact, trend direction, treatment status. CVE lists and SIEM alert counts belong in operational reporting - the board makes funding and acceptance decisions.",
"Supply chain analysis":"FOURTH-PARTY risk is real: your vendor's suppliers can compromise you. SUPPLY CHAIN ANALYSIS maps who supplies your vendor and where components are made, BEFORE the contract is signed. Distinguish from vendor monitoring, which is post-award.",
"Independent assessments":"Assurance ranking: INDEPENDENT THIRD-PARTY AUDIT > internal audit > self-assessment > vendor's own marketing claims. Also know SOC 2 TYPE I = design at a POINT IN TIME; TYPE II = operating effectiveness OVER A PERIOD. Type II is the stronger artifact.",
"NDA scope":"The NDA governs CONFIDENTIALITY of information exchanged and is usually the FIRST document signed, often before commercial terms are discussed. Do not confuse with the SLA (performance), SOW (the work), or BPA (partnership terms).",
"Automation in compliance monitoring":"Manual compliance checks give point-in-time snapshots with long blind intervals. AUTOMATED monitoring gives CONTINUOUS evidence of control operation, so drift is caught between audits instead of discovered during one.",
"Data inventory and retention":"A DATA INVENTORY (what personal data, where it lives, how long it is kept) is the PREREQUISITE for honoring subject access and erasure requests inside a regulatory deadline. You cannot produce or delete what you cannot find.",
"Controller obligations on breach":"On a breach at a PROCESSOR: the processor must notify the CONTROLLER without undue delay; the CONTROLLER notifies the supervisory authority and the data subjects. Accountability follows whoever determined the purpose and means - it is never outsourced.",
"Physical penetration testing":"PHYSICAL penetration testing evaluates barriers, badge processes, reception procedures, and staff behavior (tailgating, fake badges, pretexting at the desk). It requires WRITTEN AUTHORIZATION the tester carries at all times, scoped by the rules of engagement.",
"Audit committee role":"The AUDIT COMMITTEE exists to preserve INDEPENDENCE: internal audit reports to it rather than to the executives whose controls it examines. That reporting line is what stops findings from being suppressed.",
"Examinations vs assessments":"The distinction is AUTHORITY and CONSEQUENCE. A regulatory EXAMINATION can compel access and impose fines, sanctions, or licence conditions. A voluntary ASSESSMENT produces recommendations the organization may accept or decline.",
"Responding to reported messages":"Closing the loop is part of the control: if reports vanish without acknowledgment, the REPORTING RATE falls and you lose your earliest warning signal. The program must guarantee timely analysis AND feedback to the reporter.",
"Removable media and cables":"Weaponized CABLES exist - commercially available, visually identical to a normal charger, containing electronics that inject keystrokes or exfiltrate over radio. The rule is the same as for found USB drives: never connect hardware of unknown provenance.",
"Hybrid and remote work practices":"Remote-specific guidance covers what the office used to provide implicitly: securing the HOME NETWORK, screen and conversation privacy in public spaces, and secure handling and disposal of PRINTED material away from the office.",
/* --- round 3 additions --- */
"Corrective vs compensating":"COMPENSATING substitutes for a control you cannot apply yet. CORRECTIVE repairs the actual flaw. They often appear in sequence: WAF rule now (compensating), patch later (corrective). Compensating controls are meant to RETIRE once the primary control becomes possible - leaving them forever is a finding.",
"Physical sensor types":"Four sensor types: INFRARED detects heat (a body). PRESSURE detects weight on a surface. MICROWAVE and ULTRASONIC detect motion by reflected waves and are more prone to false triggers from air movement. Pick by what the stem says must or must not trigger it.",
"Authorization models":"Four-step sequence: IDENTIFICATION (claim) -> AUTHENTICATION (prove) -> AUTHORIZATION (what may you do) -> ACCOUNTING (what did you do). Any stem that says 'after successful login, the system decides what they can reach' is authorization.",
"Allow list updates after change":"Allow/deny lists are a named TECHNICAL IMPLICATION of change management, and they often live OUTSIDE your environment (partners, vendors, cloud security groups). Any change to IPs, hostnames, or certificates needs downstream allow lists identified during impact analysis.",
"Perfect forward secrecy":"PERFECT FORWARD SECRECY comes from EPHEMERAL key exchange - DHE or ECDHE - which generates and discards a fresh session key per connection. Result: stealing the server's long-term private key later does NOT decrypt previously captured traffic. Key length, pinning, and OCSP solve different problems.",
"Secure enclave":"SECURE ENCLAVE = isolated coprocessor region holding biometric templates and keys, unreadable by the main OS even when the OS is compromised. On-device. TPM = seals keys to platform boot state. HSM = enterprise-scale key operations in tamper-resistant hardware.",
"Steganography":"STEGANOGRAPHY hides the EXISTENCE of the message by concealing it inside an ordinary carrier (image, audio, video). That is why it defeats DLP looking for recognizable sensitive content. Contrast with encryption, which hides the MEANING but not the existence.",
"Self-signed vs third-party certificates":"Public CA certificates buy trust from parties who have no prior relationship with you. For INTERNAL services on MANAGED hosts, an internal CA gives full chain validation and revocation at no cost. Self-signed means no chain at all - fine for a lab, a warning everywhere else.",
"Resources and funding attribute":"FUNDING predicts capability and PATIENCE: custom tooling, purchased zero-days, infrastructure maintained for months. A low-funded actor must use what is free and move fast. Pair this with sophistication and internal/external to profile any actor in a stem.",
"Ethical motivation":"ETHICAL motivation = acting to improve security rather than profit or harm. Important nuance the exam draws: ethical INTENT does not make unauthorized testing LAWFUL. That gap is exactly why bug bounty programs and rules of engagement exist - they grant permission in advance.",
"Unsupported systems and applications":"UNSUPPORTED/end-of-life systems accumulate risk permanently: every CVE published after support ends is unfixable. The accepted answers are REPLACE, or ISOLATE with compensating controls plus a documented, dated exception. Antivirus never compensates for missing patches.",
"Brand impersonation vs typosquatting":"TYPOSQUATTING exploits the URL (misspelled or mistyped domain). BRAND IMPERSONATION copies the LOOK - logo, colors, layout - and can sit on a correctly spelled, unrelated domain. Read the stem for whether the deception is in the address bar or on the page.",
"Instant messaging vector":"The MESSAGE-BASED vector covers email, SMS, AND instant messaging/collaboration platforms equally. Internal chat tools are increasingly targeted precisely because users extend them more trust than email, and gateways often inspect them less.",
"Memory injection":"MEMORY INJECTION writes a payload into a running legitimate process's address space - FILELESS, so nothing hits disk and file scanning sees nothing. Detection requires behavioral monitoring and EDR process telemetry. Group with living-off-the-land techniques.",
"Firmware vulnerability":"FIRMWARE flaws (BIOS/UEFI, BMC/IPMI, device firmware) sit BELOW the operating system, so they survive reimaging and are invisible to host agents. Mitigation: isolate management interfaces on their own segment, verify firmware integrity, apply vendor firmware updates.",
"Hardware supply chain":"Supply chain splits into SERVICE provider, HARDWARE provider, and SOFTWARE provider. Firmware that does not match the vendor's published hash on arrival is hardware-provider tampering. Verifying hashes and signatures at receipt is the control.",
"Evil twin and deauthentication":"Classic wireless pair: DEAUTHENTICATION frames kick clients off the real AP, then an EVIL TWIN with the same SSID harvests the reconnection and credentials. WPA3's protected management frames defeat the deauth; 802.1X with certificate validation defeats the credential capture.",
"Request forgery":"CSRF rides the browser's automatic credential sending to make an authenticated user perform an action they did not intend. Fixes: ANTI-CSRF TOKEN (unguessable, per-request, attacker cannot read it) plus SameSite on the cookie. Distinguish from XSS, which executes attacker script in your origin.",
"Bloatware vs spyware":"BLOATWARE = unwanted PREINSTALLED software; a HARDENING problem (remove unnecessary software from the baseline), not an infection. SPYWARE covertly COLLECTS and exfiltrates. Same removal action, different category and different exam answer.",
"ACLs vs permissions":"Both are access control at different layers. NETWORK ACL on a router/firewall = may this packet pass (address, port, protocol). FILE PERMISSIONS = what may this authenticated identity do with this object (read, write, execute).",
"Patch management cadence":"Patch windows (for example 15 days critical, 30 days high) are defaults for the NORMAL case. CONFIRMED ACTIVE EXPLOITATION raises likelihood immediately and justifies the EMERGENCY CHANGE path. Knowing when to break your own SLA is the point of the question.",
"Hybrid cloud considerations":"Hybrid creates a SEAM. Identity, logging, segmentation, and policy work differently on each side and gaps open at the join. A dedicated circuit is still a network - encrypt it. The responsibility matrix still applies to the cloud half.",
"Embedded systems and RTOS":"RTOS trades flexibility for HARD TIMING GUARANTEES. Agents, scanning, and unscheduled reboots can break the determinism the device exists to provide. So the answer is always network-layer protection: isolation, reachability control, surface reduction.",
"Power and compute considerations":"POWER and COMPUTE are named architectural considerations. Constrained devices (battery sensors, embedded controllers, IoT) often cannot run encryption or telemetry agents at all. Protect them at the network layer instead of the host.",
"UTM vs NGFW":"UTM = CONSOLIDATION: many functions (firewall, IPS, AV, web filter, VPN) in one box, aimed at smaller environments. NGFW = CAPABILITY: application identification, user identity, and TLS inspection built into firewall policy. Overlapping but different selling points.",
"SD-WAN":"SD-WAN abstracts the TRANSPORT so branches use any available link (broadband, LTE, MPLS) while routing and encryption are managed CENTRALLY. It is the networking half of SASE; add cloud-delivered security services and you have SASE.",
"Sensor and collector placement":"If the stem says inspection must NOT risk interrupting traffic, every inline answer is wrong. Use a PASSIVE SENSOR on a TAP or SPAN port - and place it where the traffic actually flows (east-west traffic never reaches the internet edge).",
"Restricted vs confidential":"Tier NAMES and their order vary by organization - the exam knows this. What is constant: the HIGHEST tier narrows access to named individuals with demonstrated need, and classification drives handling, storage, transmission, and disposal rules.",
"Data segmentation":"SEGMENTATION applied to data keeps one tenant, business unit, or environment from reaching another's records even in a shared system. Failures of multi-tenant data segmentation are a recognized CLOUD-SPECIFIC vulnerability.",
"Legal and financial information":"LEGAL INFORMATION is a named data type, distinct because attorney-client PRIVILEGE can be WAIVED by careless disclosure - a loss you cannot undo. Legal hold obligations frequently attach to it. Financial information is governed separately by accounting and regulatory regimes.",
"Journaling and replication":"JOURNALING / transaction logging records each change so you can replay to ANY POINT IN TIME between backups - this is what satisfies a tight RPO. REPLICATION protects against site loss but faithfully copies corruption and deletion, so it is not a backup.",
"Multi-cloud resilience":"MULTI-CLOUD is platform diversity at the PROVIDER level: protects against a provider-wide outage, account compromise, and lock-in. Real cost: two control planes, two IAM models, two sets of expertise. It never removes shared responsibility or the need for backups.",
"Static code analysis":"SAST reads code AT REST - finds flaws early and cheaply, but cannot tell whether a path is ever reachable, so expect FALSE POSITIVES. Pair with DAST (running app, finds runtime and config issues) and SCA/package monitoring (third-party dependencies).",
"Bluetooth connection risks":"Bluetooth is a named CONNECTION METHOD and its risk comes from PAIRING and DISCOVERABILITY. Controls: disable when not needed, block discoverable mode, control pairing - all via MDM policy. Disk encryption and host firewalls do not touch this vector.",
"RADIUS in wireless":"WPA3-ENTERPRISE = 802.1X + RADIUS: per-user/per-device authentication, individual revocation, and RADIUS-returned attributes like VLAN assignment. Frame encryption comes from the WPA3 cipher suite, NOT from RADIUS. WPA3-Personal uses SAE and a passphrase instead.",
"Retention vs legal hold conflict":"LEGAL HOLD ALWAYS BEATS the retention schedule. Deleting data under hold is SPOLIATION, with sanctions independent of the underlying case. The hold persists until counsel formally releases it - not until the retention clock expires.",
"Cloud asset enumeration":"Cloud resources appear faster than manual inventory can track them, so enumeration must be AUTOMATED and ENFORCED AT CREATION. A tag policy that refuses to provision untagged resources is a GUARD RAIL: it makes an untracked asset impossible rather than merely discouraged.",
"Dark web monitoring":"DARK WEB MONITORING is a named threat intelligence source. Credentials for sale imply a PRIOR compromise, so respond in both directions: forward (reset passwords, enforce MFA) and backward (hunt for existing unauthorized use of those credentials).",
"System and process audit":"A SCAN finds missing patches. An AUDIT finds that the PROCESS meant to prevent them is not working. System and process audit is a listed identification method and catches a different class of problem from any scanner.",
"Benchmarks":"BENCHMARKS (CIS Benchmarks, DISA STIGs) are prescriptive hardening standards. Expressed as SCAP content, different vendors' tools evaluate a system against IDENTICAL criteria - which is what makes compliance measurable instead of a matter of opinion.",
"Log archiving":"Dwell time regularly EXCEEDS active SIEM retention, so the evidence an investigation needs predates the alert that started it. Archiving keeps that history affordably. Legal and regulatory retention periods usually set the minimum duration.",
"Screened subnet design":"Screened subnet rule pattern to memorize: internet -> web server on the PUBLISHED PORT ONLY; web server -> database on the SINGLE required port; internet -> database DENIED; database -> internet DENIED. The point is that a web compromise must not become internal access.",
"Email gateway controls":"DELAYED WEAPONIZATION (link benign at delivery, malicious an hour later) defeats delivery-time inspection by design. TIME-OF-CLICK URL REWRITING evaluates the destination when the user actually clicks. Attachment sandboxing does not close this window.",
"Group policy enforcement":"GROUP POLICY is CONFIGURATION ENFORCEMENT: it REAPPLIES settings on a refresh interval, so a local admin's change gets reverted. A one-time imaging script is configuration that then drifts; documentation and scanning find drift without fixing it.",
"Biometric error rates":"FAR = false acceptance (impostor admitted - the security failure). FRR = false rejection (legitimate user denied - the usability failure). CER = crossover error rate, where FAR equals FRR; LOWER CER means a better system. Tightening sensitivity lowers FAR and raises FRR.",
"Hard vs soft tokens":"Both are SOMETHING YOU HAVE. HARD token = separate physical device, so malware on the phone or laptop cannot reach its secret. SOFT token = app on a general-purpose device: cheaper and instant to deploy, but shares fate with that device.",
"Permission assignment implications":"Assigning permissions to INDIVIDUAL accounts does not scale: nobody can answer 'who has access to what', so access reviews become guesswork and PRIVILEGE CREEP goes undetected. Group/role-based assignment is the prerequisite for meaningful attestation.",
"Security group automation":"Driving group membership from the HR system of record enforces the SAME baseline for every joiner, mover, and leaver. It reduces but does NOT remove the need for periodic attestation, because the role-to-group mapping rules can themselves be wrong.",
"Preparation phase":"PREPARATION is everything done BEFORE an incident: the plan, playbooks, training, tooling, contact lists, retainers, and log collection. It determines how well every later phase goes, and LESSONS LEARNED feeds directly back into it, closing the loop.",
"IDS logs vs network logs":"IDS/IPS logs carry the DETECTION VERDICT: signature ID, classification, severity, action taken. NETWORK/flow logs record that a conversation happened with no detection logic at all. Match the log to the question being asked.",
"BCP vs DRP policy":"BUSINESS CONTINUITY = keeping essential BUSINESS FUNCTIONS operating (people, processes, facilities, manual workarounds). DISASTER RECOVERY = restoring IT SYSTEMS AND DATA. Continuity is the broader document; disaster recovery is the technology subset inside it.",
"Boards vs committees":"BOARDS hold ultimate accountability and set risk appetite; COMMITTEES (audit, risk) do detailed oversight and report upward. Do not confuse either with the CHANGE ADVISORY BOARD, which is an operational body for approving changes, not a governance structure.",
"Control cost versus ALE":"The test: does (ALE before - ALE after) EXCEED the annual cost of the control? If the control costs more than the loss it prevents, it fails on financial grounds. Always add the qualifier: regulatory mandate, safety, or reputation can still justify it.",
"Key risk indicators":"KRI = FORWARD-looking early warning with a defined THRESHOLD that triggers escalation to the risk owner (percentage of endpoints past the patch window). KPI = measures how well an activity PERFORMS (mean time to patch). Both live in the risk register's orbit.",
"Vendor questionnaires":"QUESTIONNAIRES are SELF-REPORTED and UNVERIFIED - the weakest assurance artifact, but cheap and scalable. Escalate with independent assessments (SOC 2 Type II) or a right-to-audit clause wherever the risk justifies the cost.",
"Vendor penetration testing rights":"You generally may NOT test a SaaS provider's shared infrastructure without WRITTEN AUTHORIZATION and agreed RULES OF ENGAGEMENT - other tenants are affected. Many providers prohibit it outright and supply their own third-party test attestations instead.",
"Contractual impacts":"Consequences of non-compliance: FINES and SANCTIONS (regulator), REPUTATIONAL DAMAGE, LOSS OF LICENCE (regulator only), and CONTRACTUAL IMPACTS (counterparty - penalties, remediation obligations, termination). For non-regulated firms the contractual route is often the fastest and costliest.",
"Self-assessment":"SELF-ASSESSMENT: cheapest, broadest, LEAST assurance, because assessor and assessed are the same party. Its real value is preparing for a genuine audit. Assurance ladder: independent third-party audit > internal audit > self-assessment > vendor questionnaire.",
"Attestation":"ATTESTATION = the formal signed statement about whether controls met stated criteria - what customers and regulators actually rely on. Careful: in IAM the same word means the recurring review confirming access is still appropriate. Read the context to pick the meaning.",
"Situational awareness":"SITUATIONAL AWARENESS = noticing that a request, environment, or circumstance does not fit, and VERIFYING BEFORE ACTING. It is the specific defence against urgency-based social engineering, which works by making the target act before thinking.",
