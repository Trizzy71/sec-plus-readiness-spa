{d:4,o:"4.2",t:"Enumeration & inventory",df:2,q:"An incident response is delayed because responders cannot determine which business unit owns a compromised host or what data it processes. Which asset management activity would have prevented this?",a:["An accurate inventory with owners and classification","Increasing the vulnerability scan frequency","Extending log retention to two full years","Adding a second EDR vendor for coverage"],c:0,e:"Response speed depends on knowing what an asset is, who owns it, and what it holds. Enumeration and inventory with classification attributes are the prerequisite for prioritizing containment."},
{d:4,o:"4.2",t:"Data retention",df:2,q:"A retention policy requires customer records be kept for seven years and then deleted. What is the security rationale for the deletion half of the policy?",a:["Data that no longer exists cannot be breached, so retention limits reduce exposure","Deletion improves the accuracy of vulnerability scans","Regulators require all data be deleted after seven years regardless of type","Deletion is required to maintain the asset inventory"],c:0,e:"Minimizing retained data directly reduces the impact of a future breach and supports privacy requirements such as storage limitation. Retention periods are set by legal and business need, not a universal figure."},
{d:4,o:"4.3",t:"CVSS vs CVE",df:2,q:"Which statement correctly distinguishes CVE from CVSS?",a:["CVE identifies a specific vulnerability; CVSS scores its severity","CVE scores severity from 0.0 to 10.0; CVSS assigns the identifier","Both are identifiers maintained by the same registry for different products","CVE applies to software and CVSS applies to hardware"],c:0,e:"A CVE ID names the vulnerability so everyone refers to the same thing; CVSS produces a base, temporal, and environmental score describing how severe it is in context."},
{d:4,o:"4.3",t:"False positives",df:2,q:"A scanner reports a critical vulnerability on a server, but manual verification shows the affected module is not installed. What has occurred, and what is the correct action?",a:["A false positive; confirm, document, and tune the scan template","A false negative; increase the scanner's sensitivity","A true positive; patch the host immediately","An exemption; escalate to the risk committee"],c:0,e:"A false positive is an alert for a condition that does not exist. Confirming and tuning prevents wasted remediation effort and keeps analysts responsive to real findings. False negatives are the more dangerous error but are not what happened here."},
{d:4,o:"4.3",t:"Prioritization inputs",df:3,q:"Two findings both carry a CVSS base score of 9.8. Finding A is on an internet-facing payment server; Finding B is on an isolated lab host with no sensitive data. Which factors justify prioritizing A?",a:["Environmental variables and organizational impact","The publication date of the CVE record","The base score alone, which is identical","The vendor's patch release cadence"],c:0,e:"Base scores describe the flaw in the abstract. Environmental variables, exposure factor, and business impact translate that into real risk, which is why identical scores routinely receive very different priorities."},
{d:4,o:"4.3",t:"SAST vs DAST",df:3,q:"Which analysis technique examines an application's source code for flaws without executing it?",a:["Static application security testing","Dynamic application security testing","Interactive fuzzing of the running application","Package monitoring of third-party dependencies"],c:0,e:"SAST analyzes source or bytecode at rest and can find flaws early, though with more false positives. DAST tests the running application from the outside and finds runtime and configuration issues SAST cannot see."},
{d:4,o:"4.3",t:"Package monitoring",df:2,q:"A build pipeline flags that a third-party library in the dependency tree has a newly published critical CVE. Which vulnerability identification method produced this?",a:["Package monitoring of software composition","A dynamic scan of the production endpoint","A physical penetration test","A dark web threat feed"],c:0,e:"Package monitoring (software composition analysis) tracks direct and transitive dependencies against vulnerability databases, catching risk in code the organization did not write."},
{d:4,o:"4.3",t:"Exceptions & exemptions",df:3,q:"A critical patch cannot be applied because it breaks a certified manufacturing application. What is the correct vulnerability management response?",a:["Document a formal exception with compensating controls","Mark the finding as a false positive and close it","Remove the host from the scan scope permanently","Apply the patch and accept the production outage without approval"],c:0,e:"An exception formally records the accepted risk, the compensating controls, the accountable owner, and an expiry so it is revisited. Suppressing the finding hides real risk from the register."},
{d:4,o:"4.3",t:"Validation of remediation",df:1,q:"After patching, which step confirms that a vulnerability has actually been remediated?",a:["Rescanning the asset to confirm the finding is gone","Closing the ticket once the patch job reports success","Updating the risk register entry","Notifying the asset owner by email"],c:0,e:"Validation requires independent confirmation through rescanning, audit, or verification. Deployment tools frequently report success on patches that did not fully apply or that require a pending reboot."},
{d:4,o:"4.4",t:"SIEM correlation",df:2,q:"What is the PRIMARY function of a SIEM beyond simple log storage?",a:["Correlating events from many sources into prioritized alerts","Encrypting log data at rest on the collector","Replacing endpoint detection and response agents","Automatically patching the systems that generate alerts"],c:0,e:"Aggregation is the input; correlation across sources and time is the value, turning individually unremarkable events into a detection. Response actions require SOAR or EDR."},
{d:4,o:"4.4",t:"Alert tuning",df:3,q:"Analysts are dismissing 94% of alerts from one rule as benign, and real detections are being missed in the noise. What is the correct response?",a:["Tune the rule and add exclusions for verified benign patterns","Disable the rule entirely to reduce analyst workload","Increase the SIEM's log retention period","Route the alerts to a low-priority queue and stop reviewing them"],c:0,e:"Alert tuning preserves detection capability while removing known-benign noise. Disabling the rule or ignoring the queue creates a blind spot, which is worse than the noise."},
{d:4,o:"4.4",t:"SCAP & benchmarks",df:2,q:"Which standard allows security configuration and vulnerability content to be expressed in a machine-readable format so different tools can automate compliance checks consistently?",a:["Security Content Automation Protocol","Simple Network Management Protocol","NetFlow","Syslog"],c:0,e:"SCAP standardizes the expression of checklists and vulnerability data so scanners from different vendors evaluate systems against the same benchmark content in the same way."},
{d:4,o:"4.4",t:"NetFlow",df:2,q:"An analyst needs to identify which internal hosts communicated with a known malicious IP over the past 30 days, without the storage cost of full packet capture. Which data source fits?",a:["NetFlow records","Full packet capture","Antivirus quarantine logs","SNMP trap history"],c:0,e:"Flow data records conversation metadata such as source, destination, ports, bytes, and time, which is compact enough for long retention. Full packet capture holds content but is rarely retained for a month at scale."},
{d:4,o:"4.4",t:"DLP",df:2,q:"Which tool inspects outbound content for patterns such as card numbers or classified markings and blocks the transfer?",a:["Data loss prevention","Network access control","File integrity monitoring","Vulnerability scanner"],c:0,e:"DLP identifies sensitive content in motion, at rest, or in use, and enforces policy such as block, quarantine, or encrypt. NAC controls device admission, and FIM watches for unauthorized file changes."},
{d:4,o:"4.4",t:"Agent vs agentless monitoring",df:2,q:"Which is a disadvantage of agent-based monitoring compared with agentless?",a:["Agents consume host resources and must be deployed and updated","Agents cannot collect data when the host is offline from the corporate network","Agents cannot report any process-level detail","Agents require credentials for every single scan"],c:0,e:"Agents add deployment, maintenance, and attack surface on every host. Their advantage is continuous, deep, host-local visibility including while off-network; agentless scanning is the approach that requires reachability and credentials."},
{d:4,o:"4.4",t:"Quarantine",df:1,q:"An EDR platform detects a malicious binary and isolates the host's network connectivity while preserving it for analysis. Which alert response activity is this?",a:["Quarantine","Archiving","Alert tuning","Reporting"],c:0,e:"Quarantine contains the threat by restricting the affected host or file while retaining it for investigation, rather than deleting evidence outright."},
{d:4,o:"4.5",t:"SPF, DKIM, DMARC",df:3,q:"An organization publishes SPF and DKIM records but still sees its domain used in spoofed mail. Which addition tells receiving servers what to do with failures and where to send reports?",a:["DMARC","A second SPF record with more includes","An MX record pointing to the security gateway","A DNSSEC signature on the zone"],c:0,e:"DMARC binds SPF and DKIM to the visible From domain (alignment), publishes a policy of none, quarantine, or reject, and provides aggregate and forensic reporting. Publishing two SPF records is invalid and breaks evaluation."},
{d:4,o:"4.5",t:"DNS filtering",df:2,q:"Which control blocks a workstation from resolving a newly registered command-and-control domain, stopping the callback before any connection is attempted?",a:["DNS filtering with reputation and category feeds","A host-based firewall egress rule by IP address","File integrity monitoring on the workstation","A network access control posture check"],c:0,e:"DNS filtering intercepts resolution and denies known-bad or newly registered domains, which works even when the destination IP changes rapidly. IP-based rules struggle against fast-flux infrastructure."},
{d:4,o:"4.5",t:"NAC",df:2,q:"Which technology evaluates a device's patch level, antivirus status, and configuration before permitting it onto the production network?",a:["Network access control with posture assessment","Web application firewall","Security information and event management","Data loss prevention"],c:0,e:"NAC gates admission based on identity and posture, typically quarantining noncompliant devices to a remediation VLAN until they meet policy."},
{d:4,o:"4.5",t:"EDR vs XDR",df:3,q:"How does XDR differ from EDR?",a:["XDR correlates across many telemetry sources; EDR is endpoint only","XDR is agentless while EDR always requires an agent","EDR performs correlation while XDR only collects","XDR replaces the need for a SIEM in all environments"],c:0,e:"XDR extends detection and response across multiple telemetry domains for cross-surface correlation. It overlaps with SIEM but is typically vendor-integrated rather than a general log platform."},
{d:4,o:"4.5",t:"UBA",df:2,q:"A finance user who normally accesses 20 records a day suddenly queries 40,000 at 03:00. Which capability is designed to flag this?",a:["User behavior analytics against a baseline","Signature-based intrusion detection","File integrity monitoring on servers","A stateful packet filter at the edge"],c:0,e:"UBA builds behavioral baselines per user and entity and alerts on deviation, catching credential misuse and insider activity that violates no signature."},
{d:4,o:"4.5",t:"Group Policy vs SELinux",df:2,q:"Which pair correctly matches an OS hardening mechanism to its platform?",a:["Group Policy for Windows; SELinux for Linux","SELinux for Windows; Group Policy for Linux","Group Policy for both Windows and Linux","SELinux for macOS; Group Policy for Linux"],c:0,e:"Group Policy centrally enforces configuration on Windows domain members. SELinux enforces mandatory access control policy on Linux, confining processes regardless of the file permissions."},
{d:4,o:"4.5",t:"Secure protocol selection",df:3,q:"An organization is replacing legacy management protocols. Which set of substitutions is correct?",a:["SSH for Telnet, SFTP or FTPS for FTP, SNMPv3 for SNMPv1/v2c, LDAPS for LDAP","Telnet for SSH, FTP for SFTP, SNMPv2c for SNMPv3, LDAP for LDAPS","SSH for HTTPS, TFTP for SFTP, SNMPv1 for SNMPv3, Kerberos for LDAPS","RDP for SSH, HTTP for HTTPS, SMTP for SMTPS, NTP for LDAPS"],c:0,e:"Each replacement adds authentication and encryption to a cleartext predecessor. SNMPv3 is the first version to provide authentication and privacy; v2c still transmits community strings in the clear."},
{d:4,o:"4.5",t:"Screened subnet rules",df:3,q:"A firewall ruleset ends with an explicit 'deny any any' with logging. Why is this considered a best practice even when the platform has an implicit deny?",a:["It makes the denial explicit and logs the denied traffic","It improves throughput by shortening the rule evaluation path","It allows the implicit rules above it to be removed","It is required for stateful inspection to function"],c:0,e:"An explicit terminal deny with logging gives visibility into what is being blocked, which supports troubleshooting and detection. Implicit denies are usually silent."},
{d:4,o:"4.6",t:"SAML vs OAuth",df:3,q:"Which statement correctly distinguishes SAML from OAuth 2.0?",a:["SAML authenticates for SSO; OAuth 2.0 delegates authorization","OAuth 2.0 is an authentication protocol and SAML handles authorization only","Both use JSON web tokens exclusively for all flows","SAML is used only for mobile applications and APIs"],c:0,e:"SAML carries authentication assertions between an identity provider and service provider. OAuth 2.0 delegates access to resources without sharing credentials; OpenID Connect is the authentication layer built on top of it."},
{d:4,o:"4.6",t:"Access control models",df:3,q:"A cloud policy grants access only when the user is in the Finance department, the device is compliant, and the request originates from a corporate IP range. Which access control model is this?",a:["Attribute-based access control","Role-based access control","Discretionary access control","Mandatory access control"],c:0,e:"ABAC evaluates multiple attributes of subject, object, and environment at request time. RBAC decides on role membership alone and cannot express device posture or network conditions."},
{d:4,o:"4.6",t:"Mandatory access control",df:2,q:"In which access control model does a system-enforced label determine access, with no ability for the data owner to grant permissions to others?",a:["Mandatory access control","Discretionary access control","Role-based access control","Rule-based access control"],c:0,e:"MAC enforces labels and clearances centrally; owners cannot override them. DAC is the opposite, letting the owner set permissions at their discretion."},
{d:4,o:"4.6",t:"MFA factors",df:3,q:"A user logs in with a password and a fingerprint on the same enrolled phone. Which statement is correct?",a:["This is multifactor: something you know plus something you are","This is single-factor because both are entered on one device","This is multifactor: something you have plus somewhere you are","This is single-factor because biometrics are not a valid factor"],c:0,e:"Factor categories are what matters, not the number of devices: a password is something you know, and a fingerprint is something you are. Two passwords, or a password and a security question, would be single-factor."},
{d:4,o:"4.6",t:"Just-in-time PAM",df:3,q:"Which privileged access management capability grants an administrator elevated rights only for an approved window and revokes them automatically afterward?",a:["Just-in-time permissions","Password vaulting","Federation","Identity proofing"],c:0,e:"Just-in-time elevation eliminates standing privilege, shrinking the window in which a compromised admin account is useful. Vaulting protects stored credentials but leaves the account permanently privileged."},
{d:4,o:"4.6",t:"Ephemeral credentials",df:2,q:"A CI/CD pipeline needs to deploy to a cloud account. Which credential approach is MOST secure?",a:["Short-lived, automatically rotated credentials issued per run via a workload identity","A long-lived access key stored as an encrypted pipeline variable","A shared administrator password stored in the team's password manager","A service account with a 180-day password rotation policy"],c:0,e:"Ephemeral credentials minimize the value and lifetime of anything an attacker can steal from the pipeline. Long-lived keys and shared passwords remain valid long after any compromise."},
{d:4,o:"4.6",t:"Deprovisioning",df:2,q:"Which offboarding failure is MOST likely to be exploited by a departing employee?",a:["Accounts and tokens that remain active after termination","An asset inventory that lists the wrong laptop model","A missing exit interview record in the file","An expired NDA in the personnel file"],c:0,e:"Timely deprovisioning of every account, token, VPN profile, and SaaS entitlement is the control that closes the window. Automated joiner-mover-leaver workflows tied to HR events are how this is enforced at scale."},
{d:4,o:"4.6",t:"Password policy",df:3,q:"Current NIST-aligned guidance favors which password policy change?",a:["Increase minimum length and screen against breached passwords","Force expiration every 30 days and require four character classes","Require security questions in addition to the password","Prohibit password managers to avoid a single point of failure"],c:0,e:"Length and breach screening improve resistance more than composition rules, and forced rotation drives predictable patterns. Rotation is still appropriate when compromise is known or suspected."},
{d:4,o:"4.6",t:"Identity proofing",df:2,q:"Before issuing credentials to a new remote employee, the organization validates a government ID against a liveness-checked selfie. Which IAM activity is this?",a:["Identity proofing","Attestation","Federation","Authorization"],c:0,e:"Identity proofing establishes that the person is who they claim to be before an account exists. Attestation is the periodic review confirming existing access is still appropriate."},
{d:4,o:"4.7",t:"Guard rails",df:2,q:"An automation policy prevents any cloud storage bucket from being created with public read access, regardless of who requests it. What is this called?",a:["A guard rail","A ticket escalation","A workforce multiplier","Continuous integration"],c:0,e:"Guard rails are automated policy constraints that make insecure configurations impossible rather than merely discouraged, enforcing the baseline at provisioning time."},
{d:4,o:"4.7",t:"Automation benefits",df:2,q:"Which benefit of automation and orchestration MOST directly reduces the time between detection and containment?",a:["Faster reaction time through automated playbook execution","Employee retention through reduced repetitive work","Lower licensing cost","Simplified vendor management"],c:0,e:"Automated response executes containment steps in seconds without waiting for an analyst. Retention and cost are genuine benefits but do not act on the detection-to-containment interval."},
{d:4,o:"4.7",t:"Automation risks",df:3,q:"Which is a legitimate risk of heavily automating security operations?",a:["A flawed playbook executes the damage at scale","Automation always increases the number of analysts required","Automated processes cannot be logged or audited","Automation prevents the use of standard baselines"],c:0,e:"Automation amplifies both correct and incorrect logic, and a compromised orchestrator holds broad privilege across the estate. Complexity, cost, technical debt, and ongoing supportability are the other standard considerations."},
{d:4,o:"4.7",t:"User provisioning automation",df:2,q:"Which security outcome results from automating user provisioning from the HR system of record?",a:["Access is granted and revoked consistently by role","Multifactor authentication becomes unnecessary","Password complexity requirements can be relaxed","Privileged accounts no longer require review"],c:0,e:"Automated joiner-mover-leaver flows enforce the same rules every time and remove the human error that leaves orphaned or over-provisioned accounts behind."},
{d:4,o:"4.8",t:"IR phase ordering",df:2,q:"Place the incident response phases in the correct order.",a:["Preparation, detection, analysis, containment, eradication, recovery, lessons learned","Detection, preparation, containment, analysis, recovery, eradication, lessons learned","Preparation, containment, detection, eradication, analysis, recovery, lessons learned","Analysis, detection, preparation, containment, recovery, eradication, lessons learned"],c:0,e:"Containment stops the spread, eradication removes the attacker's presence and root cause, and recovery restores normal operations with validation. Lessons learned feeds back into preparation."},
{d:4,o:"4.8",t:"Containment decision",df:3,q:"Malware is spreading laterally through a production network. Leadership must choose between immediately isolating the affected segment and continuing to observe the attacker. Which consideration argues for immediate isolation?",a:["Continued spread will outpace the value of more intelligence","Isolation preserves volatile memory evidence better than observation","Observation is prohibited by the incident response plan","Isolation removes the need for eradication"],c:0,e:"Containment timing balances damage limitation against intelligence gathering. Active lateral movement means the cost of waiting compounds, so containment wins; note that isolation can also destroy volatile evidence, which is why memory acquisition happens first when feasible."},
{d:4,o:"4.8",t:"Chain of custody",df:2,q:"Which forensic practice documents every person who handled evidence, when, and for what purpose, so it remains admissible?",a:["Chain of custody","Legal hold","E-discovery","Root cause analysis"],c:0,e:"Chain of custody is the unbroken, documented record of possession and handling. A legal hold is the instruction to preserve data once litigation is anticipated."},
{d:4,o:"4.8",t:"Order of volatility",df:3,q:"During evidence acquisition on a running compromised server, which data should be collected FIRST?",a:["CPU cache and RAM, including running processes","The full disk image on the host","Archived syslog data on the central collector","Backup tapes stored at the offsite vault"],c:0,e:"Order of volatility dictates collecting the most perishable data first. Memory disappears at power-off, while disk images and centralized logs persist and can be acquired afterward."},
{d:4,o:"4.8",t:"Threat hunting",df:2,q:"How does threat hunting differ from alert triage?",a:["Hunting searches proactively rather than reacting to alerts","Hunting is performed only after an incident is confirmed","Hunting relies exclusively on signature matching","Hunting is a synonym for vulnerability scanning"],c:0,e:"Hunting assumes existing detections may have missed something and tests hypotheses against telemetry. It is proactive and iterative, and successful hunts become new detection rules."},
{d:4,o:"4.9",t:"Log source selection",df:3,q:"An investigator must determine whether a specific internal host established an outbound TLS session to a suspicious IP at 14:22, including how many bytes were transferred. Which data source is MOST appropriate?",a:["Firewall or NetFlow session records","Windows Security event log 4624 entries","Application error logs on the web server","The vulnerability scan report for that host"],c:0,e:"Session records capture source, destination, ports, timestamps, and byte counts for the connection. Authentication logs show logons, not egress sessions, and application error logs show neither."},
{d:4,o:"4.9",t:"Metadata",df:2,q:"An analyst needs to determine when a suspicious document was created, by which account, and with what software, without reading its contents. Which data supports this?",a:["File metadata","Packet capture of the download","The endpoint's antivirus log","The firewall's deny log"],c:0,e:"Metadata carries authorship, timestamps, application version, and revision history. Email metadata (headers) serves the same investigative role for message routing."},
{d:4,o:"4.9",t:"Packet capture",df:2,q:"Which data source provides the actual content of an unencrypted network conversation for investigation?",a:["Full packet capture","NetFlow records","SNMP traps","A dashboard summarizing alert volume"],c:0,e:"Full packet capture stores payloads, allowing content reconstruction, at high storage cost. Flow data records the conversation's metadata but never its contents."},
/* ---- DOMAIN 5: Security Program Management and Oversight (20%) ---- */
{d:5,o:"5.1",t:"Policy vs standard vs procedure",df:3,q:"Which document states 'passwords must be at least 14 characters and screened against a breach corpus'?",a:["A standard","A policy","A procedure","A guideline"],c:0,e:"A policy states intent and requirement at a high level ('access must be authenticated'). A standard specifies the mandatory measurable detail. A procedure gives step-by-step instructions, and a guideline is recommended but optional."},
{d:5,o:"5.1",t:"Data roles",df:3,q:"Under privacy regulation, an organization determines why and how personal data is processed and engages a cloud vendor to perform the processing. Which roles apply?",a:["The organization is the data controller; the vendor is the data processor","The organization is the data processor; the vendor is the controller","Both are joint custodians with no controller","The vendor is the data owner and the organization is the steward"],c:0,e:"The controller decides purpose and means and carries primary accountability; the processor acts on the controller's documented instructions. This distinction drives contractual and breach-notification obligations."},
{d:5,o:"5.1",t:"Custodian vs owner",df:2,q:"A database administrator applies the access rights that the finance director has approved for a payroll system. Which roles do they hold?",a:["The DBA is the custodian/steward; the finance director is the data owner","The DBA is the data owner; the finance director is the custodian","Both are data processors","The DBA is the controller; the finance director is the steward"],c:0,e:"The owner makes classification and access decisions and is accountable; the custodian or steward implements and maintains the controls on the owner's behalf."},
{d:5,o:"5.1",t:"AUP",df:1,q:"Which policy defines what employees may and may not do with company systems, networks, and data?",a:["Acceptable use policy","Business continuity policy","Incident response policy","Software development lifecycle policy"],c:0,e:"The AUP sets the boundaries of permitted use and is normally acknowledged at onboarding, giving the organization a documented basis for enforcement."},
{d:5,o:"5.1",t:"Governance structures",df:2,q:"A multinational allows each regional business unit to set its own security standards above a corporate minimum. Which governance structure is this?",a:["Decentralized governance","Centralized governance","A regulatory examination model","A board-only structure with no committees"],c:0,e:"Decentralized governance pushes decision rights to business units, gaining local responsiveness at the cost of consistency. Centralized governance sets one standard for the whole organization."},
{d:5,o:"5.1",t:"Playbooks",df:2,q:"Which document gives responders the specific, ordered steps to take for a particular incident type such as a ransomware detection?",a:["A playbook","A policy","A standard","A guideline"],c:0,e:"Playbooks operationalize the incident response policy into repeatable per-scenario steps, which is what makes automated orchestration possible."},
{d:5,o:"5.2",t:"SLE, ARO, ALE",df:3,q:"An asset is valued at $400,000. A flood would destroy 25% of it, and the area floods once every 20 years. What is the ALE?",a:["$5,000","$100,000","$20,000","$2,000,000"],c:0,e:"SLE = asset value x exposure factor = $400,000 x 0.25 = $100,000. ARO = 1/20 = 0.05. ALE = SLE x ARO = $100,000 x 0.05 = $5,000, which is the maximum a rational annual control spend would approach."},
{d:5,o:"5.2",t:"Exposure factor",df:2,q:"In quantitative risk analysis, what does the exposure factor represent?",a:["The percentage of an asset's value lost in a single realized risk event","The number of times per year the event is expected to occur","The total annual loss expected from the risk","The organization's tolerance for that category of risk"],c:0,e:"EF is the proportional loss per occurrence, expressed as a percentage. Multiplied by asset value it yields SLE, and multiplied again by ARO it yields ALE."},
{d:5,o:"5.2",t:"Risk strategies",df:3,q:"An organization discontinues a product line entirely because the regulatory risk cannot be reduced to an acceptable level. Which risk management strategy is this?",a:["Avoidance","Mitigation","Transference","Acceptance"],c:0,e:"Avoidance eliminates the activity that produces the risk. Mitigation reduces likelihood or impact, transference shifts loss to another party, and acceptance leaves it as-is with documented approval."},
{d:5,o:"5.2",t:"Risk appetite",df:2,q:"A startup deliberately pursues opportunities with high uncertainty to gain market share quickly. How is its risk appetite characterized?",a:["Expansionary","Conservative","Neutral","Non-existent"],c:0,e:"Appetite describes the amount of risk an organization is willing to pursue in service of its objectives: expansionary, neutral, or conservative. Tolerance is the acceptable variation around a specific risk."},
{d:5,o:"5.2",t:"Risk register contents",df:2,q:"Which elements belong in a risk register?",a:["Description, owner, likelihood and impact, treatment, and residual risk","Only the vulnerabilities discovered in the most recent scan","The list of employees who completed security awareness training","The currently approved firewall ruleset"],c:0,e:"The register is the living record of identified risks, each with an accountable owner, an assessment, a chosen treatment, KRIs for early warning, and the residual risk after treatment."},
{d:5,o:"5.2",t:"RTO vs RPO",df:3,q:"A BIA sets an RTO of 8 hours and an RPO of 1 hour for an order system. What do these mean?",a:["The system must be operational within 8 hours, and no more than 1 hour of data may be lost","The system must be operational within 1 hour, and no more than 8 hours of data may be lost","Backups must run every 8 hours and be restored within 1 hour","Mean time to repair is 8 hours and mean time between failures is 1 hour"],c:0,e:"RTO is a time-to-restore target that drives recovery architecture; RPO is a data-loss tolerance that drives backup and replication frequency. MTTR and MTBF are reliability measures, not recovery objectives."},
{d:5,o:"5.2",t:"MTBF vs MTTR",df:2,q:"Which metric would an organization use to compare the expected reliability of two hardware models before purchase?",a:["Mean time between failures","Mean time to repair","Recovery point objective","Annualized rate of occurrence"],c:0,e:"MTBF estimates how long a repairable component runs between failures, indicating reliability. MTTR measures how long restoration takes once a failure occurs and drives spare-parts and staffing decisions."},
{d:5,o:"5.2",t:"Assessment cadence",df:2,q:"The board commissions a risk assessment with a defined scope and end date to inform a single decision: whether to acquire a competitor. It is not intended to repeat. This is BEST described as:",a:["A one-time assessment","A recurring assessment","A continuous assessment","An ad hoc assessment performed reactively, with no defined scope or schedule"],c:0,e:"A one-time assessment is deliberately scoped to a single decision with a defined beginning and end. Recurring assessments run on a schedule, continuous assessment is ongoing and automated, and ad hoc is unplanned and reactive with no defined scope."},
{d:5,o:"5.2",t:"Risk threshold",df:3,q:"A key risk indicator crosses its defined threshold. What should happen next?",a:["The risk owner is notified and the escalation response begins","The KRI is redefined so it no longer triggers","The risk is automatically accepted","The finding is closed as a false positive"],c:0,e:"A threshold exists precisely so that crossing it triggers a predefined response and escalation to the accountable owner. Adjusting the threshold to silence it defeats the purpose of the indicator."},
{d:5,o:"5.3",t:"Right-to-audit clause",df:2,q:"Which contract provision allows a customer to inspect a vendor's security controls directly rather than relying solely on the vendor's own reporting?",a:["Right-to-audit clause","Service level agreement","Non-disclosure agreement","Memorandum of understanding"],c:0,e:"A right-to-audit clause must be negotiated before signing; without it the customer has no contractual basis to demand access. SLAs define performance, and NDAs govern confidentiality."},
{d:5,o:"5.3",t:"SLA vs MOU vs MSA",df:3,q:"Which agreement type defines measurable performance commitments such as uptime percentage and response times, with remedies for failure?",a:["Service level agreement","Memorandum of understanding","Master service agreement","Business partners agreement"],c:0,e:"An SLA specifies the performance metrics and consequences. An MOU is a non-binding statement of intent, an MSA sets the overarching terms for future work, and a BPA governs a partnership arrangement."},
{d:5,o:"5.3",t:"SOW / work order",df:2,q:"Under an existing master service agreement, which document defines the specific deliverables, timeline, and price for one engagement?",a:["Statement of work or work order","Non-disclosure agreement","Memorandum of agreement","Right-to-audit clause"],c:0,e:"The MSA establishes the legal framework once; each engagement is then scoped by an SOW or work order, avoiding renegotiation of the master terms every time."},
{d:5,o:"5.3",t:"Vendor due diligence",df:2,q:"Before onboarding a payroll SaaS provider, the security team reviews the vendor's SOC 2 Type II report, penetration test summary, and financial stability. Which activity is this?",a:["Vendor due diligence during selection","Vendor monitoring after contract award","Supply chain analysis of the vendor's suppliers","A rules of engagement negotiation"],c:0,e:"Due diligence is the pre-contract investigation of a prospective vendor's security, financial, and legal posture. Monitoring is the ongoing assessment once the relationship exists."},
{d:5,o:"5.3",t:"Conflict of interest",df:2,q:"During vendor selection, the evaluator scoring the proposals holds equity in one bidder. Which concern must be addressed?",a:["Conflict of interest requiring disclosure and recusal","Data sovereignty requiring a regional contract","A right-to-audit clause requiring negotiation","A rules of engagement document requiring signature"],c:0,e:"An undisclosed financial interest compromises the integrity of the selection. Disclosure and removal from the evaluation preserve the fairness and defensibility of the decision."},
{d:5,o:"5.3",t:"Vendor monitoring",df:2,q:"Which practice provides ongoing assurance that a vendor's security posture has not degraded after contract signature?",a:["Periodic questionnaires and review of updated assessments","A one-time review of the vendor's marketing security page","The NDA signed at the start of the relationship","The original statement of work only"],c:0,e:"Third-party risk is continuous, not a point-in-time event. Recurring questionnaires, refreshed attestations, and external risk ratings detect drift over the life of the contract."},
{d:5,o:"5.4",t:"Due care vs due diligence",df:3,q:"Which pair correctly defines these terms?",a:["Due diligence is the investigation; due care is acting reasonably on it","Due care is the investigation; due diligence is acting on the findings","Both refer exclusively to vendor selection","Both are synonyms for regulatory attestation"],c:0,e:"Due diligence is the homework: assessing, researching, and understanding the risk. Due care is the prudent action taken as a result. Courts examine both when judging negligence."},
{d:5,o:"5.4",t:"Non-compliance consequences",df:2,q:"A healthcare provider fails a regulatory examination. Which consequence is UNIQUE to regulated industries compared with a purely contractual failure?",a:["Loss of license to operate","Reputational damage","Contractual penalties","Increased insurance premiums"],c:0,e:"Regulators can suspend or revoke the authorization to operate, which no contract counterparty can do. Fines, sanctions, reputational harm, and contractual impacts can arise in both contexts."},
{d:5,o:"5.4",t:"Attestation & acknowledgement",df:2,q:"Employees are required to read and electronically sign the updated acceptable use policy each year. Which compliance monitoring element is this?",a:["Attestation and acknowledgement","External compliance reporting","A right to be forgotten request","A data inventory review"],c:0,e:"Acknowledgement records that individuals have received and accepted the requirement, creating evidence for enforcement and for auditors."},
{d:5,o:"5.4",t:"Right to be forgotten",df:2,q:"A customer submits a valid request to erase their personal data. Which privacy concept applies, and what limits it?",a:["Right to be forgotten; it is limited by legal retention obligations","Data sovereignty; it is limited by the storage region","Attestation; it is limited by the acknowledgement date","Due care; it is limited by the vendor contract"],c:0,e:"The right to erasure requires deletion on request but yields where the organization has an overriding legal duty to retain, such as tax or regulatory record-keeping. A data inventory is what makes fulfilling the request possible."},
{d:5,o:"5.4",t:"Internal vs external reporting",df:2,q:"Compliance reporting delivered to a regulator or a certifying body is classified as:",a:["External compliance reporting","Internal compliance reporting","Attestation","A self-assessment"],c:0,e:"Internal reporting informs management and the board; external reporting satisfies obligations to regulators, auditors, customers, or certification bodies and carries greater consequence for inaccuracy."},
{d:5,o:"5.5",t:"Pen test environment knowledge",df:3,q:"A tester is given only the company's name and must discover everything else independently. Which engagement type is this?",a:["Unknown environment (black box)","Known environment (white box)","Partially known environment (gray box)","An internal self-assessment"],c:0,e:"Unknown-environment testing most closely simulates an external attacker but spends much of the budget on discovery. Known-environment testing provides full documentation and credentials for maximum coverage per hour."},
{d:5,o:"5.5",t:"Passive vs active recon",df:2,q:"Which reconnaissance activity does NOT touch the target's systems?",a:["Reviewing WHOIS, certificate transparency logs, and LinkedIn","Running a SYN scan against the target's public IP range","Enumerating SMB shares on an internal host","Performing DNS zone transfer attempts against the target's name servers"],c:0,e:"Passive reconnaissance uses third-party and public sources and leaves no trace in the target's logs. Any packet sent to the target's infrastructure, including scans and zone transfer attempts, is active."},
{d:5,o:"5.5",t:"Internal audit vs external",df:2,q:"Which assessment provides the HIGHEST level of independent assurance to a prospective customer?",a:["An independent third-party audit","A management self-assessment","An internal audit performed by the security team","A vendor questionnaire completed by the organization"],c:0,e:"Independence from the organization being assessed is what gives the result external credibility. Self-assessments and internal audits are valuable for improvement but carry inherent conflict of interest."},
{d:5,o:"5.5",t:"Offensive vs defensive testing",df:3,q:"During an integrated exercise, one team attempts to compromise the environment while another defends it in real time. Which teams are these?",a:["A red team and a blue team, with purple integrating the two","A red team and a white team performing the same offensive role","A blue team attacking and a red team defending","An audit committee and a regulatory examiner"],c:0,e:"Red is offensive, blue is defensive, white cell manages the exercise, and purple describes the integrated collaboration that turns attack findings into detection improvements."},
{d:5,o:"5.5",t:"Rules of engagement",df:2,q:"Which document defines a penetration test's permitted targets, testing windows, prohibited techniques, and emergency contacts?",a:["Rules of engagement","Statement of work only","Non-disclosure agreement","Right-to-audit clause"],c:0,e:"Rules of engagement set the operational boundaries and authorization that keep testing lawful and safe. Without it the tester has no documented authorization for otherwise illegal activity."},
{d:5,o:"5.6",t:"Phishing campaign metrics",df:3,q:"After a simulated phishing campaign, which metric BEST indicates improving security culture?",a:["The reporting rate, especially relative to the click rate","The total number of emails that were sent","The number of employees who deleted the message without reporting","The average time employees spent reading the message"],c:0,e:"Click rate measures susceptibility, but reporting rate measures whether the organization gains early warning. A workforce that reports quickly shortens detection time even when someone clicks."},
{d:5,o:"5.6",t:"Anomalous behavior recognition",df:2,q:"A user reports that a colleague asked them to bypass the change process 'just this once' for a production database edit. Which category of anomalous behavior is this?",a:["Risky behavior that should be reported and reviewed","Unintentional behavior requiring no action","Expected behavior under normal operations","A false positive of the awareness program"],c:0,e:"Deliberately circumventing a control is risky behavior regardless of intent, and awareness programs specifically train users to recognize and report it. Unintentional behavior is a mistake rather than a knowing bypass."},
{d:5,o:"5.6",t:"Operational security training",df:2,q:"Which training topic MOST directly addresses employees discussing project details in public places and on social media?",a:["Operational security","Password management","Removable media handling","Hybrid and remote work practices"],c:0,e:"OPSEC teaches people to recognize which fragments of information are valuable to an adversary and to control their disclosure, since aggregated small details enable targeted attacks."},
{d:5,o:"5.6",t:"Insider threat awareness",df:2,q:"What is the primary goal of insider threat awareness training for general staff?",a:["To help employees recognize and report insider indicators","To grant employees access to the insider threat investigation case files","To replace technical monitoring controls","To require employees to sign a new NDA"],c:0,e:"Peers often observe indicators long before technical controls fire. The training teaches recognition and the reporting path, complementing rather than replacing monitoring."},
{d:5,o:"5.6",t:"Program development & execution",df:3,q:"Which sequence describes a mature security awareness program?",a:["Develop from real risk, execute recurring training, monitor, then revise","Execute annual training, then develop content, then archive the results","Monitor behavior only after an incident, then develop policy","Develop content once and repeat it unchanged each year"],c:0,e:"The program is a cycle: content driven by the organization's actual threat profile, recurring rather than one-time delivery, measurement of resulting behavior, and revision informed by that measurement."},
/* ==== ADDITIONS: Domain 1 ==== */
{d:1,o:"1.1",t:"Access control vestibule",df:2,q:"A data center entrance is fitted with an interlocking two-door vestibule that permits only one person through at a time. Which category and type is this control?",a:["Physical category, preventive type","Physical category, detective type","Operational category, deterrent type","Technical category, compensating type"],c:0,e:"An access control vestibule (mantrap) physically prevents tailgating rather than discouraging or recording it, so it is physical and preventive. A camera at the same door would be physical and detective."},
{d:1,o:"1.1",t:"Training as a control",df:3,q:"An organization delivers mandatory quarterly security awareness training. How is this BEST classified?",a:["Operational category, preventive type","Technical category, directive type","Managerial category, corrective type","Physical category, deterrent type"],c:0,e:"Training is carried out by people as part of day-to-day operations, so the category is operational, and it aims to stop incidents before they happen, so the type is preventive. The written policy requiring the training would be managerial and directive."},
{d:1,o:"1.1",t:"Detective technical controls",df:2,q:"A SIEM correlation rule that raises an alert when a service account authenticates from a new country is which category and type?",a:["Technical category, detective type","Technical category, preventive type","Operational category, corrective type","Managerial category, directive type"],c:0,e:"The control is implemented in technology and it discovers the condition rather than blocking it, so technical and detective. If the same rule automatically disabled the account, the response action would be corrective."},
{d:1,o:"1.2",t:"CIA: availability",df:2,q:"A distributed denial-of-service attack makes a public API unreachable for two hours. No data was read or altered. Which element of the CIA triad was affected?",a:["Availability","Confidentiality","Integrity","Non-repudiation"],c:0,e:"Availability is the assurance that systems and data are reachable when needed. Nothing was disclosed (confidentiality) and nothing was altered (integrity); denial of service attacks availability specifically."},
{d:1,o:"1.2",t:"Authenticating systems",df:3,q:"Two backend services must prove their identity to each other with no human involved, and stolen passwords must not be sufficient. Which approach fits BEST?",a:["Mutual TLS using certificates issued to each service","A shared API key stored in each service's configuration file","HTTP basic authentication over TLS","IP allow lists on both sides"],c:0,e:"Authenticating systems rather than people calls for cryptographic machine identity. Mutual TLS proves possession of a private key in both directions. Shared keys and basic auth are shared secrets, and IP allow lists authenticate a network location, not an identity."},
{d:1,o:"1.2",t:"Implicit deny",df:2,q:"An authorization model grants no access unless a rule explicitly permits it. What is this principle called?",a:["Implicit deny","Least privilege","Separation of duties","Discretionary access"],c:0,e:"Implicit deny is the default-deny posture: anything not explicitly permitted is refused. Least privilege is about the size of the grant once access is permitted, and separation of duties splits a sensitive task across people."},
{d:1,o:"1.2",t:"Honeypot purpose",df:3,q:"A security team stands up a decoy server that mimics a vulnerable file share but contains no production data. What are the two primary benefits? (Select TWO.)",a:["Any interaction with it is a high-fidelity indicator, because it has no legitimate use","It consumes attacker time and effort that would otherwise be spent on real systems","It patches the vulnerability the attacker was seeking","It satisfies the requirement for network segmentation"],c:[0,1],m:true,e:"A honeypot's value is a near-zero false positive rate (nothing legitimate should ever touch it) plus disruption of the attacker's timeline. It neither remediates vulnerabilities nor provides segmentation."},
{d:1,o:"1.3",t:"Emergency change",df:3,q:"A critical zero-day must be patched on internet-facing servers within hours, outside the normal CAB cycle. What is the correct handling?",a:["Follow the emergency change procedure and obtain retroactive CAB review","Apply the patch and skip documentation because the change was urgent","Wait for the next scheduled CAB meeting","Ask each server owner for individual verbal approval only"],c:0,e:"Mature change management includes a defined emergency path with an abbreviated approval and mandatory retroactive review and documentation. Urgency changes the sequence, never the requirement to record what was done."},
{d:1,o:"1.3",t:"Standard operating procedure",df:2,q:"What is the purpose of a standard operating procedure within change management?",a:["It defines repeatable steps for a known change type","It records the business justification and residual risk acceptance","It lists the systems that will be unavailable during the maintenance window","It specifies the minimum password length for service accounts"],c:0,e:"An SOP makes execution consistent and auditable across staff. Justification and risk acceptance belong to the change owner and the request, and downtime belongs to the impact analysis."},
{d:1,o:"1.3",t:"Impact analysis vs test results",df:3,q:"A change request contains a section predicting which services could be disrupted and which teams must be notified, and a separate section showing the change was validated in a staging environment. Which two elements are these, in order?",a:["Impact analysis, then test results","Test results, then impact analysis","Backout plan, then maintenance window","Stakeholder list, then approval process"],c:0,e:"Impact analysis is the forward-looking prediction of consequences and affected parties. Test results are the evidence the change actually works. A CAB expects both; one is a forecast, the other is proof."},
{d:1,o:"1.4",t:"Symmetric vs asymmetric roles",df:3,q:"In a TLS session, which statement correctly describes how the two families of cryptography are used?",a:["Asymmetric authenticates and establishes the secret; symmetric encrypts the session","Symmetric cryptography authenticates the server; asymmetric cryptography encrypts the session data","Only asymmetric cryptography is used, for both authentication and bulk data","Only symmetric cryptography is used, with the key preshared out of band"],c:0,e:"Asymmetric operations are computationally expensive, so they are used briefly for authentication and key exchange. The negotiated symmetric key then encrypts the bulk traffic because symmetric ciphers are far faster."},
{d:1,o:"1.4",t:"Root of trust & chain validation",df:3,q:"A browser trusts a website's certificate. Which condition MUST be true?",a:["It chains to a root CA in the browser's trust store, unexpired and unrevoked","The certificate is signed by the website's own private key","The certificate is a wildcard certificate","The certificate uses the same algorithm as the browser's preferred cipher suite"],c:0,e:"Trust is anchored in a preinstalled root (the root of trust) and validated hop by hop through any intermediates. A certificate signed by its own key is self-signed and produces a warning unless the root is manually trusted."},
{d:1,o:"1.4",t:"Blockchain & public ledger",df:2,q:"Which property of a blockchain provides tamper evidence for recorded transactions?",a:["Each block hashes the previous one, so altering one invalidates the rest","Each block is encrypted with the participant's private key","Blocks are stored on a single authoritative server","Each block is digitally masked before publication"],c:0,e:"Chained hashing plus distributed replication across an open public ledger makes retroactive alteration detectable and impractical. Blockchain provides integrity and transparency, not confidentiality."},
{d:1,o:"1.4",t:"Encryption levels",df:3,q:"A compliance requirement states that only the social security number column in a customer table may be encrypted, and application code must decrypt it per query. Which encryption level is required?",a:["Record or field level encryption","Full-disk encryption on the server","Volume level encryption of the data drive","Partition level encryption only"],c:0,e:"Full-disk, volume, and partition encryption protect data only while the media is at rest and powered off; a running database exposes everything to any authorized query. Column, field, or record level encryption keeps the sensitive field protected in the live database."},
/* ==== ADDITIONS: Domain 2 ==== */
{d:2,o:"2.1",t:"Nation-state vs organized crime",df:3,q:"Which factor MOST reliably distinguishes a nation-state operation from an organized crime operation when both are technically sophisticated?",a:["The objective: strategic intelligence versus monetizable gain","The malware family and tooling used","Whether the attack originates from inside or outside the country","The time of day at which the intrusion occurs"],c:0,e:"Tooling and infrastructure increasingly overlap, so motivation is the reliable discriminator. Espionage, prepositioning, and disruption of critical services point to a state; ransomware, fraud, and data resale point to crime."},
{d:2,o:"2.1",t:"Revenge motivation",df:2,q:"A recently demoted database administrator copies the customer table to personal cloud storage and posts a sample publicly. Which actor type and motivation apply?",a:["Insider threat motivated by revenge","Hacktivist motivated by philosophical belief","Organized crime motivated by financial gain","Unskilled attacker motivated by chaos"],c:0,e:"A current employee abusing legitimate access is an insider threat, and the demotion supplies the grievance, which maps to revenge. There is no cause, no payment, and no reliance on borrowed tooling."},
{d:2,o:"2.1",t:"Internal vs external attribute",df:2,q:"Why is the internal versus external attribute of a threat actor significant when planning controls?",a:["Internal actors already hold valid credentials inside the perimeter","External actors are always more sophisticated than internal ones","Internal actors are always unintentional","External actors cannot obtain valid credentials"],c:0,e:"The attribute determines where your controls must sit. Against insiders, the effective controls are least privilege, separation of duties, monitoring, and data-centric protection rather than the firewall."},
{d:2,o:"2.2",t:"Pretexting",df:2,q:"A caller claiming to be from the building's fire safety inspector asks the receptionist to confirm the names of after-hours staff and the location of the server room. Which technique is this?",a:["Pretexting","Typosquatting","Watering hole","Credential replay"],c:0,e:"Pretexting invents a plausible scenario and false identity to make the request seem routine. It is usually the setup phase for a later, more targeted attack rather than the payoff itself."},
{d:2,o:"2.2",t:"Misinformation & disinformation",df:3,q:"Coordinated fake accounts spread a fabricated claim that a bank has frozen customer withdrawals, triggering a spike in support calls and account closures. Which threat vector is this?",a:["Disinformation, which is false content spread deliberately to cause harm","Misinformation, which is false content spread without intent to deceive","Brand impersonation of the bank's mobile application","A business email compromise campaign"],c:0,e:"The distinction is intent: misinformation is false and spread unknowingly, disinformation is false and spread deliberately. Coordinated fake accounts establish intent, making this disinformation."},
{d:2,o:"2.2",t:"Image and file based vectors",df:2,q:"An attacker embeds a malicious macro in a document and a second-stage payload inside the metadata of an image file. Which two threat vectors are in use? (Select TWO.)",a:["File-based vector","Image-based vector","Voice call vector","Removable device vector"],c:[0,1],m:true,e:"The objectives list message-based, image-based, file-based, voice call, and removable device vectors separately. Documents carrying active content are file-based; payloads hidden in image data are image-based, and steganography is the usual technique."},
{d:2,o:"2.2",t:"Unsecure networks",df:3,q:"A sales team routinely connects to hotel and airport wireless networks. Which control MOST directly reduces the risk of that unsecure network vector?",a:["An always-on VPN that tunnels all traffic","A longer screen lock timeout on the laptops","Disabling the laptops' webcams","Requiring quarterly password changes"],c:0,e:"On an untrusted network the threat is interception and on-path manipulation. An always-on tunnel makes the local network irrelevant to confidentiality and integrity. The other options do not address traffic exposure."},
{d:2,o:"2.3",t:"Buffer overflow",df:2,q:"An application copies user-supplied input into a fixed-length stack buffer without checking the length, allowing an attacker to overwrite the return address. Which vulnerability is this, and what is the root-cause fix?",a:["Buffer overflow; use bounds-checked functions and validate input length","Race condition; introduce a mutex around the copy","Directory traversal; canonicalize the file path","Cryptographic weakness; increase the key length"],c:0,e:"Writing past the end of an allocated buffer is a classic memory-safety flaw. The fix is bounds checking and safe string handling; ASLR, DEP, and stack canaries are mitigations that make exploitation harder but do not remove the flaw."},
{d:2,o:"2.3",t:"Misconfiguration",df:2,q:"A public cloud storage bucket holding customer invoices is readable by anyone on the internet because its access policy was never changed from the default used during testing. Which vulnerability category is this?",a:["Misconfiguration","Zero-day","Supply chain vulnerability","Race condition"],c:0,e:"Misconfiguration is the deployment of a system in an insecure state, and it is consistently one of the most common causes of cloud data exposure. The software itself is not flawed, so it is not a zero-day."},
{d:2,o:"2.3",t:"Cryptographic vulnerability",df:3,q:"An application generates session tokens using a pseudorandom number generator seeded with the current time in seconds. Which vulnerability class is this, and what is the impact?",a:["A cryptographic vulnerability; insufficient entropy makes tokens predictable","A misconfiguration; the token length is too short","A race condition; two users may receive the same token simultaneously","An injection flaw; the token can carry executable content"],c:0,e:"Weak entropy in key or token generation is a cryptographic vulnerability. An attacker who knows the approximate generation time can enumerate a small keyspace and forge valid tokens. Use a cryptographically secure random source."},
{d:2,o:"2.3",t:"Cloud-specific vulnerability",df:3,q:"An over-permissive cloud IAM role attached to a compute instance allows it to assume other roles across the account. Which vulnerability type does this represent?",a:["A cloud-specific vulnerability from excessive identity permissions","A virtualization vulnerability enabling VM escape","A hardware vulnerability in the host firmware","A supply chain vulnerability introduced by the cloud provider"],c:0,e:"In cloud environments identity is the perimeter, and permission chaining lets a single compromised workload escalate across the account. It is a customer-side configuration and design issue, not a provider or hypervisor flaw."},
{d:2,o:"2.4",t:"Directory traversal",df:2,q:"A web server request for /download?file=../../../../etc/passwd returns the contents of the system password file. Which attack is this, and which control prevents it?",a:["Directory traversal; validate the path against an allow list","SQL injection; switch to parameterized queries","Buffer overflow; enable stack canaries and ASLR","Replay attack; add a nonce to each request"],c:0,e:"Directory traversal escapes the intended directory using relative path sequences. The fix is to resolve the path fully and confirm it stays within the permitted base directory, never to filter the string alone."},
{d:2,o:"2.4",t:"Replay attack",df:3,q:"An attacker captures an authentication token in transit and resubmits it later to gain access without ever knowing the password. Which attack is this, and which control defeats it?",a:["Credential replay; use nonces and short token lifetimes","Brute force; enforce an account lockout threshold","Collision attack; increase the hash length","Privilege escalation; apply least privilege"],c:0,e:"Replay reuses valid captured data. Freshness values (nonces, sequence numbers, timestamps) make a captured message valid only once, and short expiry limits the window."},
{d:2,o:"2.4",t:"Concurrent session usage",df:2,q:"A user account is simultaneously active from a corporate laptop and from an unmanaged device in another country. Which indicator is this, and what is the likely cause?",a:["Concurrent session usage, indicating a compromised credential","Out-of-cycle logging, likely indicating a clock synchronization problem","Resource consumption, likely indicating a runaway process","Blocked content, likely indicating a web filter rule"],c:0,e:"Concurrent sessions from incompatible contexts suggest the credential is being used by someone else. It is closely related to impossible travel, but here both sessions are live at the same time."},
{d:2,o:"2.4",t:"Birthday and collision attacks",df:3,q:"An attacker produces two different documents that hash to the same value under a legacy hash function, then substitutes one for the other after signing. Which attack is this?",a:["A collision attack, made feasible by the birthday problem","A downgrade attack against the signing protocol","A replay attack against the signature","A brute force attack against the private key"],c:0,e:"A collision means two distinct inputs share a digest, which destroys the integrity guarantee a signature depends on. The birthday paradox means collisions are found far faster than the digest length naively suggests, which is why MD5 and SHA-1 are deprecated."},
{d:2,o:"2.4",t:"Resource inaccessibility",df:2,q:"Users report that a file share, a database, and an internal web application all became unreachable within the same five minutes, while network links stayed up. Which indicator category is this, and what should be considered FIRST?",a:["Resource inaccessibility, possibly ransomware or a failed dependency","Impossible travel, indicating a compromised credential","Blocked content, indicating a web filter change","Missing logs, indicating anti-forensic activity"],c:0,e:"Multiple unrelated services failing at once points to a shared dependency (directory services, storage, DNS) or an active destructive event. It is an availability indicator that warrants immediate triage rather than routine troubleshooting."},
{d:2,o:"2.5",t:"Isolation",df:3,q:"During an active incident, a compromised host must be prevented from communicating with anything while remaining powered on for memory acquisition. Which mitigation applies?",a:["Isolation, by moving the host to a quarantine VLAN","Decommissioning, by wiping and reimaging the host","Patching, by applying all pending updates","Encryption, by enabling full-disk encryption on the host"],c:0,e:"Isolation cuts communication while preserving the system for forensics. Wiping destroys evidence, patching does not remove an active intruder, and encrypting a compromised running host achieves nothing."},
{d:2,o:"2.5",t:"Monitoring as mitigation",df:2,q:"Which statement correctly describes the role of monitoring in an enterprise mitigation strategy?",a:["It does not prevent the attack, but it shortens time to detect","Monitoring blocks malicious traffic before it reaches the host","Monitoring removes the need for segmentation once fully deployed","Monitoring is a physical control category"],c:0,e:"Monitoring is a detective control. Its value is reducing dwell time, which limits how much damage an intrusion can do, but it never substitutes for preventive controls such as segmentation and least privilege."},
{d:2,o:"2.5",t:"Host-based firewall vs HIPS",df:3,q:"How does a host-based intrusion prevention system differ from a host-based firewall?",a:["A host firewall filters by port and protocol; a HIPS inspects behavior and content","A HIPS filters by port only, while a host firewall inspects behavior","They are the same control under different vendor names","A host firewall operates in the kernel and a HIPS operates in hardware"],c:0,e:"The firewall answers whether a connection is allowed; the HIPS answers whether the observed behavior is malicious. Because attackers hide inside permitted ports such as 443, both layers are needed."},
{d:2,o:"2.5",t:"Default password changes",df:1,q:"A penetration test gains administrative access to twelve network printers and two switches using credentials published in the vendor manuals. Which hardening step was missed?",a:["Changing default passwords during deployment","Enabling full-disk encryption","Installing endpoint detection and response agents","Applying network segmentation"],c:0,e:"Default credentials are documented publicly and are among the first things scanned for. Changing them is a baseline hardening step that belongs in the deployment procedure for every device class, including printers and appliances."},
/* ==== ADDITIONS: Domain 3 ==== */
{d:3,o:"3.1",t:"Centralized vs decentralized",df:3,q:"A company consolidates logging, identity, and policy management into a single platform. Which trade-off does this architectural choice introduce?",a:["Consistent enforcement and visibility, but a high-value single point of failure","Lower consistency but greater resilience to a single compromise","Reduced need for access control on the platform itself","Elimination of the need for backups of the platform"],c:0,e:"Centralization buys uniformity, easier auditing, and faster response. It concentrates risk, so the central platform needs the strongest protection and its own resilience plan. Decentralization inverts both."},
{d:3,o:"3.1",t:"Inability to patch",df:3,q:"An architecture review flags a fleet of embedded controllers whose vendor has ceased operations. Which architectural consideration is the dominant concern, and what follows from it?",a:["Inability to patch, which forces compensating controls and isolation","Responsiveness, which forces a move to serverless","Cost, which forces consolidation onto fewer devices","Ease of deployment, which forces infrastructure as code"],c:0,e:"When patch availability ends, risk grows with every new CVE and cannot be reduced by normal means. Architecture must respond with isolation, compensating controls, monitoring, and a funded end-of-life replacement timeline."},
{d:3,o:"3.1",t:"IoT architecture risks",df:2,q:"Which combination of characteristics makes consumer-grade IoT devices a particular risk on an enterprise network?",a:["Weak authentication, rare firmware updates, and no host agent","Excessive compute capacity and aggressive patch cadence","Strong default encryption and centralized management","Full support for enterprise MDM enrollment"],c:0,e:"IoT devices are typically shipped with weak defaults, are rarely updated, and cannot run agents, which is why the standard answer is a dedicated segment with tightly controlled flows rather than host hardening."},
{d:3,o:"3.1",t:"High availability vs resilience",df:3,q:"Which statement correctly distinguishes high availability from resilience?",a:["High availability covers expected component failure; resilience absorbs larger disruption","Resilience minimizes downtime for expected failures; high availability handles disasters","They are identical concepts measured differently","High availability applies only to storage and resilience only to networks"],c:0,e:"High availability is engineered redundancy for anticipated failures, measured in uptime. Resilience is broader: architecture, process, and people absorbing a shock such as a region loss or a destructive attack and returning to service."},
{d:3,o:"3.2",t:"Device placement",df:3,q:"An organization wants to inspect and block malicious traffic between its user VLAN and its server VLAN. Where should the inspection device be placed?",a:["Inline at the routed boundary between the two VLANs","On a SPAN port at the internet edge","On the server VLAN as a passive tap only","Outside the perimeter firewall facing the internet"],c:0,e:"A device can only act on traffic that passes through it. East-west traffic between internal segments never reaches the internet edge, so inspection must sit at the internal boundary, and it must be inline to block rather than only alert."},
{d:3,o:"3.2",t:"Load balancer security role",df:2,q:"Beyond distributing traffic, which security functions does a load balancer commonly provide?",a:["TLS offload, health checks, and connection flood absorption","Signature-based malware detection on endpoints","Directory services and user authentication","Full-disk encryption of backend storage"],c:0,e:"Load balancers centralize certificate management, keep unhealthy nodes out of rotation to protect availability, and provide a first layer against volumetric floods. They are not endpoint or identity controls."},
{d:3,o:"3.2",t:"Active vs passive devices",df:2,q:"A security appliance is described as passive. What does this mean?",a:["It sees a copy of traffic and can alert, but cannot block","It blocks all traffic by default until a rule permits it","It requires no power or configuration at all","It only operates during scheduled maintenance windows"],c:0,e:"Passive devices sit off the forwarding path on a tap or SPAN port. Active devices sit in the path and can change what happens to a packet, at the cost of latency and a new failure mode."},
{d:3,o:"3.2",t:"Remote access VPN vs tunneling",df:3,q:"A remote workforce needs encrypted access to internal applications, and the security team also wants internet-bound traffic inspected by corporate controls. Which configuration achieves both?",a:["A full-tunnel remote access VPN through the corporate gateway","A split-tunnel VPN, which sends only internal traffic through the gateway","A site-to-site IPSec tunnel between two offices","A reverse proxy published to the internet"],c:0,e:"Split tunneling improves performance but lets internet traffic bypass corporate inspection entirely. Full tunnel backhauls everything, which is the requirement here, at the cost of bandwidth and latency."},
{d:3,o:"3.3",t:"Data in transit controls",df:2,q:"Which pair of controls protects data specifically while in transit across an untrusted network?",a:["TLS and IPSec","AES full-disk encryption and secure boot","Data masking and tokenization","Role-based access control and MFA"],c:0,e:"Transit protection means encrypting the channel. TLS operates at the transport layer for application sessions and IPSec at the network layer for tunnels. Disk encryption protects data at rest; masking and tokenization are obfuscation methods."},
{d:3,o:"3.3",t:"Trade secret vs intellectual property",df:3,q:"A soft drink formula is protected by never being disclosed rather than by registration. Which data type is this, and what follows for its handling?",a:["A trade secret, which is protected only by keeping it secret","Regulated data, whose handling is dictated by statute","Public data, which requires no handling controls","Legal information, which is protected by privilege"],c:0,e:"A trade secret derives its value and its legal protection from not being publicly known; once disclosed, the protection is gone permanently. Patents and copyrights are registered forms of intellectual property that trade secrecy deliberately avoids."},
{d:3,o:"3.3",t:"Geographic restrictions",df:2,q:"An application must refuse connections originating from countries where the company holds no licence to operate. Which protection method is this?",a:["Geographic restrictions, or geofencing","Data sovereignty, enforced by encryption at rest","Segmentation, enforced by VLAN assignment","Tokenization of the client identifier"],c:0,e:"Geographic restrictions limit access or storage by location. Note the distinction: geo-blocking controls where users connect FROM; data sovereignty controls where data is stored."},
{d:3,o:"3.3",t:"Obfuscation methods compared",df:3,q:"Which statement correctly orders three obfuscation methods by reversibility?",a:["Steganography and tokenization are reversible; hashing is not","Hashing and masking are both reversible; tokenization is not","All three are fully reversible by design","None of the three can ever be reversed"],c:0,e:"Steganography hides data inside a carrier file and can be extracted again; tokenization is reversible only through the vault; hashing is one-way by design. Masking, when applied destructively, is also irreversible."},
{d:3,o:"3.4",t:"Geographic dispersion",df:2,q:"A company replicates its production environment to a second data center 900 kilometres away rather than to a facility across the street. What is the PRIMARY reason?",a:["It protects against regional events such as flood or grid failure","Longer distance reduces replication latency measurably","A nearby site cannot be encrypted at rest","Regulators require exactly 900 kilometres of separation"],c:0,e:"Dispersion ensures a single regional event cannot take both sites. The trade-off is replication latency and cost, which is why the distance chosen balances risk against RPO."},
{d:3,o:"3.4",t:"Backup frequency and encryption",df:3,q:"Which two properties should a backup set have to be useful against ransomware AND compliant with data protection requirements? (Select TWO.)",a:["At least one copy that is offline or immutable and outside the production trust boundary","Encryption of the backup data at rest and in transit","Storage on the same SAN as production for fastest restore","Retention of only the most recent backup to reduce storage cost"],c:[0,1],m:true,e:"Immutability or air gap prevents an attacker with production privileges from destroying the recovery path. Encryption protects the backup, which is a full copy of the crown jewels, from theft. Same-SAN storage and single-copy retention both defeat the purpose."},
{d:3,o:"3.4",t:"Continuity of operations",df:2,q:"What does a continuity of operations plan provide that a disaster recovery plan does not?",a:["Manual and workaround procedures that keep essential functions running","A prioritized list of servers to restore first","The recovery point and recovery time objective for each system","The technical procedure for failing over to a secondary site"],c:0,e:"Disaster recovery is technology restoration. Continuity of operations is broader and business-facing: who does what, from where, using which alternative process, while the technology is still down."},
/* ==== ADDITIONS: Domain 4 ==== */
{d:4,o:"4.1",t:"Hardening ICS and RTOS",df:3,q:"Which hardening approach is appropriate for a real-time operating system controlling a production line, where an agent cannot be installed and a reboot requires a scheduled outage?",a:["Restrict network reachability and disable unused services","Install an EDR agent and enable real-time scanning","Enable automatic updates so patches apply immediately","Enrol the controller in the corporate MDM"],c:0,e:"RTOS and ICS targets have minimal resources and hard timing constraints, so host agents and automatic reboots are unacceptable. Hardening becomes network reachability control, surface reduction, and disciplined change management."},
{d:4,o:"4.1",t:"MDM capabilities",df:2,q:"Which capability distinguishes mobile device management from simply requiring a screen lock?",a:["Policy enforcement, remote wipe, and application control","The ability to change the device wallpaper remotely","Faster cellular data speeds for managed devices","Automatic replacement of lost or stolen hardware"],c:0,e:"MDM is the enforcement point for mobile baselines: it pushes configuration, verifies posture, restricts applications, and can selectively or fully wipe corporate data on loss or termination."},
{d:4,o:"4.1",t:"Secure cookies",df:3,q:"Which two cookie attributes reduce the risk of session hijacking? (Select TWO.)",a:["HttpOnly, which prevents client-side script from reading the cookie","Secure, which prevents the cookie from being sent over unencrypted HTTP","Expires, which sets a long lifetime for user convenience","Domain, which broadens the cookie to all subdomains"],c:[0,1],m:true,e:"HttpOnly blocks theft via cross-site scripting and Secure blocks interception in cleartext. Long lifetimes and broad domain scope increase exposure rather than reducing it; SameSite additionally mitigates cross-site request forgery."},
{d:4,o:"4.1",t:"Sandboxing",df:2,q:"An email gateway detonates attachments in an isolated virtual environment and observes their behavior before delivery. Which technique is this?",a:["Sandboxing","Static code analysis","Code signing","Input validation"],c:0,e:"Sandboxing executes untrusted code in a contained environment to observe behavior, which catches malware that no signature covers. Static analysis inspects code without running it."},
{d:4,o:"4.2",t:"Procurement security",df:2,q:"At which stage of the asset lifecycle should security requirements such as supported patch lifetime and vendor attestation be established?",a:["Acquisition and procurement, before the purchase is committed","Decommissioning, when the asset is retired","Monitoring, once the asset is deployed","Only when an audit finding requires it"],c:0,e:"Requirements imposed before purchase are cheap; those imposed after deployment often cannot be met at all. Patch lifetime, support terms, and security attestation belong in the procurement criteria."},
{d:4,o:"4.2",t:"Asset classification",df:2,q:"Why must assets be classified as part of asset management rather than only inventoried?",a:["Classification sets the level of control, monitoring, and disposal rigor","Classification determines the depreciation schedule for accounting","Classification replaces the need for an owner","Classification is required only for physical assets"],c:0,e:"An inventory tells you what exists; classification tells you how much protection it needs. Without it, every asset is treated identically, which either wastes controls or under-protects the critical few."},
{d:4,o:"4.2",t:"Certification of destruction",df:2,q:"A third-party vendor destroys 400 decommissioned drives. What evidence should the organization retain?",a:["A certificate of destruction listing serials and method","The vendor's marketing brochure describing their process","An email from the vendor confirming pickup","A photograph of the loading dock at pickup"],c:0,e:"Accountability for the data does not transfer with the media. A serialized certificate ties specific assets to a specific destruction event and is what an auditor or regulator will ask to see."},
